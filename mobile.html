<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>滑动切换视频+物品层手动控制</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "PingFang SC", "Microsoft Yahei", sans-serif;
    }
    body {
      background: #000;
      overflow: hidden;
      height: 100vh;
    }

    /* 视频播放层（优化全屏显示） */
    .video-layer {
      width: 100vw;
      height: 100vh;
      position: relative;
      z-index: 1;
      cursor: pointer;
    }
    .video-player {
      width: 100%;
      height: 100%;
      object-fit: cover; /* 确保视频撑满全屏且不变形 */
      object-position: center;
    }

    /* 物品层（保持原有样式） */
    .item-layer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 80%;
      background: linear-gradient(180deg, #fef3e6 0%, #fff4e0 100%);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      z-index: 3;
      transition: transform 0.3s ease;
      overflow: hidden;
    }
    .ios-slide-bar {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 5px;
      background: rgba(0,0,0,0.2);
      border-radius: 3px;
      cursor: pointer;
    }
    .item-content {
      width: 100%;
      height: 100%;
      padding: 20px;
      overflow-y: auto;
      margin-top: 30px;
    }
    .item-layer.hide {
      transform: translateY(80%);
    }
  </style>
</head>
<body>
  <!-- 视频播放层 -->
  <div class="video-layer" id="videoLayer">
    <video class="video-player" id="videoPlayer" autoplay muted loop>
      <source src="https://save.aura.us.kg/Video/%E3%80%90%E5%93%B2%E9%A3%8E%E5%A3%81%E7%BA%B8%E3%80%91%E5%86%B7%E5%B3%BB%E8%A1%A8%E6%83%85-%E5%B0%8F%E7%99%BD%E8%8A%B1.mp4" type="video/mp4">
    </video>
  </div>

  <!-- 物品层 -->
  <div class="item-layer" id="itemLayer">
    <div class="ios-slide-bar" id="slideBar"></div>
    <div class="item-content">
      <h1 style="font-size:28px; text-align:center; margin-bottom:10px; color:#d82626; text-shadow: 2px 2px 4px rgba(0,0,0,0.1);">集友友金开红包</h1>
      <p style="text-align:center; color:#666; margin-bottom:20px;">和朋友互动集友友金，可提现 0 元 ></p>
      
      <!-- 红包进度条 -->
      <div style="display:flex; justify-content:center; gap:10px; margin-bottom:30px;">
        <div style="width:60px; height:80px; background:#ff3a3a; border-radius:8px; text-align:center; color:#fff; padding-top:10px; border:2px solid #fec84e;">0.3元</div>
        <div style="width:60px; height:80px; background:#ff3a3a; border-radius:8px; text-align:center; color:#fff; padding-top:10px; border:2px solid #fec84e;">3元</div>
        <div style="width:60px; height:80px; background:#ff3a3a; border-radius:8px; text-align:center; color:#fff; padding-top:10px; border:2px solid #fec84e;">10元</div>
        <div style="width:60px; height:80px; background:#ff3a3a; border-radius:8px; text-align:center; color:#fff; padding-top:10px; border:2px solid #fec84e;">10元</div>
      </div>

      <!-- 红包卡片 -->
      <div style="width:80%; margin:0 auto; background:#ff3a3a; border-radius:20px; padding:20px; text-align:center; color:#fff; position:relative; border:3px solid #fec84e; margin-bottom:30px;">
        <div style="font-size:48px; font-weight:bold;">0.3</div>
        <div style="font-size:18px; margin-bottom:10px;">元</div>
        <div style="width:80%; height:20px; background:#d12323; border-radius:10px; margin:0 auto; position:relative;">
          <div style="width:30%; height:20px; background:#fec84e; border-radius:10px;"></div>
        </div>
        <div style="margin-top:10px; font-size:16px;">还差 3000 友友金</div>
        <div style="position:absolute; bottom:-15px; left:50%; transform:translateX(-50%); width:30px; height:30px; background:#fec84e; border-radius:50%; border:2px solid #d12323; display:flex; align-items:center; justify-content:center;">
          <div style="width:12px; height:12px; background:#d12323; border-radius:2px;"></div>
        </div>
      </div>

      <!-- 互动模块 -->
      <div style="background:#fff; border-radius:12px; padding:15px; margin-bottom:20px;">
        <div style="display:flex; justify-content-between; align-items:center; margin-bottom:10px;">
          <div style="font-size:18px; font-weight:500;">和群友聊天</div>
          <div style="color:#ff3a3a; font-size:16px;">最高 <span style="font-size:24px; font-weight:bold;">60000</span></div>
        </div>
        <div style="display:flex; gap:10px; margin-bottom:15px;">
          <div style="width:30px; height:30px; border:2px dashed #ccc; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#ccc;">+</div>
          <div style="width:30px; height:30px; border:2px dashed #ccc; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#ccc;">+</div>
          <div style="width:30px; height:30px; border:2px dashed #ccc; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#ccc;">+</div>
          <div style="width:30px; height:30px; border:2px dashed #ccc; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#ccc;">+</div>
          <div style="width:30px; height:30px; border:2px dashed #ccc; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#ccc;">+</div>
        </div>
        <button style="width:100%; background:linear-gradient(90deg, #ff3a3a 0%, #ff6b6b 100%); color:#fff; border:none; border-radius:8px; padding:12px 0; font-size:16px; font-weight:500; cursor:pointer;">选择群聊</button>
      </div>

      <!-- 签到模块 -->
      <div style="background:#fff; border-radius:12px; padding:15px; display:flex; justify-content-between; align-items:center;">
        <div>
          <div style="display:flex; align-items:center; gap:8px; font-size:18px; font-weight:500;">
            <div style="width:24px; height:24px; background:#ff3a3a; border-radius:4px; display:flex; align-items:center; justify-content:center; color:#fff;">签</div>
            签到
          </div>
          <div style="color:#666; font-size:14px; margin-top:4px;">累计 0/3 天得额外友友金</div>
        </div>
        <button style="background:linear-gradient(90deg, #ff3a3a 0%, #ff6b6b 100%); color:#fff; border:none; border-radius:8px; padding:8px 16px; font-size:16px; cursor:pointer;">签到</button>
      </div>
    </div>
  </div>

  <script>
    // 替换为指定的两个视频链接
    const videoList = [
      "https://save.aura.us.kg/Video/%E3%80%90%E5%93%B2%E9%A3%8E%E5%A3%81%E7%BA%B8%E3%80%91%E5%86%B7%E5%B3%BB%E8%A1%A8%E6%83%85-%E5%B0%8F%E7%99%BD%E8%8A%B1.mp4",
      "https://save.aura.us.kg/Video/%E3%80%90%E5%93%B2%E9%A3%8E%E5%A3%81%E7%BA%B8%E3%80%91%E5%88%97%E8%BD%A6-%E5%9F%8E%E5%B8%82%E5%A4%9C%E6%99%AF-%E6%92%91%E4%BC%9E.mp4"
    ];
    let currentVideoIndex = 0;
    const videoPlayer = document.getElementById('videoPlayer');
    const videoLayer = document.getElementById('videoLayer');

    // 1. 点击视频 暂停/播放
    videoLayer.addEventListener('click', () => {
      videoPlayer.paused ? videoPlayer.play() : videoPlayer.pause();
    });

    // 2. 上下滑动切换视频（优化触摸检测灵敏度）
    let startY = 0;
    videoLayer.addEventListener('touchstart', (e) => {
      startY = e.touches[0].clientY;
    });
    videoLayer.addEventListener('touchend', (e) => {
      const endY = e.changedTouches[0].clientY;
      const diffY = endY - startY;

      // 滑动距离阈值设为50px，确保切换精准
      if (diffY > 50) {
        // 下滑→上一个视频（循环）
        currentVideoIndex = (currentVideoIndex - 1 + videoList.length) % videoList.length;
        videoPlayer.src = videoList[currentVideoIndex];
        videoPlayer.play();
      } else if (diffY < -50) {
        // 上滑→下一个视频（循环）
        currentVideoIndex = (currentVideoIndex + 1) % videoList.length;
        videoPlayer.src = videoList[currentVideoIndex];
        videoPlayer.play();
      }
    });

    // 3. 物品层点击滑条控制显示/隐藏
    const itemLayer = document.getElementById('itemLayer');
    const slideBar = document.getElementById('slideBar');
    slideBar.addEventListener('click', () => {
      itemLayer.classList.toggle('hide');
    });
  </script>
</body>
</html>
