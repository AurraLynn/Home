<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fav - Control Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        @keyframes aurora {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        body {
            margin: 0; min-height: 100vh;
            background: linear-gradient(-45deg, #e0c3fc, #8ec5fc, #fbc2eb, #a18cd1);
            background-size: 400% 400%; animation: aurora 20s ease infinite;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            overflow-x: hidden;
        }
        .squircle { border-radius: 22.5%; }
        ::-webkit-scrollbar { display: none; }
        .modal-enter-active, .modal-leave-active { transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
        .modal-enter-from, .modal-leave-to { opacity: 0; transform: scale(0.95) translateY(-10px); }
        .list-move, .list-enter-active, .list-leave-active { transition: all 0.4s ease; }
        .list-enter-from, .list-leave-to { opacity: 0; transform: scale(0.9); }
        .list-leave-active { position: absolute; }
        
        /* 核心黑科技：伪装成密码框，彻底干掉系统密码管理器弹窗 */
        .stealth-password {
            -webkit-text-security: disc;
        }
    </style>
</head>
<body class="text-gray-900 antialiased" @click="closeContextMenu">
    <div id="app" class="min-h-screen p-6 sm:p-12 relative flex flex-col items-center">
        
        <div class="fixed top-8 z-40 flex flex-col items-center">
            <div class="bg-black/85 backdrop-blur-2xl border border-white/20 text-white px-5 py-3 rounded-full shadow-2xl flex items-center gap-3 transition-all duration-500 w-72 focus-within:w-[32rem] hover:w-[26rem] group">
                <svg :class="['w-5 h-5 transition-colors duration-300', inputValue ? 'text-blue-400' : 'text-gray-400 group-focus-within:text-blue-400']" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" ref="searchInput" placeholder="搜索卡片，或填入网址收集 ( ⌘ + K )" 
                       class="bg-transparent border-none outline-none text-sm w-full placeholder-gray-400 tracking-wide" 
                       @keyup.enter="handleSmartEnter" v-model="inputValue" autocomplete="off" spellcheck="false">
            </div>
            <div :class="['mt-3 px-6 py-2 rounded-full backdrop-blur-xl transition-all duration-500 transform text-sm', islandActive ? 'translate-y-0 opacity-100' : '-translate-y-4 opacity-0 pointer-events-none', isError ? 'bg-red-500/80 text-white' : 'bg-black/80 text-white']">
                {{ statusText }}
            </div>
        </div>

        <div class="mt-32 mb-16 text-center pointer-events-none">
            <h1 class="text-5xl sm:text-7xl font-extrabold tracking-tight text-white/90 drop-shadow-md mix-blend-overlay">Control Center</h1>
            <p class="mt-4 text-white/70 font-medium tracking-wide">Spatial Bookmark & Script Hub</p>
        </div>

        <transition-group name="list" tag="div" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6 sm:gap-8 w-full max-w-7xl z-10 pb-20 relative">
            <a v-for="site in filteredSites" :key="site.id || site.url" :href="site.url" target="_blank"
               @contextmenu.prevent="showContextMenu($event, site)"
               class="flex flex-col items-center p-6 bg-white/20 backdrop-blur-3xl border border-white/40 shadow-sm rounded-[2rem] transition-all duration-500 hover:-translate-y-2 hover:shadow-xl hover:bg-white/30 group">
                <div class="w-16 h-16 sm:w-20 sm:h-20 bg-white/40 squircle shadow-inner border border-white/50 flex items-center justify-center overflow-hidden mb-4 transition-transform duration-500 group-hover:scale-110 group-hover:rotate-3">
                    <img :src="site.icon_url || 'https://icons.duckduckgo.com/ip3/' + new URL(site.url).hostname + '.ico'" class="w-full h-full object-cover" @error="handleImageError">
                </div>
                <span class="text-sm font-bold text-gray-800 drop-shadow-sm truncate w-full text-center">{{ site.title }}</span>
                <span class="text-xs text-gray-600/80 mt-1 font-semibold opacity-0 group-hover:opacity-100 transition-opacity duration-300 translate-y-2 group-hover:translate-y-0">{{ site.category || 'Default' }}</span>
            </a>
        </transition-group>

        <transition name="modal">
            <div v-if="showAuthModal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm" @click.self="cancelAuth">
                <div class="bg-white/20 backdrop-blur-3xl border border-white/40 shadow-2xl rounded-3xl p-8 w-80 flex flex-col items-center">
                    <div class="w-12 h-12 bg-blue-500/20 rounded-full flex items-center justify-center mb-4">
                        <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    </div>
                    <h3 class="text-lg font-bold text-gray-900 mb-1">管理员验证</h3>
                    <p class="text-xs text-gray-600 mb-5">请输入暗号执行写入</p>
                    
                    <input type="text" id="auth-input" v-model="authPassword" @keyup.enter="submitAuth"
                           class="stealth-password w-full bg-white/50 border border-white/50 rounded-xl px-4 py-2.5 outline-none focus:ring-2 focus:ring-blue-400/50 text-center tracking-widest text-gray-800 mb-4 shadow-inner placeholder-gray-400" 
                           placeholder="••••••••" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                    
                    <div class="flex w-full gap-3">
                        <button @click="cancelAuth" class="flex-1 py-2.5 rounded-xl bg-gray-200/50 hover:bg-gray-300/50 text-gray-700 font-semibold transition-colors">取消</button>
                        <button @click="submitAuth" class="flex-1 py-2.5 rounded-xl bg-blue-600/90 hover:bg-blue-500 text-white font-semibold shadow-md transition-colors">执行</button>
                    </div>
                </div>
            </div>
        </transition>
    </div>

    <script>
        const { createApp, ref, onMounted, nextTick, computed } = Vue;
        
        createApp({
            setup() {
                const inputValue = ref('');
                const searchInput = ref(null);
                const sites = ref([]);
                const islandActive = ref(false);
                const isError = ref(false);
                const statusText = ref('');
                const showAuthModal = ref(false);
                const authPassword = ref('');
                const pendingUrl = ref('');

                // ⚠️ 如果你的后端文件在 functions/api/add.js，请把这里的路径改成 '/api/add'
                // ⚠️ 如果在 functions/api/fav/add.js，就保持 '/api/fav/list' 不变
                const LIST_API_URL = '/api/fav/list';
                const ADD_API_URL = '/api/fav/add';

                const fetchSites = async () => {
                    try {
                        const res = await fetch(LIST_API_URL);
                        if (res.ok) sites.value = await res.json();
                    } catch (e) {
                        console.error('API未就绪或报错', e);
                    }
                };

                onMounted(() => {
                    fetchSites();
                    window.addEventListener('keydown', (e) => {
                        if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); searchInput.value?.focus(); }
                        if (e.key === 'Escape' && showAuthModal.value) cancelAuth();
                    });
                });

                const filteredSites = computed(() => {
                    const keyword = inputValue.value.trim().toLowerCase();
                    if (!keyword) return sites.value;
                    return sites.value.filter(site => (site.title && site.title.toLowerCase().includes(keyword)) || (site.category && site.category.toLowerCase().includes(keyword)));
                });

                const handleSmartEnter = () => {
                    const text = inputValue.value.trim();
                    if (!text) return;
                    const urlRegex = /^(https?:\/\/)?([\w-]+\.)+[\w-]+(\/[\w-./?%&=]*)?$/i;
                    
                    if (urlRegex.test(text) && !text.includes(' ')) {
                        pendingUrl.value = text;
                        const savedToken = localStorage.getItem('fav_auth_token');
                        
                        if (savedToken) {
                            // 极客免密体验：有记录直接秒发，绝不弹窗打扰
                            authPassword.value = savedToken;
                            submitAuth(); 
                        } else {
                            // 第一次才弹窗
                            showAuthModal.value = true;
                            nextTick(() => document.getElementById('auth-input')?.focus());
                        }
                    } else {
                        window.open(`https://www.google.com/search?q=${encodeURIComponent(text)}`, '_blank');
                        inputValue.value = ''; 
                    }
                };

                const cancelAuth = () => { showAuthModal.value = false; authPassword.value = ''; pendingUrl.value = ''; };

                const submitAuth = async () => {
                    if (!authPassword.value) return;
                    
                    const currentPassword = authPassword.value; // 缓存当前密码用于成功后存入本地
                    showAuthModal.value = false;
                    islandActive.value = true; isError.value = false;
                    statusText.value = "识别为 URL，正在潜入目标服务器扒取图标...";

                    try {
                        const res = await fetch(ADD_API_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ url: pendingUrl.value, category: 'Script/Proxy', authCode: currentPassword })
                        });
                        
                        const contentType = res.headers.get("content-type");
                        if (!contentType || !contentType.includes("application/json")) {
                            throw new Error(`发生 ${res.status} 错误！检查后端文件物理路径是否和请求地址一致`);
                        }

                        const data = await res.json();
                        
                        if (res.ok && data.success) {
                            // 【关键】只有当后端真正返回 success，才将这台设备设为免密信任状态
                            localStorage.setItem('fav_auth_token', currentPassword);
                            statusText.value = data.msg || "添加成功";
                            authPassword.value = ''; pendingUrl.value = ''; inputValue.value = ''; 
                            await fetchSites(); 
                        } else {
                            // 密码错误，清除信任缓存，重新要求输入
                            isError.value = true;
                            statusText.value = data.msg || "后端罢工了";
                            if (res.status === 403) {
                                localStorage.removeItem('fav_auth_token');
                                setTimeout(() => { showAuthModal.value = true; }, 1500); // 弹窗重试
                            }
                        }
                    } catch (e) {
                        isError.value = true;
                        statusText.value = e.message;
                    }
                    setTimeout(() => { islandActive.value = false; }, 3500);
                };

                const showContextMenu = (e, site) => { /* 待接入 */ };
                const closeContextMenu = () => { /* 待接入 */ };
                const handleImageError = (e) => { e.target.src = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjY2JjYmNiIiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+PGNpcmNsZSBjeD0iMTIiIGN5PSIxMiIgcj0iMTAiPjwvY2lyY2xlPjxsaW5lIHgxPSIxMiIgeTE9IjgiIHgyPSIxMiIgeTI9IjEyIj48L2xpbmU+PGxpbmUgeDE9IjEyIiB5MT0iMTYiIHgyPSIxMi4wMSIgeTI9IjE2Ij48L2xpbmU+PC9zdmc+'; };

                return { 
                    sites, inputValue, handleSmartEnter, filteredSites, islandActive, statusText, isError, searchInput, 
                    showContextMenu, closeContextMenu, handleImageError, showAuthModal, authPassword, submitAuth, cancelAuth
                };
            }
        }).mount('#app')
    </script>
</body>
</html>
