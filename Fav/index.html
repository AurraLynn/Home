<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fav - Control Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        @keyframes aurora { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        body { margin: 0; min-height: 100vh; background: linear-gradient(-45deg, #e0c3fc, #8ec5fc, #fbc2eb, #a18cd1); background-size: 400% 400%; animation: aurora 20s ease infinite; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; overflow-x: hidden; }
        .squircle { border-radius: 22.5%; }
        ::-webkit-scrollbar { display: none; }
        .modal-enter-active, .modal-leave-active { transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
        .modal-enter-from, .modal-leave-to { opacity: 0; transform: scale(0.95) translateY(-10px); }
        .list-move, .list-enter-active, .list-leave-active { transition: all 0.4s ease; }
        .list-enter-from, .list-leave-to { opacity: 0; transform: scale(0.9); }
        .list-leave-active { position: absolute; }
        .stealth-password { -webkit-text-security: disc; }
        .no-select { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        .no-zoom-input { font-size: 16px !important; }
    </style>
</head>
<body class="text-gray-900 antialiased flex flex-col no-select" @click="closeContextMenu">
    <div id="app" class="flex-1 p-4 sm:p-10 relative flex flex-col items-center">
        
        <div class="fixed top-6 sm:top-8 z-40 flex flex-col items-center w-full px-6 pointer-events-none">
            <div class="pointer-events-auto bg-black/85 backdrop-blur-2xl border border-white/20 text-white px-4 py-2.5 rounded-full shadow-2xl flex items-center gap-2.5 transition-all duration-500 w-[90vw] sm:w-72 focus-within:w-[95vw] sm:focus-within:w-[32rem] sm:hover:w-[26rem] group mx-auto">
                <svg :class="['w-4 h-4 shrink-0 transition-colors duration-300', inputValue ? 'text-blue-400' : 'text-gray-400 group-focus-within:text-blue-400']" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" ref="searchInput" placeholder="搜点啥，或贴网址..." 
                       class="no-zoom-input bg-transparent border-none outline-none w-full placeholder-gray-400 tracking-wide text-white" 
                       @keyup.enter="handleSmartEnter" v-model="inputValue" autocomplete="off" spellcheck="false">
            </div>
            <div :class="['mt-3 px-5 py-1.5 rounded-full backdrop-blur-xl transition-all duration-500 transform text-xs', islandActive ? 'translate-y-0 opacity-100 pointer-events-auto' : '-translate-y-4 opacity-0', isError ? 'bg-red-500/90 text-white shadow-lg' : 'bg-black/80 text-white shadow-lg']">
                {{ statusText }}
            </div>
        </div>

        <div class="mt-24 mb-8 text-center pointer-events-none">
            <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight text-white/90 drop-shadow-md mix-blend-overlay">Control Center</h1>
            <p class="mt-2 text-[10px] sm:text-xs text-white/70 font-medium tracking-wide uppercase letter-spacing-wider">Spatial Bookmark Hub</p>
        </div>

        <transition-group name="list" tag="div" class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-10 gap-3 sm:gap-5 w-full max-w-7xl z-10 pb-20 relative px-2">
            <a v-for="site in filteredSites" :key="site.id || site.url" :href="formatUrl(site.url)" target="_blank"
               @contextmenu.prevent="showContextMenu($event, site)"
               @touchstart="onTouchStart($event, site)" @touchend="onTouchEnd" @touchmove="onTouchMove"
               class="flex flex-col items-center p-3 sm:p-4 bg-white/10 backdrop-blur-3xl border border-white/30 shadow-sm rounded-2xl transition-all duration-300 hover:-translate-y-1 hover:shadow-lg hover:bg-white/20 group relative cursor-pointer">
                <div class="w-10 h-10 sm:w-12 sm:h-12 bg-white/50 squircle shadow-inner border border-white/60 flex items-center justify-center overflow-hidden mb-2 transition-transform duration-300 group-hover:scale-110">
                    <img :src="site.icon_url || `https://www.google.com/s2/favicons?domain=${new URL(formatUrl(site.url)).hostname}&sz=256`" class="w-full h-full object-cover" @error="handleImageError">
                </div>
                <span class="text-[10px] sm:text-xs font-semibold text-gray-800 drop-shadow-sm w-full text-center truncate px-1" :title="site.title">{{ site.title }}</span>
            </a>
        </transition-group>

        <div class="mt-auto w-full max-w-7xl pt-10 pb-6 flex flex-col items-center justify-center text-[10px] font-medium text-white/70 tracking-widest text-center opacity-80 hover:opacity-100 transition-opacity">
            <div class="mb-3 animate-pulse text-xs text-white/90 font-bold drop-shadow-md px-4">{{ quote }}</div>
            <div class="flex flex-wrap justify-center gap-x-4 gap-y-2 px-4">
                <span>© 2026 Fav Hub.</span>
                <span>边缘节点延迟: <span :class="{'text-green-300 font-bold': ping < 100, 'text-red-300 font-bold': ping >= 100}">{{ ping }}ms</span></span>
                <span>残骸收录: <span class="text-blue-200 font-bold">{{ sites.length }}</span> 具</span>
            </div>
        </div>

        <div v-show="contextMenu.visible" :style="{ top: contextMenu.y + 'px', left: contextMenu.x + 'px' }" 
             class="fixed z-50 w-40 bg-white/85 backdrop-blur-2xl border border-white/50 rounded-2xl shadow-2xl overflow-hidden text-[13px] font-medium transition-opacity duration-200 transform origin-top-left">
            <div class="px-4 py-2 text-gray-400 border-b border-gray-200/50 text-[10px] uppercase tracking-wider truncate">{{ contextMenu.site?.title }}</div>
            <button class="w-full text-left px-4 py-2.5 hover:bg-blue-500 hover:text-white transition-colors" @click.stop="editSite">修改狗牌 (编辑)</button>
            <div class="h-[1px] bg-gray-200/50 mx-2"></div>
            <button class="w-full text-left px-4 py-2.5 text-red-500 hover:bg-red-500 hover:text-white transition-colors" @click.stop="deleteSite">就地正法 (删除)</button>
        </div>

        <transition name="modal">
            <div v-if="showSearchModal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm" @click.self="showSearchModal = false">
                <div class="bg-white/20 backdrop-blur-3xl border border-white/40 shadow-2xl rounded-3xl p-6 w-[85vw] max-w-xs flex flex-col items-center text-center">
                    <div class="text-4xl mb-3">🙄</div>
                    <h3 class="text-base font-bold text-gray-900 mb-2">库里没这玩意</h3>
                    <p class="text-xs text-gray-700 mb-6">连「<span class="font-bold text-black">{{ pendingSearch }}</span>」都搜不到，丢给谷歌搜吧？</p>
                    <div class="flex w-full gap-3">
                        <button @click="showSearchModal = false" class="flex-1 py-2 rounded-xl bg-gray-200/60 hover:bg-gray-300/60 text-gray-700 text-xs font-semibold transition-colors">算了</button>
                        <button @click="confirmWebSearch" class="flex-1 py-2 rounded-xl bg-blue-600/90 hover:bg-blue-500 text-white text-xs font-semibold shadow-md transition-colors">滚去搜</button>
                    </div>
                </div>
            </div>
        </transition>

        <transition name="modal">
            <div v-if="showAuthModal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm" @click.self="cancelAuth">
                <div class="bg-white/20 backdrop-blur-3xl border border-white/40 shadow-2xl rounded-3xl p-6 w-[85vw] max-w-xs flex flex-col items-center">
                    <div class="w-10 h-10 bg-blue-500/20 rounded-full flex items-center justify-center mb-3"><svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg></div>
                    <h3 class="text-base font-bold text-gray-900 mb-1">入库验证</h3>
                    <p class="text-[10px] text-gray-700 mb-4 text-center">又搞到什么黑料了？暗号交出来。</p>
                    <input type="text" id="sec-token" v-model="passToken" @keyup.enter="submitAuth" class="stealth-password no-zoom-input w-full bg-white/50 border border-white/50 rounded-xl px-4 py-2 outline-none focus:ring-2 focus:ring-blue-400/50 text-center tracking-widest text-gray-800 mb-4 shadow-inner placeholder-gray-500" placeholder="懂的都懂..." autocomplete="nope" data-form-type="other" autocorrect="off" spellcheck="false">
                    <div class="flex w-full gap-3">
                        <button @click="cancelAuth" class="flex-1 py-2 rounded-xl bg-gray-200/60 hover:bg-gray-300/60 text-gray-700 text-xs font-semibold transition-colors">撤退</button>
                        <button @click="submitAuth" class="flex-1 py-2 rounded-xl bg-blue-600/90 hover:bg-blue-500 text-white text-xs font-semibold shadow-md transition-colors">安排上</button>
                    </div>
                </div>
            </div>
        </transition>
    </div>

    <script>
        const { createApp, ref, onMounted, nextTick, computed } = Vue;
        
        createApp({
            setup() {
                const inputValue = ref('');
                const searchInput = ref(null);
                const sites = ref([]);
                const islandActive = ref(false);
                const isError = ref(false);
                const statusText = ref('');
                const showSearchModal = ref(false);
                const pendingSearch = ref('');
                const showAuthModal = ref(false);
                const passToken = ref(''); 
                const pendingUrl = ref('');
                const contextMenu = ref({ visible: false, x: 0, y: 0, site: null });
                
                const ping = ref('--');
                const quote = ref('加载中...');
                let touchTimer = null;
                
                const LIST_API_URL = '/api/Fav/list';
                const ADD_API_URL = '/api/Fav/add';
                const DEL_API_URL = '/api/Fav/delete';

                const formatUrl = (rawUrl) => {
                    if (!rawUrl) return '#';
                    if (rawUrl.includes('://')) return rawUrl;
                    return 'https://' + rawUrl;
                };

                const fetchSites = async () => {
                    try {
                        const start = Date.now();
                        const res = await fetch(LIST_API_URL);
                        const end = Date.now();
                        if (res.ok) {
                            sites.value = await res.json();
                            ping.value = end - start;
                        }
                    } catch (e) { ping.value = '超时'; }
                };

                const initFooter = () => {
                    // 你要的特定羞辱文案已经安排上了
                    const quotes = [
                        "别看了，你的代理节点又全红了。", 
                        "代码写得像坨屎，收藏夹倒是搞得挺花哨。", 
                        "你那几个破服务器还没挂？堪称医学奇迹。",
                        "天天跑青龙脚本，也没见你薅出套海景房。",
                        "自动化脚本跑得挺溜，一看总收益：一毛五。",
                        "别刷了，薅羊毛的尽头是被当成羊宰。",
                        "搞了一堆高大上的复杂分流，最后连张黄图都加载不出来。",
                        "Surge 规则写得比简历都长，平时只用来刷推特？",
                        "测速一片绿，打开网页卡成狗。玄学救不了烂节点。",
                        "你的机场主又准备跑路了，还不快去备份订阅？",
                        "「稍后阅读」=「永久入土」。",
                        "存了这么多神仙仓库，你的 GitHub 贡献图绿过吗？",
                        "GitHub 上 Star 了就等于学会了，对吧？",
                        "收藏夹里全是干货，脑子里全是一团浆糊。",
                        "收藏夹里的教程吃灰三年了，你点开过一次吗？",
                        "又在折腾这破面板？能提升哪怕 1% 的生产力吗？",
                        "差生文具多，极客域名多。",
                        "生命不息，折腾不止。折腾半天，原地踏步。",
                        "天天琢磨怎么绕过网络封控，正经活儿干完没？"
                    ];
                    quote.value = quotes[Math.floor(Math.random() * quotes.length)];
                };

                onMounted(() => {
                    fetchSites();
                    initFooter();
                    window.addEventListener('keydown', (e) => {
                        if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); searchInput.value?.focus(); }
                        if (e.key === 'Escape') { showAuthModal.value = false; showSearchModal.value = false; closeContextMenu(); }
                    });
                });

                const filteredSites = computed(() => {
                    const keyword = inputValue.value.trim().toLowerCase();
                    if (!keyword) return sites.value;
                    return sites.value.filter(site => (site.title && site.title.toLowerCase().includes(keyword)) || (site.category && site.category.toLowerCase().includes(keyword)));
                });

                const handleSmartEnter = (e) => {
                    if (e && !e.isTrusted) return; 

                    const text = inputValue.value.trim();
                    if (!text) return;
                    
                    const isUrlOrScheme = text.includes('://') || (/^([\w-]+\.)+[a-zA-Z]{2,}(\/.*)?$/.test(text) && !text.includes(' '));
                    
                    if (isUrlOrScheme) {
                        pendingUrl.value = text;
                        const savedToken = localStorage.getItem('fav_sec_token');
                        if (savedToken) { passToken.value = savedToken; submitAuth(); } 
                        else { showAuthModal.value = true; nextTick(() => document.getElementById('sec-token')?.focus()); }
                    } else {
                        if (filteredSites.value.length === 0) {
                            pendingSearch.value = text;
                            showSearchModal.value = true;
                        } else {
                            islandActive.value = true; isError.value = false;
                            statusText.value = `没瞎的话自己往下看。`;
                            setTimeout(() => { islandActive.value = false; }, 2000);
                        }
                    }
                };

                const confirmWebSearch = () => { window.open(`https://www.google.com/search?q=${encodeURIComponent(pendingSearch.value)}`, '_blank'); showSearchModal.value = false; inputValue.value = ''; };
                
                const cancelAuth = () => { 
                    showAuthModal.value = false; 
                    passToken.value = ''; 
                    pendingUrl.value = ''; 
                };

                const submitAuth = async () => {
                    if (!passToken.value) return;
                    const currentPassword = passToken.value; 
                    
                    showAuthModal.value = false; 
                    islandActive.value = true; 
                    isError.value = false;
                    statusText.value = "收到。正在顺着网线爬过去偷资料...";

                    try {
                        const res = await fetch(ADD_API_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ url: pendingUrl.value, category: 'Script/Proxy', authCode: currentPassword })
                        });
                        
                        const data = await res.json();
                        if (res.ok && data.success) {
                            localStorage.setItem('fav_sec_token', currentPassword);
                            statusText.value = data.msg;
                            passToken.value = ''; pendingUrl.value = ''; inputValue.value = ''; 
                            await fetchSites(); 
                        } else {
                            isError.value = true; 
                            if (res.status === 403) {
                                localStorage.removeItem('fav_sec_token');
                                statusText.value = "暗号错！去检查 Cloudflare 有没有设 ADMIN_PASSWORD 变量！";
                            } else {
                                statusText.value = data.msg || "后端罢工了。";
                            }
                        }
                    } catch (e) { 
                        isError.value = true; 
                        statusText.value = "你网炸了，或者 API 路径写崩了。"; 
                    }
                    setTimeout(() => { islandActive.value = false; }, 3500);
                };

                const showContextMenu = (eOrTouch, site) => { 
                    eOrTouch.preventDefault?.(); 
                    let x = eOrTouch.clientX; let y = eOrTouch.clientY;
                    if (window.innerWidth - x < 160) x = window.innerWidth - 160; 
                    contextMenu.value = { visible: true, x, y, site }; 
                };
                
                const onTouchStart = (e, site) => {
                    touchTimer = setTimeout(() => { showContextMenu(e.touches[0], site); }, 500); 
                };
                const onTouchEnd = () => { clearTimeout(touchTimer); };
                const onTouchMove = () => { clearTimeout(touchTimer); }; 
                const closeContextMenu = () => { contextMenu.value.visible = false; };
                
                const deleteSite = async () => { alert("还没写删除接口呢。"); closeContextMenu(); };
                const editSite = () => { alert("你以为说改就能改？先凑合着用。"); closeContextMenu(); };
                const handleImageError = (e) => { e.target.src = 'https://api.iconify.design/bx:bx-ghost.svg'; };

                return { 
                    sites, inputValue, handleSmartEnter, filteredSites, formatUrl, islandActive, statusText, isError, searchInput, 
                    showSearchModal, pendingSearch, confirmWebSearch,
                    contextMenu, showContextMenu, closeContextMenu, onTouchStart, onTouchEnd, onTouchMove,
                    deleteSite, editSite, handleImageError, 
                    showAuthModal, passToken, submitAuth, cancelAuth, quote, ping
                };
            }
        }).mount('#app')
    </script>
</body>
</html>
