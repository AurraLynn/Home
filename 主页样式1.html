<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Maker</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f3f4f6;
            color: #111827;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            transition: background 0.25s ease, color 0.25s ease;
        }

        body.dark {
            background: radial-gradient(circle at top, #1f2937 0, #020617 45%, #000 100%);
            color: #f9fafb;
        }

        .shell {
            width: 100%;
            max-width: 900px;
        }

        /* 顶部区域 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 12px;
        }

        .header-main {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0;
        }

        .brand-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 16px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
        }

        body.dark .brand-card {
            background: rgba(15, 23, 42, 0.96);
            border-color: #374151;
            box-shadow: 0 12px 26px rgba(15, 23, 42, 0.8);
        }

        .brand-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            flex-shrink: 0;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 650;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }

        .brand-sub {
            font-size: 11px;
            color: #6b7280;
            white-space: nowrap;
        }

        body.dark .brand-sub {
            color: #9ca3af;
        }

        .header-desc {
            font-size: 12px;
            color: #6b7280;
        }

        body.dark .header-desc {
            color: #9ca3af;
        }

        .mode-toggle {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            border: 1px solid #d1d5db;
            overflow: hidden;
            background: #ffffff;
            font-size: 11px;
            flex-shrink: 0;
        }

        body.dark .mode-toggle {
            background: rgba(15, 23, 42, 0.96);
            border-color: #4b5563;
        }

        .mode-btn {
            padding: 4px 10px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 11px;
            color: #6b7280;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        body.dark .mode-btn {
            color: #9ca3af;
        }

        .mode-btn.active {
            background: #111827;
            color: #f9fafb;
        }

        body.dark .mode-btn.active {
            background: #f9fafb;
            color: #111827;
        }

        .mode-dot {
            width: 6px;
            height: 6px;
            border-radius: 999px;
            background: #22c55e;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.9);
        }

        /* 主体卡片布局 */
        .card {
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.9fr);
            gap: 20px;
            padding: 18px 18px 16px;
            border-radius: 18px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            box-shadow: 0 18px 35px rgba(15, 23, 42, 0.12);
            transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        body.dark .card {
            background: rgba(15, 23, 42, 0.96);
            border-color: rgba(148, 163, 184, 0.35);
            box-shadow:
                    0 24px 60px rgba(15, 23, 42, 0.85),
                    0 0 0 1px rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(18px);
        }

        .field {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 13px;
            margin-bottom: 4px;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 9px 11px;
            border-radius: 10px;
            border: 1px solid #d1d5db;
            background: #f9fafb;
            color: #111827;
            font-size: 13px;
            outline: none;
            transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
        }

        textarea {
            min-height: 72px;
            resize: vertical;
        }

        body.dark input[type="text"],
        body.dark textarea {
            border-color: #4b5563;
            background: rgba(15, 23, 42, 0.92);
            color: #e5e7eb;
        }

        input:focus,
        textarea:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 1px #38bdf8;
            background: #ffffff;
        }

        body.dark input:focus,
        body.dark textarea:focus {
            background: rgba(15, 23, 42, 0.96);
        }

        .hint {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 3px;
        }

        body.dark .hint {
            color: #6b7280;
        }

        /* 过期时间选项按钮 */
        .expire-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }

        .expire-pill {
            padding: 4px 10px;
            border-radius: 999px;
            border: 1px solid #d1d5db;
            background: #f9fafb;
            font-size: 12px;
            cursor: pointer;
            color: #4b5563;
            transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
        }

        .expire-pill.active {
            background: #111827;
            color: #f9fafb;
            border-color: #111827;
            box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.06);
        }

        body.dark .expire-pill {
            background: rgba(15, 23, 42, 0.92);
            border-color: #4b5563;
            color: #e5e7eb;
        }

        body.dark .expire-pill.active {
            background: #f9fafb;
            color: #111827;
            border-color: #f9fafb;
            box-shadow: 0 0 0 1px rgba(248, 250, 252, 0.25);
        }

        /* 按钮/状态/结果 */
        .actions {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-main {
            width: 100%;
            padding: 11px;
            border-radius: 999px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #22c55e, #22d3ee);
            color: #020617;
            transition: transform 0.1s ease, box-shadow 0.1s ease, opacity 0.1s;
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.32);
        }

        .btn-main:active {
            transform: translateY(1px);
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
            opacity: 0.93;
        }

        .status {
            font-size: 12px;
            color: #ca8a04;
            min-height: 16px;
        }

        body.dark .status {
            color: #facc15;
        }

        .result {
            margin-top: 8px;
            padding: 10px 12px;
            border-radius: 12px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            font-size: 12px;
            word-break: break-all;
        }

        body.dark .result {
            background: rgba(15, 23, 42, 0.96);
            border-color: #334155;
        }

        .result-title {
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 13px;
        }

        .result-link {
            margin-top: 4px;
        }

        .btn-row {
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .btn-copy,
        .btn-share {
            padding: 6px 10px;
            font-size: 12px;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-copy {
            background: #111827;
            color: #f9fafb;
        }

        body.dark .btn-copy {
            background: #020617;
            border: 1px solid #4b5563;
        }

        .btn-share {
            background: #e5e7eb;
            color: #111827;
        }

        body.dark .btn-share {
            background: #1f2937;
            color: #e5e7eb;
            border: 1px solid #4b5563;
        }

        .btn-copy-icon,
        .btn-share-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-copy-icon svg,
        .btn-share-icon svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
        }

        /* 右侧：图片选择 + 预览 */
        .thumbs-wrap {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .thumbs-title {
            font-size: 12px;
            color: #6b7280;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        body.dark .thumbs-title {
            color: #9ca3af;
        }

        .thumbs-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 6px;
        }

        .thumb {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #e5e7eb;
            cursor: pointer;
            aspect-ratio: 16 / 9;
            transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
            background: #e5e7eb;
        }

        body.dark .thumb {
            border-color: #334155;
            background: #020617;
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            -webkit-user-drag: none;
            user-select: none;
        }

        .thumb:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.1);
        }

        body.dark .thumb:hover {
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.9);
        }

        .thumb.selected {
            border-color: #38bdf8;
            box-shadow: 0 0 0 1px #38bdf8, 0 10px 22px rgba(56, 189, 248, 0.25);
        }

        /* 自定义图片链接 */
        .custom-image-row {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }

        .custom-image-row input[type="text"] {
            flex: 1;
        }

        .btn-use-custom {
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid #d1d5db;
            background: #f9fafb;
            font-size: 12px;
            cursor: pointer;
            color: #4b5563;
            white-space: nowrap;
        }

        .btn-use-custom:hover {
            background: #e5e7eb;
        }

        body.dark .btn-use-custom {
            background: rgba(15, 23, 42, 0.92);
            border-color: #4b5563;
            color: #e5e7eb;
        }

        body.dark .btn-use-custom:hover {
            background: rgba(31, 41, 55, 0.95);
        }

        /* 主预览：固定宽高，图片填满 */
        .preview-box {
            border-radius: 14px;
            border: 1px dashed #d1d5db;
            padding: 8px;
            background: #f9fafb;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
            align-items: center;
            justify-content: center;
        }

        body.dark .preview-box {
            background: radial-gradient(circle at top, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.95));
            border-color: rgba(148, 163, 184, 0.5);
        }

        .preview-img {
            width: 100%;
            max-width: 440px;
            height: 440px;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid #e5e7eb;
            background: #f9fafb;
        }

        body.dark .preview-img {
            border-color: #1f2937;
            background: #020617;
        }

        .preview-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: transparent;
            -webkit-user-drag: none;
            user-select: none;
        }

        .footer {
            margin-top: 16px;
            font-size: 11px;
            color: #9ca3af;
            text-align: right;
        }

        body.dark .footer {
            color: #6b7280;
        }

        @media (max-width: 768px) {
            body {
                align-items: flex-start;
            }
            .card {
                grid-template-columns: minmax(0, 1fr);
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .footer {
                text-align: left;
            }
        }
    </style>
</head>
<body class="light">
<div class="shell">
    <div class="header">
        <div class="header-main">
            <div class="brand-card">
                <div class="brand-icon" id="brand-icon"></div>
                <div class="brand-text">
                    <div class="brand-name">Card Maker</div>
                    <div class="brand-sub">
                        生成适合在微信 / QQ 等社交..中分享的卡片链接。
                    </div>
                </div>
            </div>
            <div class="header-desc">
            </div>
        </div>
        <div class="mode-toggle" id="mode-toggle">
            <button class="mode-btn active" data-mode="light">
                <span class="mode-dot"></span> Light
            </button>
            <button class="mode-btn" data-mode="dark">Dark</button>
        </div>
    </div>

    <div class="card">
        <!-- 左侧：表单 + 生成结果 -->
        <div>
            <div class="field">
                <label for="title">卡片标题</label>
                <input id="title" type="text" placeholder="A card shared by Lyn" />
                <div class="hint">不填写时，会默认使用：A card shared by Lyn</div>
            </div>

            <div class="field">
                <label for="desc">卡片描述</label>
                <textarea id="desc" placeholder="只是一个喜欢在互联网上瞎折腾的人罢了。"></textarea>
                <div class="hint">不填写时，会默认使用上面的这句描述。</div>
            </div>

            <div class="field">
                <label for="target">目标链接</label>
                <textarea id="target" placeholder="请输入合法链接，例如：https://aura.us.kg、aura.us.kg/ ..."></textarea>
                <div class="hint">必须是有效链接，不支持纯文本内容。</div>
            </div>

            <div class="field">
                <label>过期时间</label>
                <div class="expire-group" id="expire-group">
                    <button class="expire-pill" data-value="1d">1 天</button>
                    <button class="expire-pill active" data-value="7d">7 天</button>
                    <button class="expire-pill" data-value="30d">30 天</button>
                    <button class="expire-pill" data-value="forever">不过期</button>
                </div>
                <div class="hint" id="expire-hint">卡片将在 7 天后过期。</div>
            </div>

            <div class="actions">
                <button class="btn-main" id="btn-generate">Generate Card</button>
                <div class="status" id="status"></div>

                <!-- 生成结果 -->
                <div class="result" id="result" style="display:none;">
                    <div class="result-title">生成成功 🎉</div>
                    <div>分享链接：</div>
                    <div class="result-link" id="share-url"></div>
                    <div class="btn-row">
                        <!-- Copy 按钮：B 组 · 两个重叠方块 -->
                        <button class="btn-copy" id="btn-copy">
                            <span class="btn-copy-icon" aria-hidden="true">
                              <svg viewBox="0 0 24 24">
                                <!-- 后面的方块 -->
                                <rect x="8" y="8" width="8" height="8" rx="2"></rect>
                                <!-- 前面的方块 -->
                                <rect x="5" y="5" width="8" height="8" rx="2"></rect>
                              </svg>
                            </span>
                            <span>Copy Link</span>
                        </button>

                        <!-- Share 按钮：B 组 · 三个点连线 -->
                        <button class="btn-share" id="btn-share">
                            <span class="btn-share-icon" aria-hidden="true">
                              <svg viewBox="0 0 24 24">
                                <!-- 三个点 -->
                                <circle cx="6" cy="12" r="1.5" fill="currentColor" />
                                <circle cx="12" cy="7" r="1.5" fill="currentColor" />
                                <circle cx="18" cy="12" r="1.5" fill="currentColor" />
                                <!-- 连线 -->
                                <path d="M7.3 11l3.4-2.3M13.3 8.7L16.7 11" stroke-linecap="round" />
                              </svg>
                            </span>
                            <span>Share Link</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右侧：图片选择 + 自定义链接 + 预览 -->
        <div>
            <div class="thumbs-wrap">
                <div class="thumbs-title">
                    <span>预览图片 · 点击选择封面图</span>
                    <span style="font-size:11px;opacity:.78;">来源：/Picture/Preview/...</span>
                </div>
                <div class="thumbs-grid" id="thumbs-grid">
                    <!-- 缩略图由 JS 填充 -->
                </div>

                <div class="field" style="margin-top:10px;">
                    <label for="custom-image-url" style="font-size:12px;">自定义图片链接:</label>
                    <div class="custom-image-row">
                        <input
                                id="custom-image-url"
                                type="text"
                                placeholder="https://example.com/your-cover.png"
                        />
                        <button type="button" class="btn-use-custom" id="btn-use-custom-image">Use</button>
                    </div>
                    <div class="hint">留空则使用上方预设图片。输入链接需以 http:// 或 https:// 开头。</div>
                </div>

                <div class="preview-box">
                    <div class="preview-img">
                        <img
                                id="preview-img"
                                src="https://save.aura.us.kg/Picture/Preview/YL1.png"
                                alt="预览图"
                                draggable="false"
                                ondragstart="return false;"
                        />
                    </div>
                </div>
            </div>
        </div>
    </div>

   <div class="footer">
    仅存卡片配置，不存访问日志。<br>
    CardMaker · By AurraLynn · Powered by Cloudflare
</div>
</div>

<script>
    const defaultTitle = "A card shared by Lyn";
    const defaultDesc = "只是一个喜欢在互联网上瞎折腾的人罢了。";
    const baseImageUrl = "https://save.aura.us.kg/Picture/Preview/";

    const imageFiles = Array.from({ length: 10 }).map((_, i) => "YL" + (i + 1) + ".png");

    const thumbsGrid = document.getElementById("thumbs-grid");
    const previewImg = document.getElementById("preview-img");
    const brandIcon = document.getElementById("brand-icon");

    let selectedImageFile = imageFiles[0];
    let selectedImageUrl = baseImageUrl + selectedImageFile;
    let lastTitle = defaultTitle;
    let lastDescription = defaultDesc;

    // 顶部随机预览图
    (function setRandomBrandIcon() {
        const idx = Math.floor(Math.random() * imageFiles.length);
        const file = imageFiles[idx];
        const url = baseImageUrl + file;
        brandIcon.style.backgroundImage = `url(${url})`;
    })();

    // 简单判断是否像一个链接：scheme:// 或者带点的域名
    function isProbablyUrl(s) {
        if (!s) return false;
        const str = s.trim();
        if (/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(str)) return true;
        if (str.includes(".") && !/\s/.test(str)) return true;
        return false;
    }

    function buildThumbs() {
        thumbsGrid.innerHTML = "";
        imageFiles.forEach((file, index) => {
            const url = baseImageUrl + file;
            const div = document.createElement("div");
            const isDefault = index === 0;
            div.className = "thumb" + (isDefault ? " selected" : "");
            div.dataset.file = file;
            div.dataset.url = url;

            div.setAttribute("draggable", "false");
            div.addEventListener("dragstart", (e) => e.preventDefault());

            const img = document.createElement("img");
            img.src = url;
            img.alt = file;
            img.draggable = false;
            img.addEventListener("dragstart", (e) => e.preventDefault());

            div.appendChild(img);
            div.addEventListener("click", () => {
                const all = thumbsGrid.querySelectorAll(".thumb");
                all.forEach((t) => t.classList.remove("selected"));
                div.classList.add("selected");
                selectedImageFile = file;
                selectedImageUrl = url;
                previewImg.src = url;
            });

            if (isDefault) {
                selectedImageFile = file;
                selectedImageUrl = url;
            }

            thumbsGrid.appendChild(div);
        });

        previewImg.src = selectedImageUrl;
    }

    buildThumbs();

    // 自定义图片链接
    const customImageInput = document.getElementById("custom-image-url");
    const btnUseCustomImage = document.getElementById("btn-use-custom-image");
    const statusEl = document.getElementById("status");

    btnUseCustomImage.addEventListener("click", () => {
        const raw = (customImageInput.value || "").trim();

        if (!raw) {
            statusEl.textContent = "请先输入图片链接，或使用上方预设图片。";
            return;
        }
        if (!/^https?:\/\//i.test(raw)) {
            statusEl.textContent = "图片链接需要以 http:// 或 https:// 开头。";
            return;
        }
        selectedImageFile = null;
        selectedImageUrl = raw;
        previewImg.src = raw;

        const all = thumbsGrid.querySelectorAll(".thumb");
        all.forEach((t) => t.classList.remove("selected"));

        statusEl.textContent = "已使用自定义图片链接。";
    });

    // 模式切换
    const modeToggle = document.getElementById("mode-toggle");
    const modeButtons = modeToggle.querySelectorAll(".mode-btn");
    const bodyEl = document.body;

    modeButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
            const mode = btn.dataset.mode;
            modeButtons.forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            if (mode === "dark") {
                bodyEl.classList.add("dark");
            } else {
                bodyEl.classList.remove("dark");
            }
        });
    });

    // 过期时间选择 + 提示文本
    const expireGroup = document.getElementById("expire-group");
    const expireHintEl = document.getElementById("expire-hint");
    let expireValue = "7d";

    function updateExpireHint(value) {
        switch (value) {
            case "1d":
                expireHintEl.textContent = "卡片将在 1 天后过期。";
                break;
            case "7d":
                expireHintEl.textContent = "卡片将在 7 天后过期。";
                break;
            case "30d":
                expireHintEl.textContent = "卡片将在 30 天后过期。";
                break;
            case "forever":
                expireHintEl.textContent = "卡片不会自动过期。";
                break;
            default:
                expireHintEl.textContent = "卡片将在 7 天后过期。";
        }
    }

    updateExpireHint(expireValue);

    expireGroup.addEventListener("click", (e) => {
        const target = e.target.closest(".expire-pill");
        if (!target) return;
        expireValue = target.dataset.value;
        const pills = expireGroup.querySelectorAll(".expire-pill");
        pills.forEach((p) => p.classList.remove("active"));
        target.classList.add("active");
        updateExpireHint(expireValue);
    });

    const btn = document.getElementById("btn-generate");
    const resultBox = document.getElementById("result");
    const shareUrlEl = document.getElementById("share-url");
    const btnCopy = document.getElementById("btn-copy");
    const btnShare = document.getElementById("btn-share");

    if (!("share" in navigator)) {
        btnShare.style.display = "none";
    }

    btn.addEventListener("click", async () => {
        const titleInput = document.getElementById("title");
        const descInput = document.getElementById("desc");
        const targetInput = document.getElementById("target");

        const title = (titleInput.value || "").trim() || defaultTitle;
        const description = (descInput.value || "").trim() || defaultDesc;
        const target = (targetInput.value || "").trim();
        const expire = expireValue;
        const image = selectedImageUrl || (baseImageUrl + imageFiles[0]);

        lastTitle = title;
        lastDescription = description;

        if (!target) {
            statusEl.textContent = "请先填写目标链接。";
            resultBox.style.display = "none";
            return;
        }

        if (!isProbablyUrl(target)) {
            statusEl.textContent = "请输入正确的链接，不支持纯文本内容。";
            resultBox.style.display = "none";
            return;
        }

        statusEl.textContent = "正在生成卡片链接...";
        resultBox.style.display = "none";

        try {
            const res = await fetch("/api/share-create", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title, description, image, target, expire }),
            });

            const data = await res.json();
            if (!data.ok) {
                statusEl.textContent = data.message || "生成失败，请稍后重试。";
                return;
            }

            // ✅ 强制使用短链接（/C/:id），尽量不让前端拿到目标链接
            let shortUrl =
                data.shareUrl ||
                data.shortUrl ||
                (data.id ? `${location.origin}/C/${data.id}` : "") ||
                (data.key ? `${location.origin}/C/${data.key}` : "") ||
                (data.slug ? `${location.origin}/C/${data.slug}` : "") ||
                (data.url && data.url.includes("/C/") ? data.url : "");

            if (!shortUrl) {
                // 兜底：至少不会把目标链接暴露给用户
                shortUrl = `${location.origin}/C/UNKNOWN`;
            }

            shareUrlEl.textContent = shortUrl;
            shareUrlEl.dataset.url = shortUrl;
            resultBox.style.display = "block";
            statusEl.textContent = "";
        } catch (e) {
            console.error(e);
            statusEl.textContent = "网络异常，请稍后再试。";
            resultBox.style.display = "none";
        }
    });

    btnCopy.addEventListener("click", async () => {
        const url = shareUrlEl.dataset.url;
        if (!url) return;
        try {
            await navigator.clipboard.writeText(url);
            statusEl.textContent = "已复制卡片链接 🎉";
        } catch (e) {
            statusEl.textContent = "复制失败，请手动复制链接。";
        }
    });

    btnShare.addEventListener("click", async () => {
        const url = shareUrlEl.dataset.url;
        if (!url || !navigator.share) {
            statusEl.textContent = "当前浏览器不支持系统分享，请手动复制链接。";
            return;
        }
        try {
            await navigator.share({
                title: lastTitle,
                text: lastDescription,
                url,
            });
        } catch (e) {
            console.error(e);
        }
    });
</script>
</body>
</html>
