<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AuraLyn - Music</title>
    <style>
        /* 全局重置 - 零干扰基础 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
        }

        /* 全新配色系统 - 紫调主题 */
        :root {
            --ios-primary: #9333EA; /* 主色调：深紫色 */
            --ios-bg: #000000;
            --ios-card-bg: rgba(28, 28, 30, 0.8);
            --ios-text-primary: #FFFFFF;
            --ios-text-secondary: #8E8E93;
            --ios-border: rgba(255, 255, 255, 0.1);
            --ios-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --ios-blur: 20px;
        }

        body {
            background: var(--ios-bg);
            color: var(--ios-text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        /* 播放列表遮罩层 */
        .playlist-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            z-index: 998;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .playlist-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 核心播放器卡片 */
        .player-card {
            width: 100%;
            max-width: 360px;
            background: var(--ios-card-bg);
            backdrop-filter: blur(var(--ios-blur));
            -webkit-backdrop-filter: blur(var(--ios-blur));
            border: 1px solid var(--ios-border);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: var(--ios-shadow);
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }

        /* 顶部操作区 */
        .top-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        /* 播放列表按钮 */
        .playlist-btn {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            border: none;
            color: var(--ios-text-secondary);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .playlist-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: var(--ios-primary);
        }

        /* 专辑封面 - 优化视觉效果 */
        .album-art {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .album-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .album-art:hover img {
            transform: scale(1.02);
        }

        /* 歌曲信息 */
        .track-info {
            text-align: center;
            width: 100%;
        }

        .track-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 15px;
            color: var(--ios-text-secondary);
        }

        /* 进度条 */
        .progress-control {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            position: relative;
            cursor: pointer;
        }

        .progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: var(--ios-primary);
            border-radius: 2px;
            width: 0%;
            transition: width 0.2s linear;
        }

        .progress-knob {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background: var(--ios-primary);
            border-radius: 50%;
            right: -6px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .progress-bar:hover .progress-knob {
            opacity: 1;
        }

        .time-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--ios-text-secondary);
        }

        /* 控制按钮区 */
        .playback-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            background: transparent;
            border: none;
            color: var(--ios-text-primary);
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .control-btn:hover {
            color: var(--ios-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        /* 播放按钮 */
        .play-btn {
            width: 64px;
            height: 64px;
            background: var(--ios-primary);
            color: white;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(147, 51, 234, 0.4);
        }

        .play-btn:hover {
            background: #7E22CE;
            color: white;
            transform: scale(1.05);
        }

        /* 音量控制 */
        .volume-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }

        .volume-icon {
            color: var(--ios-text-secondary);
            font-size: 18px;
        }

        .volume-slider {
            width: 180px;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--ios-primary);
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* 播放列表 */
        .playlist-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 340px;
            height: 100vh;
            background: var(--ios-card-bg);
            backdrop-filter: blur(var(--ios-blur));
            -webkit-backdrop-filter: blur(var(--ios-blur));
            border-left: 1px solid var(--ios-border);
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.3, 0, 0.2, 1);
            z-index: 999;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .playlist-panel.open {
            transform: translateX(0);
        }

        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--ios-border);
        }

        .playlist-title {
            font-size: 20px;
            font-weight: 600;
        }

        .close-playlist {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            border: none;
            color: var(--ios-text-secondary);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-playlist:hover {
            background: rgba(255, 255, 255, 0.15);
            color: var(--ios-primary);
        }

        .track-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            flex: 1;
            padding-right: 8px;
        }

        .track-item {
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(255, 255, 255, 0.03);
            transition: all 0.2s ease;
        }

        .track-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .track-item.active {
            background: rgba(147, 51, 234, 0.15);
            color: var(--ios-primary);
        }

        .track-item-thumb {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .track-item-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .track-item-info {
            flex: 1;
            overflow: hidden;
        }

        .track-item-title {
            font-size: 16px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .track-item-artist {
            font-size: 14px;
            color: var(--ios-text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playing-badge {
            color: var(--ios-primary);
            font-size: 16px;
            display: none;
        }

        .track-item.active .playing-badge {
            display: block;
        }

        /* 移动端适配 */
        @media (max-width: 375px) {
            .player-card {
                padding: 24px 20px;
                border-radius: 20px;
            }

            .playback-controls {
                gap: 18px;
            }

            .control-btn {
                width: 44px;
                height: 44px;
                font-size: 18px;
            }

            .play-btn {
                width: 56px;
                height: 56px;
                font-size: 20px;
            }

            .volume-slider {
                width: 140px;
            }
        }
    </style>
    <!-- 引入Font Awesome图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<!-- 播放列表遮罩层 -->
<div class="playlist-overlay" id="playlistOverlay"></div>

<!-- 核心播放器卡片 -->
<div class="player-card">
    <!-- 顶部操作区 -->
    <div class="top-actions">
        <button class="playlist-btn" id="playlistBtn">
            <i class="fas fa-list"></i>
        </button>
        <span style="color: var(--ios-text-secondary); font-size: 14px;">正在播放</span>
        <span style="width: 40px;"></span>
    </div>

    <!-- 专辑封面 - 固定链接 -->
    <div class="album-art">
        <img id="albumCover" src="https://picsum.photos/600" alt="专辑封面">
    </div>

    <!-- 歌曲信息 -->
    <div class="track-info">
        <h2 class="track-title" id="songTitle">Night Time Sailing</h2>
        <p class="track-artist" id="songArtist">Broken Back</p>
    </div>

    <!-- 进度控制 -->
    <div class="progress-control">
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
            <div class="progress-knob" id="progressHandle"></div>
        </div>
        <div class="time-labels">
            <span id="currentTime">00:00</span>
            <span id="totalTime">00:00</span>
        </div>
    </div>

    <!-- 播放控制按钮 - 恢复原始布局 -->
    <div class="playback-controls">
        <button class="control-btn" id="prevBtn">
            <i class="fas fa-step-backward"></i>
        </button>
        <button class="control-btn play-btn" id="playBtn">
            <i class="fas fa-play" id="playIcon"></i>
        </button>
        <button class="control-btn" id="nextBtn">
            <i class="fas fa-step-forward"></i>
        </button>
    </div>

    <!-- 音量控制 -->
    <div class="volume-control">
        <i class="fas fa-volume-up volume-icon" id="volumeIcon"></i>
        <input type="range" min="0" max="1" step="0.01" value="1" class="volume-slider" id="volumeSlider">
    </div>
</div>

<!-- 播放列表面板 -->
<div class="playlist-panel" id="playlistContainer">
    <div class="playlist-header">
        <h3 class="playlist-title">我的音乐</h3>
        <button class="close-playlist" id="closePlaylist">
            <i class="fas fa-times"></i>
        </button>
    </div>
    <ul class="track-list" id="playlistList"></ul>
</div>

<script>
    // 手动添加的播放列表 - 所有歌曲使用固定封面链接
    const playlist = [
        {
            title: "词不达意",
            artist: "林忆莲",
            cover: "https://c-ssl.dtstatic.com/uploads/blog/202506/28/xDS15Ol7c2dn46y.thumb.700_0.jpeg",
            src: "https://er-sycdn.kuwo.cn/e13474f6d5f110a8e2645236ec5a77e4/69b4f285/resource/30106/trackmedia/M800002WZGG42rQgyW.mp3?bitrate$320&format$mp3&source$kwplayer_ar_8.5.5.0_apk_keluze.apk&type$convert_url2&user$0&loginUid$0"
        },
        {
            title: "浮生若梦",
            artist: "周深",
            cover: "https://c-ssl.dtstatic.com/uploads/blog/202601/12/9WSPLaB1C85lXY6.thumb.300_0.jpeg_webp",
            src: "https://er-sycdn.kuwo.cn/cf6407e8016b5c4a47934ba7334ce20b/69b4f409/resource/30106/trackmedia/M8000018mj6M0nFpVr.mp3?bitrate$320&format$mp3&source$kwplayer_ar_8.5.5.0_apk_keluze.apk&type$convert_url2&user$0&loginUid$0"
        },
        {
            title: "舍得",
            artist: "王唯旖",
            cover: "https://c-ssl.dtstatic.com/uploads/blog/202602/01/B8Sx2NX1UlMJadn.thumb.300_0.png_webp",
            src: "https://lx-sycdn.kuwo.cn/ee54323e6c377b89d6c492fc30efa276/69b4eb6c/resource/n3/43/84/2278945565.mp3?bitrate$320&format$mp3&source$kwplayer_ar_8.5.5.0_apk_keluze.apk&type$convert_url2&user$0&loginUid$0"
        },
        {
            title: "江上晚风吟",
            artist: "小田音乐社/尹昔眠",
            cover: "https://c-ssl.dtstatic.com/uploads/blog/202601/13/0GSVQa5ZT0aJ1Ey.thumb.300_0.jpg",
            src: "https://lx-sycdn.kuwo.cn/0219aaf1c3c49910d8ddf6e3a5a58293/69b4ed0c/resource/n1/34/20/2880772214.mp3?bitrate$320&format$mp3&source$kwplayer_ar_8.5.5.0_apk_keluze.apk&type$convert_url2&user$0&loginUid$0"
        },
        {
            title: "就让这大雨全都落下",
            artist: "刘大拿",
            cover: "hhttps://c-ssl.dtstatic.com/uploads/blog/202601/13/73Sj4dzNIe75zWY.thumb.300_0.jpg",
            src: "http://m701.music.126.net/20260314133540/1c57bc9d5134349d4519d7a3a9d0291a/jdymusic/obj/wo3DlMOGwrbDjj7DisKw/24947970981/a9c0/ae55/3b63/10987da45939de0ac0f275b7a61c1416.mp3?vuutv=B/sIt5wkE6nhstSRB2uaMyb3mkRDyrAXXxXTrB3ocAFb3O9aQanUJ+G/dqcZRiZpJRuOeqFaTF90+wSP5YouxFsLR+mmcZ6HstX5ObYBoek4u5cUtoXv5BpoCKc3TmEpc81dadRS+1oZjiZFLrh9Vw==&cdntag=bWFyaz1vc193ZWIscXVhbGl0eV9zdGFuZGFyZA"
        }
    ];

    // 全局状态
    const playerState = {
        currentTrack: 0,
        isPlaying: false,
        audio: new Audio()
    };

    // DOM元素
    const el = {
        playBtn: document.getElementById('playBtn'),
        playIcon: document.getElementById('playIcon'),
        prevBtn: document.getElementById('prevBtn'),
        nextBtn: document.getElementById('nextBtn'),
        progressBar: document.getElementById('progressBar'),
        progressFill: document.getElementById('progressFill'),
        progressHandle: document.getElementById('progressHandle'),
        currentTime: document.getElementById('currentTime'),
        totalTime: document.getElementById('totalTime'),
        volumeSlider: document.getElementById('volumeSlider'),
        volumeIcon: document.getElementById('volumeIcon'),
        songTitle: document.getElementById('songTitle'),
        songArtist: document.getElementById('songArtist'),
        albumCover: document.getElementById('albumCover'),
        playlistBtn: document.getElementById('playlistBtn'),
        playlistContainer: document.getElementById('playlistContainer'),
        playlistOverlay: document.getElementById('playlistOverlay'),
        closePlaylist: document.getElementById('closePlaylist'),
        playlistList: document.getElementById('playlistList')
    };

    // 初始化播放器
    function initPlayer() {
        loadTrack(playlist[playerState.currentTrack]);
        renderPlaylist();
        bindEvents();
        // 初始化音量
        playerState.audio.volume = el.volumeSlider.value;
        updateVolumeIcon();
    }

    // 加载歌曲（核心修复：不重置isPlaying状态）
    function loadTrack(track) {
        // 暂停当前音频（避免多音频同时播放）
        playerState.audio.pause();
        // 创建新的音频对象
        playerState.audio = new Audio(track.src);

        // 加载歌曲信息
        el.songTitle.textContent = track.title;
        el.songArtist.textContent = track.artist;
        el.albumCover.src = track.cover;

        // 绑定音频元数据加载事件
        playerState.audio.addEventListener('loadedmetadata', () => {
            el.totalTime.textContent = formatTime(playerState.audio.duration);
        });

        // 绑定播放结束事件
        playerState.audio.addEventListener('ended', nextTrack);

        // 绑定进度更新事件
        playerState.audio.addEventListener('timeupdate', updateProgress);

        // 仅重置UI显示，不修改isPlaying状态
        el.progressFill.style.width = '0%';
        el.progressHandle.style.left = '0%';
        el.currentTime.textContent = '00:00';
        // 根据播放状态更新图标
        el.playIcon.className = playerState.isPlaying ? 'fas fa-pause' : 'fas fa-play';

        // 恢复音量设置
        playerState.audio.volume = el.volumeSlider.value;

        updateActiveTrack();
    }

    // 单独的进度更新函数
    function updateProgress() {
        const progress = (playerState.audio.currentTime / playerState.audio.duration) * 100;
        el.progressFill.style.width = `${progress}%`;
        el.progressHandle.style.left = `${progress}%`;
        el.currentTime.textContent = formatTime(playerState.audio.currentTime);
    }

    // 渲染播放列表
    function renderPlaylist() {
        el.playlistList.innerHTML = '';
        playlist.forEach((track, index) => {
            const li = document.createElement('li');
            li.className = `track-item ${index === playerState.currentTrack ? 'active' : ''}`;
            li.dataset.index = index;

            li.innerHTML = `
                    <div class="track-item-thumb">
                        <img src="${track.cover}" alt="${track.title}">
                    </div>
                    <div class="track-item-info">
                        <div class="track-item-title">${track.title}</div>
                        <div class="track-item-artist">${track.artist}</div>
                    </div>
                    <i class="fas fa-play playing-badge"></i>
                `;

            li.addEventListener('click', () => {
                // 点击列表项时强制设置为播放状态
                playerState.isPlaying = true;
                playerState.currentTrack = index;
                loadTrack(playlist[index]);
                playTrack();
                closePlaylist();
            });

            el.playlistList.appendChild(li);
        });
    }

    // 更新激活的歌曲
    function updateActiveTrack() {
        const items = document.querySelectorAll('.track-item');
        items.forEach((item, index) => {
            item.classList.toggle('active', index === playerState.currentTrack);
        });
    }

    // 播放歌曲
    function playTrack() {
        playerState.audio.play().catch(err => {
            console.log('播放失败:', err);
            // 播放失败时重置状态
            playerState.isPlaying = false;
            el.playIcon.className = 'fas fa-play';
        });
        playerState.isPlaying = true;
        el.playIcon.className = 'fas fa-pause';
    }

    // 暂停歌曲
    function pauseTrack() {
        playerState.audio.pause();
        playerState.isPlaying = false;
        el.playIcon.className = 'fas fa-play';
    }

    // 上一曲（核心修复：强制保留播放状态）
    function prevTrack() {
        // 保存当前播放状态（关键：不被loadTrack重置）
        const wasPlaying = playerState.isPlaying;
        playerState.currentTrack = (playerState.currentTrack - 1 + playlist.length) % playlist.length;
        loadTrack(playlist[playerState.currentTrack]);
        // 无论之前是否播放，点击上一曲都自动播放
        playerState.isPlaying = true;
        playTrack();
    }

    // 下一曲（核心修复：强制保留播放状态）
    function nextTrack() {
        // 保存当前播放状态
        const wasPlaying = playerState.isPlaying;
        playerState.currentTrack = (playerState.currentTrack + 1) % playlist.length;
        loadTrack(playlist[playerState.currentTrack]);
        // 无论之前是否播放，点击下一曲都自动播放
        playerState.isPlaying = true;
        playTrack();
    }

    // 打开播放列表
    function openPlaylist() {
        el.playlistContainer.classList.add('open');
        el.playlistOverlay.classList.add('active');
    }

    // 关闭播放列表
    function closePlaylist() {
        el.playlistContainer.classList.remove('open');
        el.playlistOverlay.classList.remove('active');
    }

    // 格式化时间
    function formatTime(seconds) {
        if (isNaN(seconds)) return '00:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    // 更新音量图标
    function updateVolumeIcon() {
        const volume = playerState.audio.volume;
        if (volume === 0) {
            el.volumeIcon.className = 'fas fa-volume-mute volume-icon';
        } else if (volume < 0.5) {
            el.volumeIcon.className = 'fas fa-volume-down volume-icon';
        } else {
            el.volumeIcon.className = 'fas fa-volume-up volume-icon';
        }
    }

    // 绑定事件
    function bindEvents() {
        // 基础播放控制
        el.playBtn.addEventListener('click', () => {
            playerState.isPlaying ? pauseTrack() : playTrack();
        });
        el.prevBtn.addEventListener('click', prevTrack);
        el.nextBtn.addEventListener('click', nextTrack);

        // 进度条控制
        el.progressBar.addEventListener('click', (e) => {
            const barWidth = el.progressBar.offsetWidth;
            const clickPos = e.offsetX;
            const progress = (clickPos / barWidth) * 100;

            el.progressFill.style.width = `${progress}%`;
            el.progressHandle.style.left = `${progress}%`;
            playerState.audio.currentTime = (progress / 100) * playerState.audio.duration;
        });

        // 音量控制
        el.volumeSlider.addEventListener('input', () => {
            playerState.audio.volume = el.volumeSlider.value;
            updateVolumeIcon();
        });

        // 播放列表控制
        el.playlistBtn.addEventListener('click', openPlaylist);
        el.closePlaylist.addEventListener('click', closePlaylist);
        el.playlistOverlay.addEventListener('click', closePlaylist);
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', initPlayer);
</script>
</body>
</html>
