<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Music 26">
    <link rel="apple-touch-icon" href="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=256&auto=format&fit=crop">

    <title>iOS 26 Music</title>
    <style>
        :root {
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background-color: #000;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            -webkit-user-select: none;
            user-select: none;
        }

        /* 动态毛玻璃背景 */
        #bgBlur {
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at 50% 50%, #333, #000);
            filter: blur(80px);
            z-index: -1;
            transition: background 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 主容器 */
        .player-shell {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: calc(20px + var(--safe-top)) 25px calc(20px + var(--safe-bottom)) 25px;
            position: relative;
        }

        /* 顶部导航 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header-title { font-weight: 600; opacity: 0.8; font-size: 14px; letter-spacing: 1px; }

        /* 封面区域 */
        .artwork-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }
        .artwork-card {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: scale(0.88);
        }
        .artwork-card.playing { transform: scale(1); }
        .artwork-card img { width: 100%; height: 100%; object-fit: cover; }

        /* 歌曲信息 */
        .info-section { margin-top: 10px; }
        .track-name { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
        .artist-name { font-size: 18px; color: rgba(255,255,255,0.5); font-weight: 400; }

        /* 进度条 */
        .scrubber-container { margin-top: 30px; }
        .progress-track {
            width: 100%; height: 6px;
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
            position: relative;
            cursor: pointer;
        }
        .progress-fill {
            height: 100%; background: #fff;
            border-radius: 10px; width: 0%;
        }
        .time-labels {
            display: flex; justify-content: space-between;
            margin-top: 10px; font-size: 12px; opacity: 0.4;
        }

        /* 控制栏 */
        .main-controls {
            display: flex; justify-content: space-around;
            align-items: center; margin: 40px 0;
        }
        .ctrl-btn {
            background: none; border: none; color: #fff; cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        .ctrl-btn:active { transform: scale(0.9); opacity: 0.6; }
        .play-pause {
            width: 80px; height: 80px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }

        /* 底部列表触发 */
        .list-trigger {
            text-align: center; padding: 10px; opacity: 0.5;
        }

        /* 播放列表抽屉 */
        .playlist-drawer {
            position: absolute;
            bottom: -100%; left: 0;
            width: 100%; height: 70%;
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 35px 35px 0 0;
            z-index: 10;
            padding: 30px 20px;
            transition: bottom 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .playlist-drawer.open { bottom: 0; }
        .drawer-handle {
            width: 40px; height: 5px; background: rgba(255,255,255,0.2);
            border-radius: 10px; margin: -15px auto 20px auto;
        }
        .list-content {
            height: 100%; overflow-y: auto;
            padding-bottom: 50px;
        }
        .list-item {
            display: flex; align-items: center; padding: 12px;
            border-radius: 15px; margin-bottom: 8px;
            transition: background 0.2s;
        }
        .list-item:active { background: rgba(255,255,255,0.1); }
        .list-item.active { background: rgba(255,255,255,0.15); }
        .list-item img { width: 50px; height: 50px; border-radius: 8px; margin-right: 15px; }
        .list-item-info h4 { font-size: 16px; margin-bottom: 2px; }
        .list-item-info p { font-size: 13px; opacity: 0.5; }

        svg { fill: currentColor; }
    </style>
</head>
<body>

<div id="bgBlur"></div>

<div class="player-shell">
    <div class="header">
        <svg width="24" height="24" viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
        <div class="header-title">正在播放</div>
        <svg id="togglePlaylist" width="24" height="24" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
    </div>

    <div class="artwork-wrapper">
        <div class="artwork-card" id="artCard">
            <img id="mainArt" src="" alt="Cover">
        </div>
    </div>

    <div class="info-section">
        <div class="track-name" id="trackTitle">加载中...</div>
        <div class="artist-name" id="trackArtist">艺术家</div>
    </div>

    <div class="scrubber-container">
        <div class="progress-track" id="progressTrack">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="time-labels">
            <span id="curTime">0:00</span>
            <span id="durTime">0:00</span>
        </div>
    </div>

    <div class="main-controls">
        <button class="ctrl-btn" onclick="prev()">
            <svg width="35" height="35" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="ctrl-btn play-pause" onclick="togglePlay()">
            <svg id="playIcon" width="40" height="40" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" style="display:none" width="40" height="40" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="ctrl-btn" onclick="next()">
            <svg width="35" height="35" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
    </div>

    <div class="playlist-drawer" id="drawer">
        <div class="drawer-handle" id="closeDrawer"></div>
        <div class="list-content" id="playlistItems">
        </div>
    </div>
</div>

<audio id="audio"></audio>

<script>
    // 1. 播放列表数据 (方便添加音乐)
    const songs = [
        {
            title: "未来城市 (Synthwave)",
            artist: "Retro Wave",
            cover: "https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=500",
            src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
            color: "radial-gradient(circle at 50% 50%, #5e35b1, #1e88e5, #000)"
        },
        {
            title: "午夜浪漫",
            artist: "Lo-Fi Girl",
            cover: "https://images.unsplash.com/photo-1493225457124-a1a2a5370f20?w=500",
            src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
            color: "radial-gradient(circle at 50% 50%, #e53935, #fb8c00, #000)"
        },
        {
            title: "深海沉思",
            artist: "Oceanic",
            cover: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=500",
            src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3",
            color: "radial-gradient(circle at 50% 50%, #00897b, #43a047, #000)"
        }
    ];

    let index = 0;
    let isPlaying = false;
    const audio = document.getElementById('audio');

    // 初始化播放列表UI
    const listContainer = document.getElementById('playlistItems');
    songs.forEach((song, i) => {
        const item = document.createElement('div');
        item.className = `list-item ${i === index ? 'active' : ''}`;
        item.innerHTML = `
                <img src="${song.cover}">
                <div class="list-item-info">
                    <h4>${song.title}</h4>
                    <p>${song.artist}</p>
                </div>
            `;
        item.onclick = () => { playSelect(i); toggleDrawer(); };
        listContainer.appendChild(item);
    });

    function load(idx) {
        const s = songs[idx];
        audio.src = s.src;
        document.getElementById('trackTitle').innerText = s.title;
        document.getElementById('trackArtist').innerText = s.artist;
        document.getElementById('mainArt').src = s.cover;
        document.getElementById('bgBlur').style.background = s.color;

        // 更新列表激活状态
        document.querySelectorAll('.list-item').forEach((el, i) => {
            el.classList.toggle('active', i === idx);
        });

        // Media Session (锁屏控制)
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: s.title, artist: s.artist,
                artwork: [{ src: s.cover, sizes: '512x512' }]
            });
        }
    }

    function togglePlay() {
        if (isPlaying) {
            audio.pause();
            document.getElementById('playIcon').style.display = 'block';
            document.getElementById('pauseIcon').style.display = 'none';
            document.getElementById('artCard').classList.remove('playing');
        } else {
            audio.play();
            document.getElementById('playIcon').style.display = 'none';
            document.getElementById('pauseIcon').style.display = 'block';
            document.getElementById('artCard').classList.add('playing');
        }
        isPlaying = !isPlaying;
    }

    function playSelect(i) {
        index = i;
        load(index);
        isPlaying = false;
        togglePlay();
    }

    function next() { index = (index + 1) % songs.length; playSelect(index); }
    function prev() { index = (index - 1 + songs.length) % songs.length; playSelect(index); }

    // 进度条与时间
    audio.ontimeupdate = () => {
        const p = (audio.currentTime / audio.duration) * 100;
        document.getElementById('progressFill').style.width = p + '%';
        document.getElementById('curTime').innerText = formatTime(audio.currentTime);
    };
    audio.onloadedmetadata = () => {
        document.getElementById('durTime').innerText = formatTime(audio.duration);
    };
    audio.onended = next;

    function formatTime(s) {
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60);
        return `${m}:${sec < 10 ? '0' : ''}${sec}`;
    }

    // 进度条点击跳转
    document.getElementById('progressTrack').onclick = (e) => {
        const rect = e.target.getBoundingClientRect();
        const x = e.clientX - rect.left;
        audio.currentTime = (x / rect.width) * audio.duration;
    };

    // 抽屉逻辑
    const drawer = document.getElementById('drawer');
    const toggleDrawer = () => drawer.classList.toggle('open');
    document.getElementById('togglePlaylist').onclick = toggleDrawer;
    document.getElementById('closeDrawer').onclick = toggleDrawer;

    // 锁屏控制绑定
    if ('mediaSession' in navigator) {
        navigator.mediaSession.setActionHandler('play', togglePlay);
        navigator.mediaSession.setActionHandler('pause', togglePlay);
        navigator.mediaSession.setActionHandler('previoustrack', prev);
        navigator.mediaSession.setActionHandler('nexttrack', next);
    }

    load(index);
</script>
</body>
</html>
