<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Pastebox</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon：多种写法提高兼容性 -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="icon" href="https://save.aura.us.kg/Picture/favicon.ico" type="image/x-icon">

    <!-- Open Graph / WeChat / Telegram 预览 -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Pastebox">
    <meta property="og:title" content="Pastebox">
    <meta property="og:description" content="简洁、安静的 Paste 工具，支持文本与代码存储。">
    <meta property="og:image" content="https://save.aura.us.kg/Picture/Fm2.png">
    <meta property="og:url" content="https://aura.us.kg/Paste/">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Pastebox">
    <meta name="twitter:description" content="简洁、安静的 Paste 工具，支持文本与代码存储。">
    <meta name="twitter:image" content="https://save.aura.us.kg/Picture/Fm2.png">

    <style>
        :root{
            --bg:#020617;
            --layer:rgba(15,23,42,0.96);
            --layer-soft:rgba(15,23,42,0.88);
            --border-soft:rgba(148,163,184,0.4);
            --border-strong:rgba(148,163,184,0.9);
            --text-main:#e5e7eb;
            --text-sub:#9ca3af;
            --accent:#eab308;
            --accent2:#6366f1;
            --danger:#fecaca;
            --shadow-main:0 22px 60px rgba(15,23,42,0.9);
            --input-bg:rgba(15,23,42,0.96);
        }
        body.theme-light{
            --bg:#f3f4f6;
            --layer:#ffffff;
            --layer-soft:#f9fafb;
            --text-main:#0f172a;
            --text-sub:#6b7280;
            --border-soft:rgba(148,163,184,0.5);
            --border-strong:rgba(148,163,184,0.9);
            --accent:#2563eb;
            --accent2:#7c3aed;
            --danger:#ef4444;
            --shadow-main:0 22px 60px rgba(148,163,184,0.45);
            --input-bg:#f9fafb;
        }
        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }
        html,body{
            height:100%;
        }
        body{
            font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
            background:radial-gradient(circle at 0% 0%,#1f2937 0,transparent 55%),
                       radial-gradient(circle at 100% 100%,#111827 0,transparent 55%),
                       var(--bg);
            color:var(--text-main);
            -webkit-font-smoothing:antialiased;
            padding:24px;
        }
        .page{
            max-width:1120px;
            margin:0 auto;
            display:flex;
            flex-direction:column;
            gap:20px;
        }
        .layout-main{
            display:grid;
            grid-template-columns: minmax(0, 3fr) minmax(0, 2.1fr);
            gap:20px;
        }
        @media(max-width:960px){
            body{padding:16px;}
            .layout-main{grid-template-columns:1fr;}
        }
        .card{
            background:radial-gradient(circle at 0 0,rgba(148,163,184,0.16),transparent 55%),
                       radial-gradient(circle at 100% 100%,rgba(148,163,184,0.2),transparent 55%),
                       var(--layer);
            border-radius:24px;
            border:1px solid rgba(148,163,184,0.45);
            box-shadow:var(--shadow-main);
            padding:18px 18px 16px;
            position:relative;
            overflow:hidden;
        }
        .card::before{
            content:"";
            position:absolute;
            inset:-40%;
            background:radial-gradient(circle at 0 0,rgba(251,191,36,0.08) 0,transparent 55%),
                       radial-gradient(circle at 100% 100%,rgba(59,130,246,0.08) 0,transparent 55%);
            opacity:0.65;
            mix-blend-mode:screen;
            pointer-events:none;
        }
        .card-inner{
            position:relative;
            z-index:1;
        }
        .card-header{
            display:flex;
            align-items:center;
            justify-content:space-between;
            margin-bottom:10px;
        }
        .title-block{
            display:flex;
            flex-direction:column;
            gap:2px;
        }
        .title{
            font-size:18px;
            letter-spacing:.06em;
            text-transform:uppercase;
            color:var(--text-main);
        }
        .subtitle{
            font-size:11px;
            text-transform:uppercase;
            color:var(--text-sub);
            letter-spacing:.14em;
        }
        .badge{
            font-size:11px;
            padding:2px 8px;
            border-radius:999px;
            border:1px solid rgba(148,163,184,0.5);
            color:var(--text-sub);
        }
        .hint{
            font-size:11px;
            color:var(--text-sub);
        }
        .hint-error{color:#f97373;}
        .hint-success{color:#22c55e;}
        .byte-count{font-size:11px;color:var(--text-sub);}
        .byte-num{color:var(--accent2);font-weight:600;}

        /* 节点类型提示 */
        .node-detect{
            font-size:11px;
            color:var(--text-sub);
            margin-left:12px;
            opacity:.9;
        }

        /* 备注行里的订阅按钮区域 */
        .node-sub-wrap{
            display:flex;
            align-items:center;
            gap:6px;
            margin-left:8px;
        }
        .node-sub-btn{
            padding:3px 10px;
            border-radius:999px;
            font-size:11px;
            border:none;
            cursor:pointer;
            background:#22c55e;
            color:#022c22;
            font-weight:500;
            box-shadow:0 4px 10px rgba(34,197,94,0.35);
            white-space:nowrap;
        }
        .node-sub-btn:hover{
            filter:brightness(1.06);
        }
        .node-sub-select{
            border-radius:999px;
            border:1px solid var(--border-soft);
            background:var(--input-bg);
            color:var(--text-main);
            font-size:11px;
            padding:3px 8px;
        }

        /* 原本字节 + 小药丸，现在只用作右侧小药丸样式 */
        .byte-actions{
            display:flex;
            align-items:center;
            gap:6px;
        }
        .pill{
            display:inline-flex;
            align-items:center;
            border-radius:999px;
            padding:2px 8px;
            font-size:11px;
            background:radial-gradient(circle at 0 0,rgba(251,191,36,0.12),transparent 55%),
                       radial-gradient(circle at 100% 100%,rgba(59,130,246,0.12),transparent 55%);
            border:1px solid rgba(148,163,184,0.45);
            color:var(--text-sub);
            gap:4px;
        }
        .pill svg{width:12px;height:12px;}
        .btn{
            border:none;
            border-radius:999px;
            padding:6px 16px;
            font-size:13px;
            cursor:pointer;
            display:inline-flex;
            align-items:center;
            gap:6px;
            background:linear-gradient(135deg,#facc15,#f97316);
            color:#111827;
            font-weight:500;
            box-shadow:0 12px 35px rgba(248,250,252,0.08);
        }
        .btn:hover{filter:brightness(1.04);}
        .btn-secondary{
            border-radius:999px;
            padding:5px 12px;
            font-size:12px;
            background:rgba(15,23,42,0.8);
            color:var(--text-main);
            border:1px solid rgba(148,163,184,0.6);
            cursor:pointer;
            display:inline-flex;
            align-items:center;
            gap:6px;
        }
        .btn-secondary:hover{
            background:rgba(15,23,42,0.96);
        }
        .btn-danger{
            border-radius:999px;
            padding:5px 12px;
            font-size:12px;
            background:rgba(153,27,27,0.92);
            color:#fecaca;
            border:1px solid rgba(248,113,113,0.9);
            cursor:pointer;
            display:inline-flex;
            align-items:center;
            gap:4px;
        }
        .btn-danger:hover{
            background:rgba(127,29,29,0.98);
        }
        .btn-xs{
            padding:4px 9px;
            font-size:11px;
        }
        .btn-icon{
            padding-inline:10px;
        }
        .icon-svg{
            display:inline-flex;
            align-items:center;
            justify-content:center;
        }
        .field-block{
            margin-bottom:12px;
        }
        .field-label{
            font-size:12px;
            color:var(--text-sub);
            margin-bottom:4px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:8px;
        }
        .field-inline{
            display:flex;
            align-items:center;
            gap:8px;
        }
        .field-inline .btn-secondary{
            white-space:nowrap;
        }
        .input{
            width:100%;
            border-radius:14px;
            border:1px solid rgba(148,163,184,0.55);
            padding:7px 10px;
            font-size:13px;
            background:var(--input-bg);
            color:var(--text-main);
            outline:none;
        }
        .input:focus{
            border-color:var(--accent2);
            box-shadow:0 0 0 1px rgba(99,102,241,0.4);
        }
        .input::placeholder{
            color:rgba(148,163,184,0.7);
        }
        .input-error{
            border-color:#f97373 !important;
        }
        .textarea-wrap{
            position:relative;
            border-radius:20px;
            border:1px solid rgba(148,163,184,0.65);
            background:var(--input-bg);
            overflow:hidden;
        }
        .textarea-inner{
            position:relative;
            display:flex;
        }
        .line-counter{
            width:54px;
            padding:8px 6px 8px 10px;
            border-right:1px solid rgba(148,163,184,0.35);
            font-size:11px;
            color:var(--text-sub);
            background:linear-gradient(to bottom,rgba(15,23,42,1),rgba(15,23,42,0.9));
            text-align:right;
            user-select:none;
        }
        textarea{
            flex:1;
            border:none;
            outline:none;
            resize:vertical;
            min-height:220px;
            max-height:460px;
            padding:8px 10px;
            font-size:13px;
            line-height:1.6;
            background:transparent;
            color:var(--text-main);
            font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
        }
        textarea::placeholder{
            color:rgba(148,163,184,0.65);
        }
        .textarea-footer{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:6px 10px;
            border-top:1px solid rgba(148,163,184,0.4);
            background:linear-gradient(to right,rgba(15,23,42,0.96),rgba(15,23,42,0.92));
            font-size:11px;
        }
        .status{
            margin-top:6px;
            font-size:11px;
            color:var(--text-sub);
            min-height:16px;
        }
        .status.error{color:#fecaca;}
        .status.success{color:#86efac;}
        .result-box{
            margin-top:10px;
            border-radius:16px;
            border:1px dashed rgba(148,163,184,0.6);
            background:radial-gradient(circle at 0 0,rgba(59,130,246,0.06),transparent 55%),
                       radial-gradient(circle at 100% 100%,rgba(234,179,8,0.06),transparent 55%),
                       rgba(15,23,42,0.9);
            padding:8px 10px;
            font-size:12px;
            display:none;
        }
        .result-link{
            margin:4px 0 6px;
            word-break:break-all;
            font-family:ui-monospace,monospace;
            color:var(--accent2);
        }
        .result-actions{
            display:flex;
            flex-wrap:wrap;
            gap:8px;
            justify-content:flex-end;
        }
        .link-base{
            font-size:11px;
            color:var(--text-sub);
            margin-bottom:4px;
        }
        .switch-row{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:8px;
            margin-bottom:6px;
        }
        .switch-label{
            display:flex;
            align-items:center;
            gap:6px;
            font-size:11px;
            color:var(--text-sub);
        }
        .switch{
            position:relative;
            width:38px;
            height:20px;
        }
        .switch input{
            display:none;
        }
        .switch-slider{
            position:absolute;
            inset:0;
            border-radius:999px;
            background:rgba(15,23,42,0.9);
            border:1px solid rgba(148,163,184,0.7);
            transition:.15s ease-out;
        }
        .switch-slider::before{
            content:"";
            position:absolute;
            width:16px;
            height:16px;
            border-radius:999px;
            background:radial-gradient(circle at 20% 20%,#facc15 0,#f97316 40%,#ea580c 100%);
            top:1px;
            left:1px;
            transition:.15s ease-out;
            box-shadow:0 4px 10px rgba(15,23,42,0.7);
        }
        .switch input:checked + .switch-slider{
            border-color:rgba(251,191,36,0.9);
            background:rgba(15,23,42,1);
        }
        .switch input:checked + .switch-slider::before{
            transform:translateX(18px);
        }
        .ttl-group{
            display:flex;
            flex-wrap:wrap;
            gap:8px;
            margin-top:4px;
        }
        .ttl-btn{
            font-size:11px;
            padding:4px 10px;
            border-radius:999px;
            border:1px solid rgba(148,163,184,0.6);
            background:rgba(15,23,42,0.9);
            color:var(--text-sub);
            cursor:pointer;
        }
        .ttl-btn.active{
            border-color:var(--accent2);
            background:rgba(37,99,235,0.18);
            color:var(--accent2);
        }
        .ttl-hint{
            font-size:11px;
            color:var(--text-sub);
            margin-top:4px;
        }

        /* 用户中心 */
        .uc-backdrop{
            position:fixed;
            inset:0;
            background:rgba(15,23,42,0.8);
            backdrop-filter:blur(18px);
            display:none;
            align-items:center;
            justify-content:center;
            z-index:40;
        }
        .uc-panel{
            width:100%;
            max-width:760px;
            max-height:80vh;
            border-radius:24px;
            background:radial-gradient(circle at 0 0,rgba(59,130,246,0.08),transparent 55%),
                       radial-gradient(circle at 100% 100%,rgba(234,179,8,0.08),transparent 55%),
                       var(--layer);
            border:1px solid rgba(148,163,184,0.8);
            box-shadow:0 24px 60px rgba(15,23,42,0.95);
            padding:16px 16px 14px;
            display:flex;
            flex-direction:column;
            gap:10px;
        }
        .uc-header{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:10px;
        }
        .uc-title{
            font-size:15px;
            text-transform:uppercase;
            letter-spacing:.18em;
        }
        .uc-subtitle{
            font-size:11px;
            color:var(--text-sub);
        }
        .uc-body{
            margin-top:2px;
            border-radius:16px;
            border:1px solid rgba(148,163,184,0.6);
            background:rgba(15,23,42,0.94);
            padding:10px;
            display:flex;
            flex-direction:column;
            gap:8px;
            min-height:160px;
        }
        .uc-empty{
            font-size:12px;
            color:var(--text-sub);
        }
        .uc-list{
            display:flex;
            flex-direction:column;
            gap:8px;
            font-size:12px;
        }
        .uc-item{
            border-radius:12px;
            border:1px solid rgba(55,65,81,0.85);
            padding:8px 8px 7px;
            background:radial-gradient(circle at 0 0,rgba(59,130,246,0.04),transparent 55%),
                       radial-gradient(circle at 100% 100%,rgba(234,179,8,0.04),transparent 55%),
                       rgba(15,23,42,0.96);
        }
        .uc-item-top{
            display:flex;justify-content:space-between;gap:6px;
        }
        .uc-item-title{font-size:12px;font-weight:600;display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
        .uc-item-meta{font-size:10px;color:var(--text-sub);text-align:right;}

        .uc-sub-wrap{
            display:inline-flex;
            align-items:center;
            position:relative;
            margin-left:6px;
        }
        .uc-sub-btn{
            padding:2px 8px;
            border-radius:999px;
            font-size:10px;
            border:none;
            cursor:pointer;
            background:#22c55e;
            color:#022c22;
            font-weight:500;
            box-shadow:0 4px 10px rgba(34,197,94,0.35);
        }
        .uc-sub-btn:hover{
            filter:brightness(1.06);
        }
        .uc-sub-menu{
            position:absolute;
            top:120%;
            right:0;
            background:var(--layer);
            border-radius:10px;
            border:1px solid var(--border-soft);
            box-shadow:0 12px 30px rgba(15,23,42,0.45);
            padding:6px;
            display:none;
            z-index:20;
        }
        .uc-sub-wrap.open .uc-sub-menu{
            display:block;
        }
        .uc-sub-menu button{
            display:block;
            width:100%;
            border:none;
            background:transparent;
            color:var(--text-main);
            font-size:10px;
            padding:4px 10px;
            text-align:left;
            border-radius:6px;
            cursor:pointer;
            white-space:nowrap;
        }
        .uc-sub-menu button:hover{
            background:var(--layer-soft);
        }
        .uc-remark-tag{
            display:inline-flex;
            align-items:center;
            padding:2px 8px;
            border-radius:999px;
            background:rgba(15,23,42,0.96);
            border:1px solid rgba(148,163,184,0.7);
            color:var(--text-main);
        }
        .uc-slug-tag{
            font-size:11px;
            padding:2px 6px;
            border-radius:999px;
            border:1px dashed rgba(148,163,184,0.7);
            color:var(--text-sub);
        }
        .uc-link-row{
            margin-top:4px;
            font-size:11px;
            color:var(--accent2);
        }
        .uc-link-tag{
            font-family:ui-monospace,monospace;
            word-break:break-all;
        }
        .uc-item-actions{
            margin-top:6px;
            display:flex;
            flex-wrap:wrap;
            gap:6px;
            justify-content:flex-end;
        }

        .theme-toggle{
            display:inline-flex;
            align-items:center;
            gap:6px;
            font-size:11px;
            color:var(--text-sub);
        }
        .theme-toggle button{
            border-radius:999px;
            border:1px solid rgba(148,163,184,0.6);
            background:rgba(15,23,42,0.9);
            color:var(--text-main);
            padding:3px 10px;
            font-size:11px;
            cursor:pointer;
        }
        .theme-toggle button.active{
            background:rgba(234,179,8,0.15);
            color:var(--accent);
            border-color:rgba(234,179,8,0.7);
        }

        .status-top-row{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:10px;
        }
        .status-top-row-left{
            display:flex;
            align-items:center;
            gap:8px;
        }

        .tag-chip{
            font-size:10px;
            padding:2px 7px;
            border-radius:999px;
            border:1px solid rgba(148,163,184,0.6);
            color:var(--text-sub);
        }

        .auth-pill{
            display:inline-flex;
            align-items:center;
            gap:4px;
            padding:3px 9px;
            border-radius:999px;
            border:1px solid rgba(148,163,184,0.7);
            background:rgba(15,23,42,0.9);
            font-size:11px;
            color:var(--text-sub);
            cursor:pointer;
        }
        .auth-pill strong{
            color:var(--accent);
            font-weight:600;
        }

        .auth-modal{
            position:fixed;
            inset:0;
            background:rgba(15,23,42,0.82);
            backdrop-filter:blur(20px);
            display:none;
            align-items:center;
            justify-content:center;
            z-index:50;
        }
        .auth-panel{
            width:100%;
            max-width:360px;
            border-radius:20px;
            background:radial-gradient(circle at 0 0,rgba(59,130,246,0.15),transparent 55%),
                       radial-gradient(circle at 100% 100%,rgba(234,179,8,0.15),transparent 55%),
                       var(--layer);
            border:1px solid rgba(148,163,184,0.8);
            box-shadow:0 24px 60px rgba(15,23,42,0.98);
            padding:16px 16px 14px;
        }
        .auth-title{
            font-size:16px;
            margin-bottom:4px;
        }
        .auth-desc{
            font-size:11px;
            color:var(--text-sub);
            margin-bottom:10px;
        }
        .auth-footer{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-top:8px;
            font-size:11px;
            color:var(--text-sub);
        }
        .auth-msg{
            font-size:11px;
            min-height:16px;
            margin-top:4px;
        }
        .auth-msg.error{color:#fecaca;}
        .auth-msg.success{color:#86efac;}

        .decode-active{
            background:#000;
            color:#fef3c7;
        }

        .footer{
            font-size:11px;
            color:var(--text-sub);
            text-align:right;
            margin-top:6px;
        }
        .footer a{
            color:var(--accent2);
            text-decoration:none;
        }
        .footer a:hover{text-decoration:underline;}
    </style>
</head>
<body>
<div class="page">
    <div class="card">
        <div class="card-inner">
            <div class="card-header">
                <div class="title-block">
                    <div class="title">PASTEBOX</div>
                    <div class="subtitle">silent snippets, quiet storage</div>
                </div>
                <div class="status-top-row">
                    <div class="status-top-row-left">
                        <span class="tag-chip" id="baseUrlText">https://aura.us.kg/paste/{id}</span>
                        <button type="button" class="auth-pill" id="btnAuthLabel">
                            <span class="icon-svg">
                                <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true">

                                <span class="byte-count">

                            <div class="byte-actions">

                                <button type="button" class="btn-secondary btn-xs" id="uploadBtn">
                                    <span class="icon-svg">
                                        <svg viewBox="0 0 20 20" width="13" height="13">
                                            <path fill="none" stroke="currentColor" stroke-width="1.6" d="M4 15h12M10 3v9m0 0 3-3m-3 3-3-3"/>
                                        </svg>
                                    </span>
                                    导入文本
                                </button>

                                <!-- Base64 编码 -->
                                <button type="button" class="btn-secondary btn-xs" id="btnBase64Encode">
                                    <span class="icon-svg">
                                        <svg
                                                xmlns="http://www.w3.org/2000/svg"
                                                viewBox="0 0 24 24"

                                                height="20"
                                                fill="none"
                                                stroke="#e5e7eb"

                                        >
                                            <path d="M6 9l6-6 6 6"/>

                                    Base64 编码

                                <!-- Base64 解码 -->
                                <button type="button" class="btn-secondary btn-xs" id="btnBase64Decode">
                                    <span class="icon-svg">

                                                fill="none"

                                                stroke-width="1.8"

                                        >
                                            <path d="M18 15l-6 6-6-6"/>

                                        </svg>
                                    </span>
                                    Base64 解码

                <div class="field-block">
                    <div class="field-label">
                        <span>有效期</span>

                    <div class="ttl-group" id="ttlGroup">
                        <button type="button" class="ttl-btn" data-ttl="1d">1 天</button>
                        <button type="button" class="ttl-btn" data-ttl="7d">7 天</button>

                        <button type="button" class="ttl-btn" data-ttl="forever" id="ttlForeverBtn">Never（登录后可选）</button>

                    <div class="ttl-hint" id="ttlHint"></div>

                <div class="field-block">
                    <div class="field-label">

                <div class="field-block">

                    <div class="field-inline">

                        <!-- 节点订阅按钮（仅当内容为节点、且可确定 ID 时显示） -->
                        <div class="node-sub-wrap" id="nodeSubWrap" style="display:none;">
                            <button type="button" class="node-sub-btn" id="nodeSubBtn">复制订阅</button>
                            <select id="nodeSubClient" class="node-sub-select">

                                <option value="surge">Surge</option>

                                <option value="quantumultx">Quantumult X</option>

                <div class="field-block">
                    <button type="submit" class="btn" id="submitBtn">
                        <span class="icon-svg">

                Pastebox by AurraLynn · 基于 Cloudflare KV / R2 构建。

    <!-- 用户中心 -->
    <div class="uc-backdrop" id="userCenter">
        <div class="uc-panel">
            <div class="uc-header">

                    <div class="uc-title">YOUR PASTES</div>

    <!-- 登录 / 注册弹窗 -->
    <div class="auth-modal" id="authModal">
        <div class="auth-panel">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
                <div>
                    <div class="auth-title">登录 / 注册</div>
                    <div class="auth-desc">登录后可以使用「Never(不过期)」、管理自己的链接。</div>
                </div>
                <button type="button" class="btn-secondary btn-xs" id="authCloseBtn">关闭</button>
            </div>
            <form id="authForm" style="margin-top:10px;">
                <div class="field-block">
                    <div class="field-label">用户名</div>
                    <input id="authUsername" class="input" autocomplete="username">
                </div>
                <div class="field-block">
                    <div class="field-label">密码</div>
                    <input id="authPassword" class="input" type="password" autocomplete="current-password">
                </div>
                <div class="field-inline" style="justify-content:space-between;margin-bottom:6px;">
                    <label class="switch-label">
                        <input type="checkbox" id="authRemember" checked>
                        <span>记住登录状态</span>
                    </label>
                    <div>
                        <button type="button" class="btn-secondary btn-xs" id="btnDoLogin">登录</button>
                        <button type="button" class="btn-secondary btn-xs" id="btnDoRegister">注册</button>
                    </div>
                </div>
                <div class="auth-msg" id="authMsg"></div>
            </form>
        </div>
    </div>
</div>

<script>
    const qs=id=>document.getElementById(id);

    const BASE_URL=location.origin+"/Paste";
    const API_BASE=location.origin+"/api/paste";
    const VIEW_BASE=location.origin+"/api/paste";

    const AUTH_BASE=location.origin+"/api/auth";

    const $content=qs("content");
    const $byteNum=qs("byteNum");
    const $nodeDetectInfo=qs("nodeDetectInfo");
    const $lineCounter=qs("lineCounter");
    const $ttlGroup=qs("ttlGroup");
    const $ttlHint=qs("ttlHint");
    const $form=qs("pasteForm");
    const $submitBtn=qs("submitBtn");
    const $resultBox=qs("resultBox");
    const $viewLinkText=qs("viewLinkText");
    const $btnCopyView=qs("btnCopyView");
    const $btnOpenView=qs("btnOpenView");
    const $btnManageFromResult=qs("btnManageFromResult");
    const $statusMsg=qs("statusMsg");
    const $baseUrlText=qs("baseUrlText");
    const $advancedSection=null;
    const $ttlForeverBtn=qs("ttlForeverBtn");
    const $customId=qs("customId");
    const $customHint=qs("customHint");
    const $remark=qs("remark");
    const $nodeSubWrap=qs("nodeSubWrap");
    const $nodeSubBtn=qs("nodeSubBtn");
    const $nodeSubClient=qs("nodeSubClient");
    const $fileInput=qs("fileInput");
    const $fileHint=qs("fileHint");
    const $uploadBtn=qs("uploadBtn");
    const $btnResetContent=qs("btnResetContent");

    // Base64 按钮
    const $btnBase64Encode = qs("btnBase64Encode");
    const $btnBase64Decode = qs("btnBase64Decode");

    const $btnHome=qs("btnHome");
    const $btnAuthOpen=qs("btnAuthOpen");
    const $btnAuthLabel=qs("btnAuthLabel");
    const $authModal=qs("authModal");
    const $authForm=qs("authForm");
    const $authUsername=qs("authUsername");
    const $authPassword=qs("authPassword");
    const $authRemember=qs("authRemember");
    const $btnDoLogin=qs("btnDoLogin");
    const $btnDoRegister=qs("btnDoRegister");
    const $authCloseBtn=qs("authCloseBtn");
    const $authMsg=qs("authMsg");

    const $userCenter=qs("userCenter");
    const $ucEmpty=qs("ucEmpty");
    const $ucList=qs("ucList");
    const $ucRefreshBtn=qs("ucRefreshBtn");
    const $ucLogoutBtn=qs("ucLogoutBtn");
    const $ucCloseBtn=qs("ucCloseBtn");

    if($baseUrlText)$baseUrlText.textContent=VIEW_BASE+"/{id}";

    const state={
        loggedIn:false,
        username:null,
        ttlKey:"7d",
        customSlugError:false,
        isSubmitting:false,
        mode:"create",
        originalSlug:null
    };

    function escapeHTML(str){
        if(!str) return "";
        return String(str).replace(/[&<>"']/g,c=>({
            "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
        }[c]||c));
    }

    function setStatus(msg,type){
        if(!$statusMsg)return;
        $statusMsg.textContent=msg||"";
        $statusMsg.classList.remove("error","success");
        if(type)$statusMsg.classList.add(type);
    }
    function setAuthTip(msg,type){
        if(!$authMsg)return;
        $authMsg.textContent=msg||"";
        $authMsg.classList.remove("success","error");
        if(type)$authMsg.classList.add(type);
    }

    // ===== Base64 UTF-8 安全编码 / 解码 =====
    function base64EncodeUtf8(str) {
        try {
            return btoa(unescape(encodeURIComponent(str)));
        } catch (_) {
            return null;
        }
    }

    function base64DecodeUtf8(str) {
        try {
            return decodeURIComponent(escape(atob(str)));
        } catch (_) {
            return null;
        }
    }

    // ===== 节点识别（支持 URL / Base64 订阅） =====
    const NODE_SCHEME_RE = /^(ss|vmess|vless|trojan|hysteria2?|hy2|tuic|snell|http|https|socks5?):\/\//i;

    function countNodesInText(text){
        if(!text)return 0;
        let count=0;
        const lines=text.split(/\r?\n/);
        for(const line of lines){
            const s=line.trim();
            if(!s) continue;
            if(NODE_SCHEME_RE.test(s)) count++;
        }
        return count;
    }

    // 返回 { kind: "none" | "url" | "base64", count:number }
    function detectNodeInfoFromText(raw){
        if(!raw) return {kind:"none",count:0};
        const text=raw.trim();
        if(!text) return {kind:"none",count:0};

        // 1）直接在原文里找节点
        const directCount=countNodesInText(text);
        if(directCount>0){
            return {kind:"url",count:directCount};
        }

        // 2）尝试把整体当作 Base64 订阅解码，再找节点
        const compact=text.replace(/\s+/g,"");
        if(/^[A-Za-z0-9+/=]+$/.test(compact) && compact.length%4===0){
            const decoded=base64DecodeUtf8(compact);
            if(decoded!=null){
                const decodedCount=countNodesInText(decoded);
                if(decodedCount>0){
                    return {kind:"base64",count:decodedCount};
                }
            }
        }

        return {kind:"none",count:0};
    }

    function getCurrentSubId(){
        // 优先使用编辑模式下原始 slug
        if(state && state.mode==="edit" && state.originalSlug){
            return state.originalSlug;
        }
        // 其次使用自定义 URL
        if($customId){
            const v=$customId.value.trim();
            if(v) return v;
        }
        // 创建模式且未填写自定义 URL 时，ID 还未生成，此时返回 null
        return null;
    }

    function buildSubUrl(client){
        const id=getCurrentSubId();
        if(!id) return null;
        const base=location.origin + "/api/sub";
        const u=new URL(base);
        u.searchParams.set("id",id);
        if(client){
            u.searchParams.set("client",client);
        }
        return u.toString();
    }

    function updateNodeDetect(){
        if(!$content) return;
        const raw=$content.value||"";
        const info=detectNodeInfoFromText(raw);

        if($nodeDetectInfo){
            if(info.kind==="none"){
                $nodeDetectInfo.textContent="内容类型：普通文本";
            }else if(info.kind==="url"){
                $nodeDetectInfo.textContent=`识别到 ${info.count} 条代理节点`;
            }else{
                $nodeDetectInfo.textContent=`识别到 ${info.count} 条代理节点（Base64 订阅）`;
            }
        }

        if($nodeSubWrap){
            const id=getCurrentSubId();
            if(info.kind==="none" || !id){
                $nodeSubWrap.style.display="none";
            }else{
                $nodeSubWrap.style.display="inline-flex";
            }
        }
    }

    async function postJSON(url,body){
        const res=await fetch(url,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            credentials:"include",
            body:JSON.stringify(body||{})
        });
        const data=await res.json().catch(()=>({}));
        if(!res.ok||data.ok===false){
            throw new Error(data.error||`请求失败（${res.status}）`);
        }
        return data;
    }

    function updateByteCount(){
        if(!$content||!$byteNum)return;
        let len=0;
        try{len=new TextEncoder().encode($content.value).length;}
        catch(_){len=$content.value.length;}
        $byteNum.textContent=len;

        if($lineCounter){
            const v=$content.value||"";
            const lines=v ? v.split(/\r\n|\r|\\n/).length : 0;
            $lineCounter.textContent = lines+" 行";
        }

        // 同步更新节点识别 / 订阅按钮显示
        updateNodeDetect();
    }
    if($content){
        updateByteCount();
        $content.addEventListener("input",updateByteCount);
    }

    if($uploadBtn&&$fileInput){
        $uploadBtn.addEventListener("click",e=>{
            e.preventDefault();
            $fileInput.click();
        });

        $fileInput.addEventListener("change",()=>{
            const file=$fileInput.files&&$fileInput.files[0];
            if(!file)return;
            const reader=new FileReader();
            reader.onload=()=>{
                if($content){
                    $content.value=reader.result||"";
                    updateByteCount();
                }
                if($fileHint){
                    $fileHint.textContent=`已加载：${file.name}（${file.size} 字节）`;
                    $fileHint.classList.remove("hint-error");
                    $fileHint.classList.add("hint-success");
                }
            };
            reader.onerror=()=>{
                if($fileHint){
                    $fileHint.textContent="文件读取失败。";
                    $fileHint.classList.remove("hint-success");
                    $fileHint.classList.add("hint-error");
                }
            };
            reader.readAsText(file);
        });
    }

    // Base64 编码按钮
    if ($btnBase64Encode) {
        $btnBase64Encode.addEventListener("click", () => {
            if (!$content) return;
            const v = $content.value;
            if (!v) {
                setStatus("没有可编码的内容。", "error");
                return;
            }
            const encoded = base64EncodeUtf8(v);
            if (encoded == null) {
                setStatus("Base64 编码失败，内容可能包含不支持的字符。", "error");
                return;
            }
            $content.value = encoded;
            updateByteCount();
            setStatus("已使用 Base64 编码当前内容。", "success");
        });
    }

    // Base64 解码按钮 + 交互高亮
    if ($btnBase64Decode) {
        $btnBase64Decode.addEventListener("click", () => {
            if (!$content) return;
            const v = $content.value;
            if (!v) {
                setStatus("没有可解码的内容。", "error");
                return;
            }
            const decoded = base64DecodeUtf8(v);
            if (decoded == null) {
                setStatus("Base64 解码失败，文本可能不是合法的 Base64。", "error");
                return;
            }
            $content.value = decoded;
            updateByteCount();
            setStatus("已使用 Base64 解码当前内容。", "success");

            // 点击后短暂高亮：变黑 + 换图标
            $btnBase64Decode.classList.add("decode-active");
            setTimeout(() => {
                $btnBase64Decode.classList.remove("decode-active");
            }, 300);
        });
    }

    // 备注行订阅按钮：根据选择客户端复制对应订阅链接
    if($nodeSubBtn && $nodeSubClient){
        $nodeSubBtn.addEventListener("click", async ()=>{
            const client=$nodeSubClient.value||"";
            const url=buildSubUrl(client);
            if(!url){
                setStatus("当前内容尚未保存或未填写自定义 URL，无法生成订阅链接。","error");
                return;
            }
            try{
                await navigator.clipboard.writeText(url);
                setStatus("订阅链接已复制。","success");
            }catch(_){
                setStatus("复制失败，请手动复制。","error");
            }
        });
    }

    const ttlText={
        "1d":"内容将保留 1 天，之后自动清除。",
        "7d":"内容将保留 7 天，适合临时共享。",
        "30d":"内容将保留 30 天。",
        "forever":"内容不会自动过期（后台清理除外）。"
    };
    function setTtl(key){
        state.ttlKey=key;
        if($ttlGroup){
            $ttlGroup.querySelectorAll(".ttl-btn").forEach(b=>{
                b.classList.toggle("active",b.dataset.ttl===key);
            });
        }
        if($ttlHint)$ttlHint.textContent=ttlText[key]||ttlText["7d"];
    }
    setTtl("7d");
    if($ttlGroup){
        $ttlGroup.addEventListener("click",e=>{
            const btn=e.target.closest(".ttl-btn");
            if(!btn)return;
            const key=btn.dataset.ttl;
            if(key==="forever" && !state.loggedIn){
                setStatus("请先登录以使用「Never(不过期)」。","error");
                return;
            }
            setTtl(key);
        });
    }

    function validateCustomSlug(){
        if(!$customId)return;
        const v=$customId.value.trim();
        if(!v){
            state.customSlugError=false;
            if($customHint){
                $customHint.textContent="留空则自动生成随机 ID。";
                $customHint.classList.remove("hint-error","hint-success");
            }
            $customId.classList.remove("input-error");
            return;
        }
        const ok=/^[a-zA-Z0-9_-]{1,64}$/.test(v);
        state.customSlugError=!ok;
        if(!ok){
            if($customHint){
                $customHint.textContent="只允许字母、数字、连字符与下划线，长度 1~64。";
                $customHint.classList.remove("hint-success");
                $customHint.classList.add("hint-error");
            }
            $customId.classList.add("input-error");
        }else{
            if($customHint){
                $customHint.textContent="可以使用这个自定义 ID。";
                $customHint.classList.remove("hint-error");
                $customHint.classList.add("hint-success");
            }
            $customId.classList.remove("input-error");
        }
    }
    if($customId)$customId.addEventListener("input",validateCustomSlug);

    function enterCreateMode(clear){
        state.mode="create";
        state.originalSlug=null;
        if($submitBtn){
            const span=$submitBtn.querySelector(".text");
            if(span)span.textContent="创建";
        }
        if($btnHome)$btnHome.style.display="none";
        if(clear){
            if($content)$content.value="";
            if($remark)$remark.value="";
            if($customId)$customId.value="";
            updateByteCount();
            setStatus("");
        }
    }

    if($btnHome){
        $btnHome.addEventListener("click",()=>{
            enterCreateMode(true);
            history.replaceState(null,"",BASE_URL);
            window.scrollTo({top:0,behavior:"smooth"});
        });

    function formatDate(d){
        if(!d)return"-";
        const dt=new Date(d);
        if(Number.isNaN(dt.getTime()))return"-";
        const y=dt.getFullYear();
        const m=String(dt.getMonth()+1).padStart(2,"0");
        const day=String(dt.getDate()).padStart(2,"0");
        const hh=String(dt.getHours()).padStart(2,"0");
        const mm=String(dt.getMinutes()).padStart(2,"0");
        return `${y}-${m}-${day} ${hh}:${mm}`;
    }
    function calcRemainDays(expiresAt){
        if(!expiresAt)return null;
        const t=+new Date(expiresAt);
        if(Number.isNaN(t))return null;
        const now=Date.now();
        const diff=t-now;
        const d=Math.floor(diff/(24*3600*1000));
        return d;
    }

    async function loadUserPastes(){
        if(!$ucEmpty||!$ucList)return;
        $ucEmpty.style.display="";
        $ucEmpty.textContent="正在加载你的记录…";
        $ucList.style.display="none";
        $ucList.innerHTML="";
        try{
            const res=await fetch(location.origin+"/api/me/pastes",{credentials:"include"});
            if(res.status===401){
                $ucEmpty.textContent="登录状态已失效，请重新登录。";
                setLoggedOut();
                return;
            }
            const data=await res.json().catch(()=>({}));
            if(!data.ok){
                $ucEmpty.textContent=data.error||"加载失败。";
                return;
            }
            const items=data.items||[];
            if(!items.length){
                $ucEmpty.textContent="暂无记录，先去创建一条吧。";
                return;
            }

            const valid=[];
            await Promise.all(items.map(async (item)=>{
                const slug=item.slug||item.id;
                if(!slug)return;
                try{
                    const u=new URL(`${API_BASE}/${encodeURIComponent(slug)}`);
                    u.searchParams.set("manage","1");
                    const r=await fetch(u.toString(),{credentials:"include"});
                    if(!r.ok)return;
                    const d=await r.json().catch(()=>null);
                    if(!d||d.ok===false)return;
                    const remain=calcRemainDays(d.expiresAt);
                    if(remain!=null && remain<0)return;
                    valid.push(d);
                }catch(_){}
            }));

            if(!valid.length){
                $ucEmpty.style.display="";
                $ucEmpty.textContent="暂无有效记录（过期或已删除）。";
                return;
            }

            valid.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

            $ucEmpty.style.display="none";
            $ucList.style.display="flex";

            valid.forEach(d=>{
                const slug=d.slug;
                if(!slug)return;
                const remark=d.remark||"(无备注)";
                const created=d.createdAt||null;
                const expires=d.expiresAt||null;
                const ttlKey=d.ttlKey||"";

                const viewUrl=`${VIEW_BASE}/${encodeURIComponent(slug)}`;
                const remain=calcRemainDays(expires);

                const row=document.createElement("div");
                row.className="uc-item";
                row.innerHTML=`
                    <div class="uc-item-top">
                        <div class="uc-item-title">
                            <span class="uc-remark-tag">${escapeHTML(remark)}</span>
                            <span class="uc-slug-tag">${escapeHTML(slug)}</span>
                        </div>
                        <div class="uc-item-meta"></div>
                    </div>
                    <div class="uc-link-row">
                        <span class="uc-link-tag">${escapeHTML(viewUrl)}</span>
                    </div>
                    <div class="uc-item-actions"></div>
                `;
                const meta=row.querySelector(".uc-item-meta");
                const act=row.querySelector(".uc-item-actions");

                let metaText="";
                if(!expires || ttlKey==="forever"){
                    metaText=`到期：Never🙌🏿`;
                }else{
                    metaText=`到期：${formatDate(expires)}`;
                    if(remain!=null && remain>=0){
                        metaText+=` · 自动清除还有 ${remain} 天`;
                    }
                }
                meta.textContent=metaText;

                // 若该条内容为代理节点，追加绿色订阅按钮
                const nodeInfo = detectNodeInfoFromText(d.content || "");
                const isNode = nodeInfo && nodeInfo.kind !== "none";
                if(isNode){
                    const subWrap=document.createElement("div");
                    subWrap.className="uc-sub-wrap";

                    const subBtn=document.createElement("button");
                    subBtn.type="button";
                    subBtn.className="uc-sub-btn";
                    subBtn.textContent="订阅";

                    const subMenu=document.createElement("div");
                    subMenu.className="uc-sub-menu";

                    const baseSub=`${location.origin}/api/sub?id=${encodeURIComponent(slug)}`;
                    const clients = [
                        {key:"", label:"通用"},
                        {key:"surge", label:"Surge"},
                        {key:"clash", label:"Clash"},
                        {key:"stash", label:"Stash"},
                        {key:"quantumultx", label:"Quantumult X"},
                    ];

                    clients.forEach(c=>{
                        const b=document.createElement("button");
                        b.type="button";
                        b.textContent=c.label;
                        b.addEventListener("click", async ()=>{
                            const url = c.key ? `${baseSub}&client=${c.key}` : baseSub;
                            try{
                                await navigator.clipboard.writeText(url);
                                setStatus(`已复制订阅链接（${c.label}）`,"success");
                            }catch(_){
                                window.prompt("复制失败，请手动复制：", url);
                            }
                            subWrap.classList.remove("open");
                        });
                        subMenu.appendChild(b);
                    });

                    subBtn.addEventListener("click", ()=>{
                        subWrap.classList.toggle("open");
                    });

                    subWrap.appendChild(subBtn);
                    subWrap.appendChild(subMenu);
                    meta.appendChild(subWrap);
                }

                const btnEdit=document.createElement("button");
                btnEdit.type="button";
                btnEdit.className="btn-secondary btn-xs";
                btnEdit.innerHTML = `
    <span class="icon-svg">
        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-user-pen-icon lucide-user-pen"
            style="fill:none;"
        >
            <path d="M11.5 15H7a4 4 0 0 0-4 4v2" />
            <path d="M21.378 16.626a1 1 0 0 0-3.004-3.004l-4.01 4.01a2 2 0 0 0-.505.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z" />
            <circle cx="10" cy="7" r="4" />
        </svg>
    </span>
    编辑
`;
                btnEdit.addEventListener("click",()=>{
                    closeUserCenter();
                    enterEditMode(slug);
                });

                const btnCopy=document.createElement("button");
                btnCopy.type="button";
                btnCopy.className="btn-secondary btn-xs";
                btnCopy.innerHTML=`<span class="icon-svg">
                    <svg viewBox="0 0 20 20"><path d="M7 3a3 3 0 0 1 3-3h4a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3h-4a3 3 0 0 1-3-3V3Zm-4 4a2 2 0 0 1 2-2v9a2 2 0 0 0 2 2h6a2 2 0 0 1-2 2H7a4 4 0 0 1-4-4V7Z" fill="currentColor"/></svg>
                </span>复制`;
                btnCopy.addEventListener("click",async ()=>{
                    try{
                        await navigator.clipboard.writeText(viewUrl);
                        setStatus("已复制链接。","success");
                    }catch(_){
                        window.prompt("复制失败，请手动复制：",viewUrl);
                    }
                });

                const btnOpen=document.createElement("button");
                btnOpen.type="button";
                btnOpen.className="btn-secondary btn-xs";
                btnOpen.innerHTML = `
    <span class="icon-svg">
        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-eye-icon lucide-eye"
            style="fill:none;"
        >
            <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
            <circle cx="12" cy="12" r="3" />
        </svg>
    </span>
    打开
`;
                btnOpen.addEventListener("click",()=>{window.open(viewUrl,"_blank","noopener");});

                const btnDel=document.createElement("button");
                btnDel.type="button";
                btnDel.className="btn-danger btn-xs";
                btnDel.innerHTML = `
    <span class="icon-svg">
        <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
        >
            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.3-.14.772-.218 1.072.122 0 0 .43.618.43 1.588v.5a1 1 0 0 1-1 1H5.27a1 1 0 0 1-1-1v-.162c0-1.07.43-1.588.43-1.588.3-.34.772-.262 1.072-.122 0 0 .675.263 2.228.263 1.553 0 2.228-.263 2.228-.263.3-.14.772-.218 1.072.122 0 0 .675.263 2.228.263 1.553 0 2.228-.263 2.228-.263Z"
            />
            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9.879 4.5c.314-.934 1.2-1.5 2.121-1.5 0 0 1.5 0 2.121 1.5M4.5 7h15"
            />
        </svg>
    </span>
    删除
`;
                btnDel.addEventListener("click",async ()=>{
                    if(!confirm("确认删除该链接？"))return;
                    try{
                        await postJSON(API_BASE,{action:"delete",slug});
                        loadUserPastes();
                        setStatus("已删除一条记录。","success");
                    }catch(err){
                        setStatus(err.message||"删除失败。","error");
                    }
                });

                act.appendChild(btnEdit);
                act.appendChild(btnCopy);
                act.appendChild(btnOpen);
                act.appendChild(btnDel);

                $ucList.appendChild(row);
            });

        }catch(err){
            $ucEmpty.style.display="";
            $ucEmpty.textContent=err.message||"加载失败。";
        }
    }

    if($ucRefreshBtn)$ucRefreshBtn.addEventListener("click",loadUserPastes);
    if($ucLogoutBtn)$ucLogoutBtn.addEventListener("click",async ()=>{
        try{
            await fetch(AUTH_BASE+"/logout",{method:"POST",credentials:"include"});

        setLoggedOut();

    async function enterEditMode(slug){
        state.mode="edit";
        state.originalSlug=slug;
        if($submitBtn){
            const span=$submitBtn.querySelector(".text");
            if(span)span.textContent="更新";
        }
        if($btnHome)$btnHome.style.display="inline-flex";
        setStatus("正在载入内容…");
        try{
            const url=new URL(`${API_BASE}/${encodeURIComponent(slug)}`);
            url.searchParams.set("manage","1");
            const res=await fetch(url.toString(),{credentials:"include"});
            const data=await res.json().catch(()=>({}));
            if(!res.ok||data.ok===false){
                throw new Error(data.error||"内容不存在。");
            }
            if($content)$content.value=data.content||"";
            if($remark)$remark.value=data.remark||"";
            if($customId){
                $customId.value=data.slug||slug;
                $customId.readOnly=false;
            }
            updateByteCount();
            if(data.ttlKey)setTtl(data.ttlKey);
            const urlClean=new URL(location.href);
            urlClean.searchParams.set("id",slug);
            history.replaceState(null,"",urlClean.toString());
            setStatus("已进入编辑模式。","success");
        }catch(err){
            setStatus(err.message||"载入失败。","error");
            enterCreateMode(false);
        }
    }

    function showResultLink(slug){
        if(!$resultBox||!$viewLinkText)return;
        const url=`${VIEW_BASE}/${encodeURIComponent(slug)}`;
        $viewLinkText.textContent=url;
        $resultBox.style.display="block";
        if($btnManageFromResult){
            $btnManageFromResult.style.display = state.loggedIn ? "inline-flex" : "none";
        }
    }

    if($btnCopyView){
        $btnCopyView.addEventListener("click",async ()=>{
            const text=$viewLinkText&&$viewLinkText.textContent;
            if(!text)return;
            try{
                await navigator.clipboard.writeText(text);
                setStatus("已复制访问链接。","success");
            }catch(_){
                window.prompt("复制失败，请手动复制：",text);
            }
        });
    }
    if($btnOpenView){
        $btnOpenView.addEventListener("click",()=>{
            const text=$viewLinkText&&$viewLinkText.textContent;
            if(!text)return;
            window.open(text,"_blank","noopener");
        });
    }
    if($btnManageFromResult){
        $btnManageFromResult.addEventListener("click",()=>{
            openUserCenter();
        });
    }

    if($btnResetContent){
        $btnResetContent.addEventListener("click",()=>{
            if($content)$content.value="";
            updateByteCount();
            setStatus("内容已清空。","success");
        });
    }

    if($form){
        $form.addEventListener("submit",async e=>{
            e.preventDefault();
            if(state.isSubmitting)return;
            if(!$content){
                setStatus("页面初始化异常，缺少内容区域。","error");
                return;
            }
            const text=$content.value||"";
            if(!text.trim()){
                setStatus("内容不能为空。","error");
                return;
            }

            validateCustomSlug();
            if(state.customSlugError){
                setStatus("自定义 URL 不符合规则。","error");
                return;
            }

            const ttlKey=state.ttlKey||"7d";
            const payload={
                content:text,
                ttl:ttlKey,
                remark:$remark?$remark.value.trim():"",
                customId:$customId?$customId.value.trim():""
            };
            if(state.mode==="edit" && state.originalSlug){
                payload.slug=state.originalSlug;
            }

            state.isSubmitting=true;
            setStatus(state.mode==="edit"?"正在更新…":"正在创建…");
            if($submitBtn)$submitBtn.disabled=true;
            try{
                const data=await postJSON(API_BASE,payload);
                const slug=data.slug;
                state.mode="edit";
                state.originalSlug=slug;
                showResultLink(slug);
                setStatus(state.mode==="edit"?"已更新。":"已创建。","success");
                if($btnHome)$btnHome.style.display="inline-flex";
                if($customId && !payload.customId){
                    $customId.value=slug;
                }
                updateNodeDetect();
            }catch(err){
                setStatus(err.message||"提交失败。","error");
            }finally{
                state.isSubmitting=false;
                if($submitBtn)$submitBtn.disabled=false;
            }
        });
    }

    (async function initFromQuery(){
        const url=new URL(location.href);
        const id=url.searchParams.get("id");
        if(id){
            try{
                await enterEditMode(id);
            }catch(_){}
        }
    })();

    initAuthFromServer();
</script>
