<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <!-- ↓↓↓ 修改下面四个内容 ↓↓↓ -->
  <meta property="og:title" content="这里填写卡片标题，例如：Lyn 的个人主页">
  <meta property="og:description" content="这里填写卡片描述，例如：一个喜欢折腾的灵魂">
  <meta property="og:image" content="https://你的预览图地址.jpg">
  <meta property="og:url" content="https://你的跳转中间页链接.html">

  <!-- 微信特用标签 -->
  <meta name="description" content="这里填写卡片描述">
  <meta itemprop="image" content="https://你的预览图地址.jpg">

  <title>正在跳转...</title>

  <script>
    // 设置跳转目标链接
    const target = "https://你要跳转的真实目标链接.com";

    // 微信会抓取本页面的 meta，不会被 JS 影响
    // 仅用于用户打开后的跳转
    setTimeout(() => {
      window.location.href = target;
    }, 200);
  </script>

  <style>
    body {
      font-family: -apple-system, sans-serif;
      text-align: center;
      margin-top: 100px;
    }
  </style>
</head>
<body>
  <h2>正在跳转，请稍候…</h2>
  <p>如果没有跳转，<a href="https://你要跳转的真实目标链接.com">点击这里</a></p>
</body>
</html>
