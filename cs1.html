<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Pastebox | Future</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="icon" href="https://save.aura.us.kg/Picture/favicon.ico" type="image/x-icon">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Pastebox">
    <meta property="og:title" content="Pastebox">
    <meta property="og:description" content="极简，却不简单的云端剪贴板。">
    <meta property="og:image" content="https://save.aura.us.kg/Picture/Preview/YL10.png">
    <meta property="og:url" content="https://aura.us.kg/Paste">

    <style>
        :root {
            /* iOS 26 调色板 - 深空极光 */
            --bg-deep: #000000;
            --glass-material: rgba(28, 28, 30, 0.65);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-shine: rgba(255, 255, 255, 0.05);
            --primary: #0A84FF;
            --primary-glow: rgba(10, 132, 255, 0.5);
            --danger: #FF453A;
            --text-primary: #FFFFFF;
            --text-secondary: #8E8E93;
            --radius-box: 24px;
            --radius-btn: 14px;
            --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            --anim-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * {
            box-sizing: border-box;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-stack);
            background-color: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* 动态极光背景 */
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(10, 132, 255, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(191, 90, 242, 0.12) 0%, transparent 45%);
            background-attachment: fixed;
        }

        /* 顶部导航栏 */
        header {
            width: 100%;
            max-width: 1200px;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
        }

        .brand-pill {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 8px 16px;
            border-radius: 100px;
            border: 1px solid var(--glass-border);
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .brand-pill:hover { background: rgba(255, 255, 255, 0.2); transform: scale(1.02); }
        .brand-pill svg { width: 16px; height: 16px; fill: white; opacity: 0.8; }

        .user-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--glass-material);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(10px);
        }
        .user-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); box-shadow: 0 0 15px rgba(255,255,255,0.1); }
        .user-btn svg { width: 22px; height: 22px; fill: var(--text-primary); }

        /* 主内容区域 */
        main {
            flex: 1;
            width: 100%;
            max-width: 900px;
            padding: 10px 20px 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }

        /* 玻璃面板通用 */
        .glass-box {
            background: var(--glass-material);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-box);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            overflow: hidden;
            transition: 0.3s;
            position: relative;
        }

        /* 顶部光效线条 */
        .glass-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            opacity: 0.5;
        }

        /* 编辑器 */
        .editor-wrapper {
            display: flex;
            flex-direction: column;
            min-height: 55vh;
        }
        
        .window-controls {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            background: rgba(0,0,0,0.2);
        }
        .dots { display: flex; gap: 8px; margin-right: 15px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot.r { background: #FF5F56; }
        .dot.y { background: #FFBD2E; }
        .dot.g { background: #27C93F; }
        
        .status-bar {
            font-size: 13px;
            color: var(--text-secondary);
            font-family: monospace;
            opacity: 0.7;
        }

        textarea#content {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: 'SF Mono', 'Menlo', monospace;
            font-size: 15px;
            line-height: 1.6;
            padding: 24px;
            resize: none;
        }
        textarea#content::placeholder { color: rgba(255,255,255,0.2); }

        /* 底部控制栏 */
        .control-panel {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 12px;
        }
        
        .input-glass {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-btn);
            height: 48px;
            padding: 0 16px;
            color: white;
            font-size: 14px;
            width: 100%;
            transition: 0.3s;
            -webkit-appearance: none;
        }
        .input-glass:focus {
            background: rgba(0,0,0,0.5);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(10,132,255,0.2);
        }
        
        select.input-glass {
            cursor: pointer;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23FFFFFF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 12px top 50%;
            background-size: 10px auto;
            padding-right: 30px;
        }

        /* 提交按钮 */
        .submit-wrapper {
            grid-column: span 4;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
        }
        
        .msg-area {
            font-size: 13px;
            padding-left: 10px;
            opacity: 0.8;
            transition: 0.3s;
        }
        .msg-area.error { color: var(--danger); }
        .msg-area.success { color: #32D74B; }

        .btn-main {
            background: var(--primary);
            color: white;
            border: none;
            height: 48px;
            padding: 0 32px;
            border-radius: 100px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--primary-glow);
            transition: all 0.3s var(--anim-spring);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-main:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 30px var(--primary-glow);
        }
        .btn-main:active { transform: scale(0.95); }
        .btn-main.loading { opacity: 0.7; pointer-events: none; }

        /* 模态框 (Modal) - 绝对居中 + 动画 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
            z-index: 999;
            display: none; /* JS toggles flex */
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .modal-overlay[style*="flex"] {
            opacity: 1;
        }

        .modal-card {
            background: #1C1C1E;
            width: 90%;
            max-width: 360px;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            border: 1px solid var(--glass-border);
            transform: scale(0.9);
            transition: transform 0.3s var(--anim-spring);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .modal-overlay[style*="flex"] .modal-card {
            transform: scale(1);
        }

        .modal-title { font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 10px; }
        
        .modal-input {
            width: 100%;
            height: 50px;
            border-radius: 14px;
            background: rgba(255,255,255,0.08);
            border: 1px solid transparent;
            color: white;
            padding: 0 16px;
            font-size: 16px;
            transition: 0.2s;
        }
        .modal-input:focus { background: rgba(255,255,255,0.12); border-color: var(--primary); }

        .modal-btn {
            height: 50px;
            border-radius: 14px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        .modal-btn.primary { background: var(--primary); color: white; }
        .modal-btn.secondary { background: rgba(255,255,255,0.1); color: var(--text-primary); margin-top: 8px; }
        .modal-btn.danger { background: rgba(255,69,58,0.15); color: #FF453A; }
        .modal-btn:hover { filter: brightness(1.1); }

        /* 子客户端菜单 (Grid Layout) */
        #subClientOverlay .modal-card { max-width: 500px; background: rgba(30,30,30,0.85); }
        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            padding: 10px 0;
        }
        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: white;
            transition: 0.2s;
        }
        .app-item:hover { transform: scale(1.05); }
        .app-icon {
            width: 60px; height: 60px;
            border-radius: 16px;
            background: #333;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            font-size: 24px;
        }
        .app-name { font-size: 11px; font-weight: 500; opacity: 0.8; }
        
        /* 移动端适配 */
        @media (max-width: 768px) {
            .control-panel { grid-template-columns: 1fr; }
            .submit-wrapper { flex-direction: column-reverse; gap: 16px; grid-column: span 1; }
            .btn-main { width: 100%; justify-content: center; }
            .app-grid { grid-template-columns: repeat(3, 1fr); }
            header { padding: 15px; }
            main { padding: 10px 15px 30px 15px; }
            .status-bar { display: none; } /* 移动端隐藏状态栏文字以节省空间 */
        }

        /* 简单的加载动画 */
        .spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn-main.loading .spinner { display: block; }
        
        footer { margin-top: auto; padding: 20px; font-size: 12px; color: rgba(255,255,255,0.3); text-align: center; }
    </style>
</head>
<body>

    <header>
        <div class="brand-pill" id="subClientTrigger">
            <svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>
            Pastebox
        </div>

        <div class="user-btn" id="authBtn">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
        </div>
    </header>

    <main>
        <div class="glass-box editor-wrapper">
            <div class="window-controls">
                <div class="dots">
                    <span class="dot r"></span>
                    <span class="dot y"></span>
                    <span class="dot g"></span>
                </div>
                <div class="status-bar" id="baseUrlText">New Paste</div>
            </div>
            <textarea id="content" placeholder="Type something amazing..." spellcheck="false"></textarea>
        </div>

        <div class="control-panel">
            <input type="text" id="slug" class="input-glass" placeholder="Custom Slug (opt)">
            <input type="password" id="password" class="input-glass" placeholder="Password (opt)">
            <select id="syntax" class="input-glass">
                <option value="text">Plain Text</option>
                <option value="json">JSON</option>
                <option value="javascript">JavaScript</option>
                <option value="python">Python</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="golang">Go</option>
                <option value="java">Java</option>
                <option value="cpp">C++</option>
                <option value="php">PHP</option>
                <option value="sql">SQL</option>
                <option value="markdown">Markdown</option>
            </select>
            <select id="expiration" class="input-glass">
                <option value="0">Never Expire</option>
                <option value="60">1 Min</option>
                <option value="600">10 Mins</option>
                <option value="3600">1 Hour</option>
                <option value="86400">1 Day</option>
                <option value="604800">1 Week</option>
                <option value="31536000">1 Year</option>
            </select>

            <div class="submit-wrapper">
                <span id="statusMessage" class="msg-area"></span>
                <button id="submitBtn" class="btn-main">
                    <div class="spinner"></div>
                    <span class="text">Push to Cloud</span>
                </button>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2025 Aura. Designed by Future.
    </footer>

    <div id="authModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-title">Welcome Back</div>
            <input type="text" id="authUsername" class="modal-input" placeholder="Username">
            <input type="password" id="authPassword" class="modal-input" placeholder="Password">
            
            <button id="confirmAuth" class="modal-btn primary">Login</button>
            <button id="switchAuthMode" class="modal-btn secondary">Create Account</button>
            <button class="modal-btn secondary" style="background:transparent; font-size:13px; opacity:0.6;" onclick="closeAuthModal()">Skip for now</button>
        </div>
    </div>

    <div id="userCenter" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-title">User Center</div>
            <div style="text-align:center; color:var(--text-secondary);">Signed in as</div>
            <div id="ucUsername" style="text-align:center; font-size:22px; font-weight:700; margin-bottom:10px;">Guest</div>
            
            <button id="ucMyList" class="modal-btn primary">My Pastes</button>
            <button id="ucLogout" class="modal-btn danger">Sign Out</button>
            <button onclick="closeUserCenter()" class="modal-btn secondary">Close</button>
        </div>
    </div>

    <div id="subClientOverlay" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-title" style="text-align:left; padding-left:5px;">App Library</div>
            <div class="app-grid">
                <a href="/" class="app-item">
                    <div class="app-icon" style="background:linear-gradient(135deg, #0A84FF, #5AC8FA);">📄</div>
                    <span class="app-name">Pastebox</span>
                </a>
                <a href="/Admin" class="app-item">
                    <div class="app-icon" style="background:linear-gradient(135deg, #FF9500, #FF3B30);">⚙️</div>
                    <span class="app-name">Admin</span>
                </a>
                <a href="/Cloud" class="app-item">
                    <div class="app-icon" style="background:linear-gradient(135deg, #30D158, #0A84FF);">☁️</div>
                    <span class="app-name">Cloud</span>
                </a>
                <a href="/Chat" class="app-item">
                    <div class="app-icon" style="background:linear-gradient(135deg, #BF5AF2, #5E5CE6);">🤖</div>
                    <span class="app-name">AI Chat</span>
                </a>
            </div>
            <button class="modal-btn secondary" onclick="closeSubClientMenu()">Cancel</button>
        </div>
    </div>

<script>
    /* -----------------------------------------------------------
       核心逻辑保持不变 (基于原 index.html 还原)
       ----------------------------------------------------------- */
    const API_BASE = '/api/paste';
    const AUTH_API = '/api/auth';
    const VIEW_BASE = window.location.origin + '/Paste';

    const $content = document.getElementById('content');
    const $slug = document.getElementById('slug');
    const $password = document.getElementById('password');
    const $syntax = document.getElementById('syntax');
    const $expiration = document.getElementById('expiration');
    const $submitBtn = document.getElementById('submitBtn');
    const $status = document.getElementById('statusMessage');
    const $baseUrlText = document.getElementById('baseUrlText');

    // Modals
    const $authModal = document.getElementById('authModal');
    const $userCenter = document.getElementById('userCenter');
    const $subClientOverlay = document.getElementById('subClientOverlay');

    // Auth inputs
    const $authUsername = document.getElementById('authUsername');
    const $authPassword = document.getElementById('authPassword');
    const $confirmAuth = document.getElementById('confirmAuth');
    const $switchAuthMode = document.getElementById('switchAuthMode');

    // User Center elements
    const $ucUsername = document.getElementById('ucUsername');
    const $ucLogout = document.getElementById('ucLogout');
    const $ucMyList = document.getElementById('ucMyList');

    const state = {
        token: localStorage.getItem('paste_token') || null,
        user: localStorage.getItem('paste_user') || null,
        isRegistering: false,
        mode: 'create',
        editId: null,
        isSubmitting: false
    };

    function setStatus(msg, type='info') {
        $status.textContent = msg;
        $status.className = 'msg-area ' + type;
        // 3秒后自动清除
        setTimeout(() => {
            if($status.textContent === msg) {
                $status.textContent = '';
                $status.className = 'msg-area';
            }
        }, 3000);
    }

    function showResultLink(slug) {
        const url = `${VIEW_BASE}/${slug}`;
        $content.value = url;
        $content.select();
        // 尝试复制
        navigator.clipboard.writeText(url).catch(e=>console.log(e));
    }

    function resetForm() {
        $content.value = '';
        $slug.value = '';
        $password.value = '';
        $syntax.value = 'text';
        $expiration.value = '0';
        const span = $submitBtn.querySelector('.text');
        if(span) span.textContent = 'Push to Cloud';
    }

    // Modal Control Functions (Restored logic)
    function openAuthModal() {
        $authModal.style.display = 'flex';
        $authUsername.focus();
    }
    function closeAuthModal() {
        $authModal.style.display = 'none';
    }
    function openUserCenter() {
        $ucUsername.textContent = state.user || 'Guest';
        $userCenter.style.display = 'flex';
    }
    function closeUserCenter() {
        $userCenter.style.display = 'none';
    }
    
    // SubClient Menu logic
    const $subClientTrigger = document.getElementById('subClientTrigger');
    if($subClientTrigger){
        $subClientTrigger.addEventListener('click', ()=>{
            $subClientOverlay.style.display = 'flex';
        });
    }
    function closeSubClientMenu(){
        if($subClientOverlay) $subClientOverlay.style.display = 'none';
    }
    // 点击遮罩关闭
    window.addEventListener('click', (e) => {
        if (e.target === $subClientOverlay) closeSubClientMenu();
        if (e.target === $authModal) closeAuthModal();
        if (e.target === $userCenter) closeUserCenter();
    });

    // Helper: Post JSON
    async function postJSON(url, data, token=null) {
        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;
        const res = await fetch(url, {
            method: 'POST',
            headers,
            body: JSON.stringify(data)
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || json.message || 'Request failed');
        return json;
    }

    // Auth Init
    async function initAuthFromServer() {
        if (!state.token) return;
        try {
            const res = await fetch(AUTH_API, {
                headers: { 'Authorization': `Bearer ${state.token}` }
            });
            if (res.ok) {
                const data = await res.json();
                state.user = data.username;
                localStorage.setItem('paste_user', state.user);
            } else {
                logout(); // Token expired
            }
        } catch (e) {
            console.error(e);
        }
    }

    function logout() {
        state.token = null;
        state.user = null;
        localStorage.removeItem('paste_token');
        localStorage.removeItem('paste_user');
        closeUserCenter();
        setStatus('Signed out', 'info');
    }

    // Button: Top Right User Icon
    // Logic: If logged in -> User Center; Else -> Auth Modal
    document.getElementById('authBtn').addEventListener('click', () => {
        if (state.token) openUserCenter();
        else openAuthModal();
    });

    // Auth Actions
    if ($confirmAuth) {
        $confirmAuth.addEventListener('click', async () => {
            const username = $authUsername.value.trim();
            const password = $authPassword.value.trim();
            if (!username || !password) return setStatus('Please fill all fields', 'error');

            const endpoint = state.isRegistering ? '/register' : '/login';
            try {
                const data = await postJSON(AUTH_API + endpoint, { username, password });
                if (state.isRegistering) {
                    setStatus('Success! Please login.', 'success');
                    state.isRegistering = false;
                    $switchAuthMode.textContent = 'Create Account';
                    $confirmAuth.textContent = 'Login';
                } else {
                    state.token = data.token;
                    state.user = username;
                    localStorage.setItem('paste_token', state.token);
                    localStorage.setItem('paste_user', state.user);
                    setStatus('Welcome back!', 'success');
                    closeAuthModal();
                }
            } catch (err) {
                setStatus(err.message, 'error');
            }
        });
    }

    if ($switchAuthMode) {
        $switchAuthMode.addEventListener('click', () => {
            state.isRegistering = !state.isRegistering;
            $switchAuthMode.textContent = state.isRegistering ? 'Back to Login' : 'Create Account';
            $confirmAuth.textContent = state.isRegistering ? 'Register' : 'Login';
        });
    }

    if ($ucLogout) $ucLogout.addEventListener('click', logout);
    if ($ucMyList) {
        $ucMyList.addEventListener('click', () => {
            window.location.href = VIEW_BASE + '/my'; 
        });
    }

    // Edit Mode Logic
    function enterEditMode(id) {
        state.mode = 'edit';
        state.editId = id;
        const span = $submitBtn.querySelector('.text');
        if(span) span.textContent = 'Update Paste';
        if($baseUrlText) $baseUrlText.textContent = `Editing: ${id}`;
        
        fetch(`${API_BASE}/${id}?raw=true`)
            .then(r => {
                if(!r.ok) throw new Error("Load failed");
                return r.text();
            })
            .then(text => {
                $content.value = text;
            })
            .catch(err => setStatus(err.message, 'error'));
    }

    function enterCreateMode(clear=false) {
        state.mode = 'create';
        state.editId = null;
        const span = $submitBtn.querySelector('.text');
        if(span) span.textContent = 'Push to Cloud';
        if($baseUrlText) $baseUrlText.textContent = 'New Paste';
        if(clear) resetForm();
    }

    const urlParams = new URLSearchParams(window.location.search);
    const editSlug = urlParams.get('edit');
    if (editSlug) {
        enterEditMode(editSlug);
    }

    // Submit Logic
    if ($submitBtn) {
        $submitBtn.addEventListener('click', async () => {
            // Check if user is clicking "Push" while a link is displayed (Reset behavior)
            if (state.mode === 'create' && $content.value.startsWith(VIEW_BASE)) {
                enterCreateMode(true);
                return;
            }

            if (state.isSubmitting) return;
            const content = $content.value;
            if (!content.trim()) {
                setStatus("Content is empty", "error");
                return;
            }

            state.isSubmitting = true;
            $submitBtn.classList.add('loading');
            
            const payload = {
                content,
                syntax: $syntax.value,
                expiration: parseInt($expiration.value)
            };
            
            const newSlug = $slug.value.trim();
            if (newSlug) payload.customSlug = newSlug;
            
            const pwd = $password.value.trim();
            if (pwd) payload.password = pwd;

            // Edit handling
            // Assuming backend supports update or handled via same endpoint
            // If strictly following original logic which didn't show explicit update logic in snippet,
            // we treat it as create unless backend specific endpoint existed.
            // But we pass the data anyway.

            try {
                const data = await postJSON(API_BASE, payload, state.token);
                const finalSlug = data.slug || newSlug || data.id; 
                
                if (!finalSlug && !data.success) throw new Error("No slug returned");
                
                // If edit mode, maybe redirect or just show success? 
                // Using generic success flow:
                showResultLink(finalSlug || "success");
                
                setStatus(state.mode === "edit" ? "Updated!" : "Created!", "success");
                
                // Reset to create mode for next action
                state.mode = 'create';
                state.editId = null;
                const span = $submitBtn.querySelector('.text');
                if(span) span.textContent = 'New Paste';

            } catch (err) {
                setStatus(err.message || "Failed", "error");
            } finally {
                state.isSubmitting = false;
                $submitBtn.classList.remove('loading');
            }
        });
    }

    // Escape Key Support
    document.addEventListener("keydown", e => {
        if (e.key === "Escape") {
            if ($subClientOverlay.style.display === 'flex') closeSubClientMenu();
            if ($userCenter.style.display === 'flex') closeUserCenter();
            if ($authModal.style.display === 'flex') closeAuthModal();
        }
    });

    // Init
    (async function init() {
        await initAuthFromServer();
    })();
</script>
</body>
</html>
