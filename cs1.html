<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Pastebox Pro - 创新版</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://save.aura.us.kg/Picture/favicon.ico" type="image/x-icon">
    <meta property="og:title" content="Pastebox">
    <meta property="og:image" content="https://save.aura.us.kg/Picture/Preview/YL10.png">

    <style>
        /* 2. 样式重构：现代极简风格 */
        :root {
            --bg-body: #f1f3f6;
            --sidebar-w: 280px;
            --accent: #007aff;
            --accent-glow: rgba(0, 122, 255, 0.15);
            --panel-bg: rgba(255, 255, 255, 0.85);
            --text-main: #1d1d1f;
            --text-sub: #86868b;
            --border: rgba(0,0,0,0.08);
            --radius: 18px;
            --glass: blur(25px) saturate(180%);
        }

        .theme-dark {
            --bg-body: #000000;
            --panel-bg: rgba(28, 28, 30, 0.85);
            --text-main: #f5f5f7;
            --border: rgba(255,255,255,0.1);
        }

        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: var(--bg-body); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }

        /* 布局：左侧导航 */
        .sidebar { width: var(--sidebar-w); background: var(--panel-bg); backdrop-filter: var(--glass); border-right: 1px solid var(--border); padding: 40px 24px; display: flex; flex-direction: column; z-index: 50; }
        .brand { display: flex; align-items: center; gap: 15px; margin-bottom: 45px; }
        .brand img { width: 48px; height: 48px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
        .brand h1 { font-size: 22px; font-weight: 800; margin: 0; letter-spacing: -0.5px; }

        /* 功能菜单按钮 */
        .nav-link { 
            display: flex; align-items: center; gap: 12px; padding: 14px 18px; 
            background: transparent; border: none; border-radius: 14px; 
            color: var(--text-sub); font-size: 15px; font-weight: 500; cursor: pointer; width: 100%; text-align: left;
        }
        .nav-link:hover, .nav-link.active { background: var(--accent-glow); color: var(--accent); }
        .nav-link svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }

        /* 右侧内容区 */
        .main-content { flex: 1; display: flex; flex-direction: column; padding: 40px; position: relative; overflow-y: auto; }
        
        /* 编辑器卡片 */
        .editor-wrap { 
            flex: 1; background: var(--panel-bg); border-radius: var(--radius); border: 1px solid var(--border);
            display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.05); overflow: hidden;
        }
        .editor-header { padding: 15px 25px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-sub); }

        textarea { 
            flex: 1; border: none; outline: none; padding: 30px; background: transparent; 
            color: var(--text-main); font-family: "JetBrains Mono", Menlo, monospace; font-size: 15px; line-height: 1.65; resize: none;
        }

        /* 配置抽屉 */
        .config-panel { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; 
            padding: 25px; background: rgba(0,0,0,0.02); border-top: 1px solid var(--border); 
        }
        .group { display: flex; flex-direction: column; gap: 8px; }
        .group label { font-size: 11px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; }
        .control { 
            background: var(--bg-body); border: 1px solid var(--border); padding: 10px 14px; 
            border-radius: 10px; color: var(--text-main); font-size: 14px; outline: none;
        }
        .control:focus { border-color: var(--accent); }

        /* 发布按钮 */
        .fab-submit { 
            position: fixed; bottom: 50px; right: 50px; padding: 18px 45px; 
            border-radius: 40px; background: var(--accent); color: white; border: none; 
            font-size: 17px; font-weight: 700; cursor: pointer; 
            box-shadow: 0 15px 35px rgba(0, 122, 255, 0.3); display: flex; align-items: center; gap: 10px;
        }
        .fab-submit:hover { transform: translateY(-3px) scale(1.02); }
        .fab-submit:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }

        /* 模态框重设计 */
        .overlay { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.3); backdrop-filter: blur(15px); 
            display: none; align-items: center; justify-content: center; z-index: 1000; 
        }
        .modal-card { 
            width: 90%; max-width: 480px; background: var(--panel-bg); 
            border-radius: 30px; padding: 35px; box-shadow: 0 40px 100px rgba(0,0,0,0.25); border: 1px solid var(--border);
        }

        /* 成功反馈区 */
        #resultContainer { display: none; margin-top: 25px; padding: 25px; border-radius: 20px; border: 2px solid #34c759; background: rgba(52, 199, 89, 0.05); }

        @media (max-width: 800px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); padding: 15px 25px; }
            .nav-link span { display: none; }
            .main-content { padding: 15px; }
            .fab-submit { bottom: 20px; right: 20px; padding: 12px 30px; }
        }
    </style>
</head>
<body class="theme-light">

    <aside class="sidebar">
        <div class="brand">
            <img id="brandIcon" src="https://save.aura.us.kg/Picture/Preview/YL10.png" alt="logo">
            <h1>Pastebox</h1>
        </div>
        
        <nav style="flex:1">
            <button class="nav-link active" onclick="location.reload()">
                <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                <span>新建文本</span>
            </button>
            <button class="nav-link" id="userCenterBtn">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span id="authStatusText">登录 / 我的记录</span>
            </button>
            <button class="nav-link" id="themeSwitcher">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M17.66 6.34l1.42-1.42"/></svg>
                <span>外观切换</span>
            </button>
        </nav>

        <div id="apiStatus" style="font-size: 11px; color: var(--text-sub);">
            API 响应状态: <span id="pingStatus">...</span>
        </div>
    </aside>

    <main class="main-content">
        <div class="editor-wrap">
            <div class="editor-header">
                <div id="nodeStatus" style="display:none; background: #34c759; color: white; padding: 2px 10px; border-radius: 10px; font-weight: 700;">检测到节点</div>
                <div id="statsInfo">0 Bytes | 0 Lines</div>
            </div>

            <textarea id="mainContent" placeholder="在此输入你的内容...支持 Base64 自动识别和多格式节点检测"></textarea>

            <div class="config-panel" id="advanceSettings">
                <div class="group">
                    <label>自定义路径 (Slug)</label>
                    <input type="text" id="slugInput" class="control" placeholder="随机分配">
                </div>
                <div class="group">
                    <label>备注 (Remark)</label>
                    <input type="text" id="remarkInput" class="control" placeholder="仅登录可见">
                </div>
                <div class="group">
                    <label>有效期 (TTL)</label>
                    <select id="ttlSelect" class="control">
                        <option value="1h">1 小时</option>
                        <option value="1d">1 天</option>
                        <option value="7d" selected>7 天</option>
                        <option value="30d">30 天</option>
                        <option value="forever">永不过期</option>
                    </select>
                </div>
            </div>
        </div>

        <button class="fab-submit" id="mainSubmitBtn">
            <svg style="width:24px;height:24px;fill:white;" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            <span class="text">发布内容</span>
        </button>

        <div id="resultContainer">
            <h3 style="margin-top:0; color:#34c759">✓ 发布成功</h3>
            <div id="viewUrlBox" style="font-family: monospace; background:var(--bg-body); padding:15px; border-radius:12px; margin-bottom:15px; word-break:break-all;"></div>
            <div style="display:flex; gap:12px;">
                <button class="control" style="background:var(--accent); color:white; border:none;" id="copyLinkBtn">复制主链接</button>
                <button class="control" id="openSubMenuBtn">订阅转换 (Sub Menu)</button>
            </div>
        </div>
    </main>

    <div class="overlay" id="globalModal">
        <div class="modal-card">
            <h2 id="modalTitle" style="margin-top:0">提示</h2>
            <div id="modalBody"></div>
            <button class="nav-link" style="margin-top:25px; background:var(--bg-body); justify-content:center" onclick="closeModal()">关闭</button>
        </div>
    </div>

    <script>
        // --- 完整保留原文件的全局常量 ---
        const API_BASE = window.location.origin + "/api/paste";
        const VIEW_BASE = window.location.origin + "/api/paste";
        const AUTH_BASE = window.location.origin + "/api/auth";

        let state = {
            mode: "create",
            user: null,
            isSubmitting: false,
            currentSlug: ""
        };

        // --- 完整保留原文件的节点检测算法 ---
        const protocols = ['ss://','ssr://','vmess://','vless://','trojan://','hysteria','tuic://'];
        function analyzeContent(text) {
            let nodeCount = 0;
            const lines = text.split('\n');
            lines.forEach(l => {
                if(protocols.some(p => l.trim().startsWith(p))) nodeCount++;
            });
            return {
                bytes: new TextEncoder().encode(text).length,
                lines: lines.length,
                nodes: nodeCount
            };
        }

        const $textarea = document.getElementById('mainContent');
        $textarea.addEventListener('input', () => {
            const stats = analyzeContent($textarea.value);
            document.getElementById('statsInfo').innerText = `${stats.bytes} Bytes | ${stats.lines} Lines`;
            document.getElementById('nodeStatus').style.display = stats.nodes > 0 ? 'block' : 'none';
        });

        // --- 1:1 移植原文件的 API 交互逻辑 ---
        async function postData(url, data) {
            const res = await fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            if(!res.ok) throw new Error("服务器响应异常");
            return await res.json();
        }

        document.getElementById('mainSubmitBtn').addEventListener('click', async () => {
            if(state.isSubmitting) return;
            const content = $textarea.value.trim();
            if(!content) return alert("内容不能为空");

            state.isSubmitting = true;
            const $btn = document.getElementById('mainSubmitBtn');
            $btn.disabled = true;
            $btn.querySelector('.text').innerText = "正在发布...";

            const payload = {
                action: "create",
                content: content,
                slug: document.getElementById('slugInput').value,
                ttlKey: document.getElementById('ttlSelect').value,
                remark: document.getElementById('remarkInput').value
            };

            try {
                const data = await postData(API_BASE, payload);
                if(data.ok) {
                    state.currentSlug = data.slug;
                    document.getElementById('viewUrlBox').innerText = VIEW_BASE + "/" + data.slug;
                    document.getElementById('resultContainer').style.display = 'block';
                    window.scrollTo({top: document.body.scrollHeight, behavior:'smooth'});
                }
            } catch(e) {
                alert("发布失败: " + e.message);
            } finally {
                state.isSubmitting = false;
                $btn.disabled = false;
                $btn.querySelector('.text').innerText = "发布内容";
            }
        });

        // --- 订阅转换菜单 (逻辑完全复刻原文件 subClientOverlay) ---
        document.getElementById('openSubMenuBtn').addEventListener('click', () => {
            const clients = ['clash', 'surge', 'v2ray', 'singbox', 'quantumultx'];
            let html = `<p style="font-size:13px; color:var(--text-sub); margin-bottom:20px;">选择客户端格式，系统将自动进行内容转换：</p><div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">`;
            clients.forEach(c => {
                html += `<button class="control" style="text-transform:capitalize" onclick="copySubUrl('${c}')">${c}</button>`;
            });
            html += `</div>`;
            openModal("订阅转换服务", html);
        });

        window.copySubUrl = (client) => {
            const url = `${window.location.origin}/autosub?id=${state.currentSlug}&client=${client}`;
            navigator.clipboard.writeText(url);
            alert("已成功复制 " + client + " 格式订阅链接");
        };

        // --- 用户中心与登录 (复刻原文件 UserCenter 逻辑) ---
        document.getElementById('userCenterBtn').addEventListener('click', () => {
            if(!state.user) {
                const html = `
                    <div style="display:flex; flex-direction:column; gap:15px;">
                        <input type="text" id="uName" class="control" placeholder="用户名">
                        <input type="password" id="uPass" class="control" placeholder="密码">
                        <button class="fab-submit" style="position:static; width:100%; height:50px;" onclick="handleLogin()">确认登录</button>
                    </div>
                `;
                openModal("身份验证", html);
            } else {
                renderHistory();
            }
        });

        async function handleLogin() {
            const u = document.getElementById('uName').value;
            const p = document.getElementById('uPass').value;
            // 调用原文件 /api/auth/login
            const res = await fetch(AUTH_BASE + "/login", { method:'POST', body:JSON.stringify({username:u, password:p}) });
            if(res.ok) {
                state.user = u;
                document.getElementById('authStatusText').innerText = u;
                closeModal();
                alert("登录成功");
            }
        }

        async function renderHistory() {
            openModal("我的记录", "加载中...");
            const res = await fetch("/api/me/pastes");
            const data = await res.json();
            if(data.items) {
                const list = data.items.map(i => `<div style="padding:12px; border-bottom:1px solid var(--border); font-size:13px; display:flex; justify-content:space-between;"><span>${i.slug}</span><a href="${VIEW_BASE}/${i.slug}" target="_blank" style="color:var(--accent)">查看</a></div>`).join('');
                document.getElementById('modalBody').innerHTML = `<div style="max-height:300px; overflow-y:auto;">${list || '暂无数据'}</div>`;
            }
        }

        // --- 辅助 UI 函数 ---
        function openModal(title, body) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerHTML = body;
            document.getElementById('globalModal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('globalModal').style.display = 'none'; }
        
        document.getElementById('themeSwitcher').onclick = () => {
            const isDark = document.body.classList.toggle('theme-dark');
            localStorage.setItem('pb-theme', isDark ? 'dark' : 'light');
        };
        if(localStorage.getItem('pb-theme') === 'dark') document.body.classList.add('theme-dark');

        // 初始化鉴权状态
        (async function init() {
            try {
                const res = await fetch("/api/me/pastes");
                if(res.ok) {
                    state.user = "已登录用户";
                    document.getElementById('authStatusText').innerText = "管理记录";
                }
                document.getElementById('pingStatus').innerText = "Connected";
            } catch(e) {
                document.getElementById('pingStatus').innerText = "Offline";
            }
        })();
    </script>
</body>
</html>
