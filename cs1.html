<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Pastebox | Future</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="icon" href="https://save.aura.us.kg/Picture/favicon.ico" type="image/x-icon">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Pastebox">
    <meta property="og:title" content="Pastebox">
    <meta property="og:description" content="极简，却不简单的云端剪贴板。">
    <meta property="og:image" content="https://save.aura.us.kg/Picture/Preview/YL10.png">
    <meta property="og:url" content="https://aura.us.kg/Paste">

    <style>
        :root {
            --bg-color: #000000;
            --glass-bg: rgba(20, 20, 20, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --primary: #0A84FF;
            --primary-glow: rgba(10, 132, 255, 0.4);
            --accent: #BF5AF2;
            --text-main: #FFFFFF;
            --text-sec: #86868B;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 10px;
            --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            box-sizing: border-box;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-stack);
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(10, 132, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(191, 90, 242, 0.15) 0%, transparent 40%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

        /* 顶部导航 */
        header {
            width: 100%;
            max-width: 1200px;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .brand {
            font-weight: 700;
            font-size: 22px;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #fff, #a1a1a6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            position: relative;
        }
        
        .brand::after {
            content: 'BETA';
            position: absolute;
            top: -2px;
            right: -32px;
            font-size: 9px;
            background: var(--glass-border);
            padding: 2px 6px;
            border-radius: 6px;
            color: var(--text-sec);
            -webkit-text-fill-color: var(--text-sec);
        }

        .user-trigger {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid var(--glass-border);
        }

        .user-trigger:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.05);
        }

        .user-trigger svg {
            width: 20px;
            height: 20px;
            fill: var(--text-main);
        }

        /* 主容器布局 */
        main {
            flex: 1;
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            position: relative;
            z-index: 10;
        }

        /* 玻璃卡片通用样式 */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            overflow: hidden;
            transition: var(--transition);
        }

        /* 编辑区域 */
        .editor-container {
            display: flex;
            flex-direction: column;
            min-height: 50vh;
            position: relative;
        }

        .editor-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .dot.red { background: #FF453A; }
        .dot.yellow { background: #FFD60A; }
        .dot.green { background: #32D74B; }

        .editor-title {
            margin-left: 12px;
            font-size: 13px;
            color: var(--text-sec);
            font-weight: 500;
        }

        textarea#content {
            flex: 1;
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
            font-size: 15px;
            line-height: 1.6;
            padding: 24px;
            resize: none;
        }

        textarea#content::placeholder {
            color: rgba(255,255,255,0.2);
        }

        /* 设置栏 */
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .setting-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: 4px 16px;
            display: flex;
            align-items: center;
            height: 56px;
            transition: var(--transition);
        }

        .setting-item:focus-within {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.2);
        }

        .setting-item input, .setting-item select {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 14px;
            font-family: var(--font-stack);
            -webkit-appearance: none; /* 移除默认样式 */
        }
        
        .setting-item select {
            cursor: pointer;
        }

        /* 按钮组 */
        .action-bar {
            display: flex;
            justify-content: flex-end;
            gap: 16px;
            margin-top: 10px;
            align-items: center;
        }

        .status-text {
            margin-right: auto;
            font-size: 13px;
            padding-left: 10px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .status-text.visible { opacity: 1; }
        .status-text.error { color: #FF453A; }
        .status-text.success { color: #32D74B; }

        button {
            border: none;
            cursor: pointer;
            font-family: var(--font-stack);
            font-weight: 600;
            font-size: 15px;
            padding: 0 28px;
            height: 48px;
            border-radius: 24px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.08);
            color: var(--text-main);
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.15);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 20px var(--primary-glow);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--primary-glow);
            filter: brightness(1.1);
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
        
        .btn-disabled {
            opacity: 0.6;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* 模态框 (Modal) - iOS Sheet 风格 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: #1C1C1E;
            width: 100%;
            max-width: 360px;
            border-radius: 28px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255,255,255,0.1);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            height: 48px;
            background: rgba(255,255,255,0.05);
            border: 1px solid transparent;
            border-radius: 12px;
            padding: 0 16px;
            color: white;
            font-size: 16px;
            transition: 0.2s;
        }
        .input-group input:focus {
            background: rgba(255,255,255,0.1);
            border-color: var(--primary);
        }

        .modal-footer {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .modal-footer button {
            flex: 1;
            height: 44px;
            border-radius: 14px;
            font-size: 15px;
        }

        /* 子客户端菜单 (Grid Layout) */
        #subClientOverlay .modal-content {
            max-width: 600px;
            background: rgba(30,30,30,0.8);
            backdrop-filter: blur(30px);
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 20px;
            padding: 10px;
        }

        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: transform 0.2s;
            text-decoration: none;
            color: var(--text-main);
        }
        .app-item:hover { transform: scale(1.05); }

        .app-icon {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            background: linear-gradient(135deg, #3a3a3c, #1c1c1e);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .app-icon.admin { background: linear-gradient(135deg, #FF9500, #FF3B30); }
        .app-icon.cloud { background: linear-gradient(135deg, #5AC8FA, #007AFF); }
        .app-icon.ai { background: linear-gradient(135deg, #AF52DE, #5856D6); }
        
        .app-name { font-size: 12px; font-weight: 500; opacity: 0.8; }

        /* 页脚 */
        footer {
            margin-top: auto;
            padding: 30px;
            font-size: 12px;
            color: var(--text-sec);
            text-align: center;
        }
        footer a { color: var(--text-sec); text-decoration: none; border-bottom: 1px dashed var(--text-sec); }

        /* Loader Animation */
        .spinner {
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        button.loading .spinner { display: inline-block; }

        /* Mobile Optimization */
        @media (max-width: 768px) {
            header { padding: 16px; }
            main { padding: 16px; gap: 16px; }
            .settings-grid { grid-template-columns: 1fr; }
            .action-bar { flex-direction: column-reverse; width: 100%; gap: 12px; }
            button { width: 100%; }
            .status-text { width: 100%; text-align: center; margin-bottom: 8px; }
            .editor-container { min-height: 40vh; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand" id="subClientTrigger">Pastebox</div>
        <div class="user-trigger" id="userIconBtn">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
    </header>

    <main>
        <div class="glass-panel editor-container">
            <div class="editor-header">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
                <span class="editor-title" id="baseUrlText">New Paste</span>
            </div>
            <textarea id="content" placeholder="在此输入文本或代码... (Input text or code here)" spellcheck="false"></textarea>
        </div>

        <div class="settings-grid">
            <div class="setting-item">
                <input type="text" id="slug" placeholder="自定义 Slug (选填)" maxlength="20">
            </div>
            <div class="setting-item">
                <input type="password" id="password" placeholder="访问密码 (选填)">
            </div>
            <div class="setting-item">
                <select id="syntax">
                    <option value="text">Plain Text</option>
                    <option value="json">JSON</option>
                    <option value="javascript">JavaScript</option>
                    <option value="python">Python</option>
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                    <option value="golang">Go</option>
                    <option value="java">Java</option>
                    <option value="c">C</option>
                    <option value="cpp">C++</option>
                    <option value="csharp">C#</option>
                    <option value="php">PHP</option>
                    <option value="ruby">Ruby</option>
                    <option value="rust">Rust</option>
                    <option value="sql">SQL</option>
                    <option value="shell">Shell/Bash</option>
                    <option value="yaml">YAML</option>
                    <option value="xml">XML</option>
                    <option value="markdown">Markdown</option>
                </select>
            </div>
            <div class="setting-item">
                <select id="expiration">
                    <option value="0">永久有效</option>
                    <option value="60">1 分钟</option>
                    <option value="600">10 分钟</option>
                    <option value="3600">1 小时</option>
                    <option value="86400">1 天</option>
                    <option value="604800">1 周</option>
                    <option value="2592000">1 个月</option>
                    <option value="31536000">1 年</option>
                </select>
            </div>
        </div>

        <div class="action-bar">
            <span id="statusMessage" class="status-text"></span>
            <button class="btn-secondary" id="myPastesBtn" style="display:none;">我的列表</button>
            <button class="btn-primary" id="submitBtn">
                <span class="spinner"></span>
                <span class="text">上传</span>
            </button>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 <a href="https://aura.us.kg" target="_blank">Aura</a>. Design by Future.</p>
    </footer>

    <div id="authModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">账号认证</div>
            <div class="input-group">
                <input type="text" id="authUsername" placeholder="用户名" autocomplete="username">
            </div>
            <div class="input-group">
                <input type="password" id="authPassword" placeholder="密码" autocomplete="current-password">
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="switchAuthMode">切换至注册</button>
                <button class="btn-primary" id="confirmAuth">登录</button>
            </div>
            <button class="btn-secondary" style="width:100%; background:transparent; color:var(--text-sec); font-size:12px;" onclick="closeAuthModal()">暂不登录，仅本地使用</button>
        </div>
    </div>

    <div id="userCenter" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">用户中心</div>
            <div style="text-align:center; margin:10px 0;">
                <div style="font-size:14px; color:var(--text-sec);">当前用户</div>
                <div id="ucUsername" style="font-size:18px; font-weight:600; margin-top:4px;">Guest</div>
            </div>
            <div class="modal-footer" style="flex-direction: column;">
                <button class="btn-secondary" id="ucMyList">查看我的 Paste</button>
                <button class="btn-secondary" id="ucLogout" style="color:#FF453A;">退出登录</button>
                <button class="btn-secondary" onclick="closeUserCenter()">关闭</button>
            </div>
        </div>
    </div>

    <div id="subClientOverlay" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header" style="margin-bottom:20px;">App Library</div>
            <div class="app-grid">
                <a href="/" class="app-item">
                    <div class="app-icon cloud">
                        <svg viewBox="0 0 24 24" width="28" height="28" fill="white"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                    </div>
                    <span class="app-name">Pastebox</span>
                </a>
                <a href="/Admin" class="app-item">
                    <div class="app-icon admin">
                        <svg viewBox="0 0 24 24" width="28" height="28" fill="white"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>
                    </div>
                    <span class="app-name">Admin</span>
                </a>
                <a href="/Cloud" class="app-item">
                    <div class="app-icon cloud">
                        <svg viewBox="0 0 24 24" width="28" height="28" fill="white"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
                    </div>
                    <span class="app-name">Cloud</span>
                </a>
                <a href="/Chat" class="app-item">
                    <div class="app-icon ai">
                        <svg viewBox="0 0 24 24" width="28" height="28" fill="white"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                    </div>
                    <span class="app-name">AI Chat</span>
                </a>
            </div>
            <button class="btn-secondary" style="margin-top:20px; width:100%;" onclick="closeSubClientMenu()">取消</button>
        </div>
    </div>

<script>
    /* -------------------------------------------------------------------------- */
    /* 逻辑保持不变                                */
    /* -------------------------------------------------------------------------- */
    const API_BASE = '/api/paste';
    const AUTH_API = '/api/auth';
    const VIEW_BASE = window.location.origin + '/Paste';

    const $content = document.getElementById('content');
    const $slug = document.getElementById('slug');
    const $password = document.getElementById('password');
    const $syntax = document.getElementById('syntax');
    const $expiration = document.getElementById('expiration');
    const $submitBtn = document.getElementById('submitBtn');
    const $status = document.getElementById('statusMessage');
    const $myPastesBtn = document.getElementById('myPastesBtn');
    const $baseUrlText = document.getElementById('baseUrlText');

    // Modals
    const $authModal = document.getElementById('authModal');
    const $userCenter = document.getElementById('userCenter');
    
    // Auth inputs
    const $authUsername = document.getElementById('authUsername');
    const $authPassword = document.getElementById('authPassword');
    const $confirmAuth = document.getElementById('confirmAuth');
    const $switchAuthMode = document.getElementById('switchAuthMode');
    
    // User Center elements
    const $ucUsername = document.getElementById('ucUsername');
    const $ucLogout = document.getElementById('ucLogout');
    const $ucMyList = document.getElementById('ucMyList');

    const state = {
        token: localStorage.getItem('paste_token') || null,
        user: localStorage.getItem('paste_user') || null,
        isRegistering: false,
        mode: 'create', // create | edit
        editId: null,
        isSubmitting: false
    };

    // UI Utilities
    function setStatus(msg, type='info') {
        $status.textContent = msg;
        $status.className = 'status-text ' + type + ' visible';
        setTimeout(() => {
            if ($status.className.includes(type)) {
               // $status.classList.remove('visible'); // Optional: auto hide
            }
        }, 5000);
    }

    function showResultLink(slug) {
        const url = `${VIEW_BASE}/${slug}`;
        $content.value = url;
        // 自动选中
        $content.focus();
        $content.select();
        // 尝试复制
        navigator.clipboard.writeText(url).then(()=>{
            setStatus(`链接已生成并复制: ${url}`, 'success');
        }).catch(()=>{
            setStatus(`链接已生成: ${url}`, 'success');
        });
    }

    function resetForm() {
        $content.value = '';
        $slug.value = '';
        $password.value = '';
        $syntax.value = 'text';
        $expiration.value = '0';
        // 重置按钮文字
        const span = $submitBtn.querySelector('.text');
        if(span) span.textContent = '上传';
    }

    // Modal Controls
    function openAuthModal() {
        $authModal.classList.add('active');
        $authUsername.focus();
    }
    function closeAuthModal() {
        $authModal.classList.remove('active');
    }
    function openUserCenter() {
        $ucUsername.textContent = state.user || 'Guest';
        $userCenter.classList.add('active');
    }
    function closeUserCenter() {
        $userCenter.classList.remove('active');
    }

    // Sub Client Menu
    const $subClientTrigger = document.getElementById('subClientTrigger');
    const $subClientOverlay = document.getElementById('subClientOverlay');

    if($subClientTrigger && $subClientOverlay){
        $subClientTrigger.addEventListener('click', ()=>{
            $subClientOverlay.classList.add('active');
        });
        $subClientOverlay.addEventListener('click', (e)=>{
            if(e.target === $subClientOverlay) closeSubClientMenu();
        });
    }
    function closeSubClientMenu(){
        if($subClientOverlay) $subClientOverlay.classList.remove('active');
    }

    // Auth Logic
    async function postJSON(url, data, token=null) {
        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;
        const res = await fetch(url, {
            method: 'POST',
            headers,
            body: JSON.stringify(data)
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || json.message || 'Request failed');
        return json;
    }

    async function initAuthFromServer() {
        if (!state.token) return;
        try {
            const res = await fetch(AUTH_API, {
                headers: { 'Authorization': `Bearer ${state.token}` }
            });
            if (res.ok) {
                const data = await res.json();
                state.user = data.username;
                localStorage.setItem('paste_user', state.user);
                applyAuthUI();
            } else {
                logout();
            }
        } catch (e) {
            console.error(e);
        }
    }

    function applyAuthUI() {
        if (state.token && state.user) {
            $myPastesBtn.style.display = 'inline-flex';
        } else {
            $myPastesBtn.style.display = 'none';
        }
    }

    function logout() {
        state.token = null;
        state.user = null;
        localStorage.removeItem('paste_token');
        localStorage.removeItem('paste_user');
        applyAuthUI();
        closeUserCenter();
        setStatus('已退出登录', 'info');
    }

    if ($confirmAuth) {
        $confirmAuth.addEventListener('click', async () => {
            const username = $authUsername.value.trim();
            const password = $authPassword.value.trim();
            if (!username || !password) return setStatus('请输入用户名和密码', 'error');

            const endpoint = state.isRegistering ? '/register' : '/login';
            try {
                const data = await postJSON(AUTH_API + endpoint, { username, password });
                if (state.isRegistering) {
                    setStatus('注册成功，请登录', 'success');
                    state.isRegistering = false;
                    $switchAuthMode.textContent = '切换至注册';
                    $confirmAuth.textContent = '登录';
                } else {
                    state.token = data.token;
                    state.user = username;
                    localStorage.setItem('paste_token', state.token);
                    localStorage.setItem('paste_user', state.user);
                    setStatus('登录成功', 'success');
                    closeAuthModal();
                    applyAuthUI();
                }
            } catch (err) {
                alert(err.message);
            }
        });
    }

    if ($switchAuthMode) {
        $switchAuthMode.addEventListener('click', () => {
            state.isRegistering = !state.isRegistering;
            $switchAuthMode.textContent = state.isRegistering ? '切换至登录' : '切换至注册';
            $confirmAuth.textContent = state.isRegistering ? '注册' : '登录';
        });
    }

    document.getElementById('userIconBtn').addEventListener('click', () => {
        if (state.token) openUserCenter();
        else openAuthModal();
    });

    if ($ucLogout) $ucLogout.addEventListener('click', logout);

    if ($ucMyList) {
        $ucMyList.addEventListener('click', () => {
            window.location.href = VIEW_BASE + '/my'; 
        });
    }
    if ($myPastesBtn) {
        $myPastesBtn.addEventListener('click', () => {
            window.location.href = VIEW_BASE + '/my';
        });
    }

    // URL Params Handling (Edit Mode)
    function enterEditMode(id) {
        state.mode = 'edit';
        state.editId = id;
        const span = $submitBtn.querySelector('.text');
        if(span) span.textContent = '更新';
        $baseUrlText.textContent = `Editing: ${id}`;
        
        // 加载内容
        fetch(`${API_BASE}/${id}?raw=true`)
            .then(r => {
                if(!r.ok) throw new Error("无法加载原 Paste");
                return r.text();
            })
            .then(text => {
                $content.value = text;
            })
            .catch(err => setStatus(err.message, 'error'));
    }

    function enterCreateMode(clear=false) {
        state.mode = 'create';
        state.editId = null;
        const span = $submitBtn.querySelector('.text');
        if(span) span.textContent = '上传';
        $baseUrlText.textContent = 'New Paste';
        if(clear) resetForm();
    }

    // Check URL query
    const urlParams = new URLSearchParams(window.location.search);
    const editSlug = urlParams.get('edit');
    if (editSlug) {
        enterEditMode(editSlug);
    }

    // Submit Logic
    if ($submitBtn) {
        $submitBtn.addEventListener('click', async () => {
            if (state.isSubmitting) return;
            
            const content = $content.value;
            if (!content.trim()) {
                setStatus("内容不能为空", "error");
                return;
            }

            // 如果当前在显示结果链接，点击按钮应该是“创建新的”
            if (state.mode === 'create' && content.startsWith(VIEW_BASE)) {
                enterCreateMode(true);
                return;
            }

            state.isSubmitting = true;
            $submitBtn.disabled = true;
            $submitBtn.classList.add('loading');
            $submitBtn.classList.add('btn-disabled');

            const payload = {
                content,
                syntax: $syntax.value,
                expiration: parseInt($expiration.value)
            };
            
            const newSlug = $slug.value.trim();
            if (newSlug) payload.customSlug = newSlug;
            
            const pwd = $password.value.trim();
            if (pwd) payload.password = pwd;

            // Edit payload
            if (state.mode === 'edit' && state.editId) {
                payload.editSlug = state.editId; 
                // 注意：通常API需要区分 create 和 update，这里假设后端逻辑支持
                // 如果后端是同一个 endpoint，通常需要传递标识
            }

            try {
                const data = await postJSON(API_BASE, payload, state.token);
                const finalSlug = data.slug || newSlug || data.id; // fallback
                if (!finalSlug) throw new Error("返回数据缺少 slug。");
                
                showResultLink(finalSlug);

                setStatus(state.mode === "edit" ? "更新成功" : "上传完成", "success");
                
                // 成功后重置为 Create 模式准备下一次
                state.mode = 'create';
                state.editId = null;
                const span = $submitBtn.querySelector('.text');
                if(span) span.textContent = '创建新 Paste';

            } catch (err) {
                setStatus(err.message || "操作失败", "error");
            } finally {
                state.isSubmitting = false;
                $submitBtn.disabled = false;
                $submitBtn.classList.remove('loading');
                $submitBtn.classList.remove('btn-disabled');
                // 按钮文字保持（如果是显示了链接，用户再次点击会重置）
            }
        });
    }

    if($baseUrlText) $baseUrlText.textContent = "New Paste";

    // ESC to close modals
    document.addEventListener("keydown", e => {
        if (e.key === "Escape") {
            const overlay = document.getElementById("subClientOverlay");
            if (overlay && overlay.classList.contains('active')) {
                closeSubClientMenu();
                return;
            }
            if ($userCenter && $userCenter.classList.contains('active')) closeUserCenter();
            else if ($authModal && $authModal.classList.contains('active')) closeAuthModal();
        }
    });

    (async function init() {
        await initAuthFromServer();
        applyAuthUI();
    })();
</script>
</body>
</html>
