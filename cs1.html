<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Pastebox Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://save.aura.us.kg/Picture/favicon.ico" type="image/x-icon">

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.3);
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --primary: #6366f1;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --bg-body: #f1f5f9;
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
            --radius: 18px;
        }

        body.theme-dark {
            --glass-bg: rgba(15, 23, 42, 0.8);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --bg-body: #020617;
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        * { box-sizing: border-box; transition: background 0.3s, color 0.3s, transform 0.2s; }
        
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* 动态背景背景 */
        .bg-blobs {
            position: fixed; inset: 0; z-index: -1;
            filter: blur(80px); opacity: 0.6;
        }
        .blob {
            position: absolute; width: 400px; height: 400px; border-radius: 50%;
            background: var(--accent-gradient); animation: move 20s infinite alternate;
        }
        @keyframes move { from { transform: translate(-10%, -10%); } to { transform: translate(20%, 20%); } }

        .app-container {
            width: 95%;
            max-width: 1100px;
            height: 85vh;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            overflow: hidden;
        }

        /* --- 侧边栏 --- */
        .sidebar {
            width: 260px;
            border-right: 1px solid var(--glass-border);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
        .brand img { width: 42px; height: 42px; border-radius: 12px; }
        .brand-name { font-weight: 800; font-size: 20px; letter-spacing: -1px; }

        .nav-menu { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 12px;
            border-radius: 12px; cursor: pointer; color: var(--text-sub);
            font-weight: 500; font-size: 14px;
        }
        .nav-item:hover, .nav-item.active { background: rgba(99, 102, 241, 0.1); color: var(--primary); }

        /* --- 主内容区 --- */
        .main-content { flex: 1; display: flex; flex-direction: column; padding: 30px; overflow-y: auto; }

        /* 编辑器区域 */
        .editor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .editor-title { font-size: 24px; font-weight: 700; }

        .textarea-container { position: relative; flex: 1; display: flex; flex-direction: column; }
        textarea {
            flex: 1; min-height: 350px; background: rgba(0,0,0,0.03);
            border: 1px solid var(--glass-border); border-radius: 16px;
            padding: 20px; color: var(--text-main); font-family: 'JetBrains Mono', monospace;
            font-size: 14px; line-height: 1.6; outline: none; resize: none;
        }
        body.theme-dark textarea { background: rgba(255,255,255,0.03); }
        textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }

        /* 属性配置区 */
        .settings-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px; margin-top: 25px; padding: 20px;
            background: rgba(0,0,0,0.02); border-radius: 16px;
        }
        .setting-item { display: flex; flex-direction: column; gap: 8px; }
        .setting-label { font-size: 12px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; }
        
        input {
            padding: 10px 14px; border-radius: 10px; border: 1px solid var(--glass-border);
            background: var(--glass-bg); color: var(--text-main); font-size: 13px;
        }

        /* 按钮设计 */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 24px; border-radius: 12px; font-weight: 600; cursor: pointer;
            border: none; font-size: 14px;
        }
        .btn-primary { background: var(--accent-gradient); color: white; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4); }
        
        .action-bar { display: flex; justify-content: flex-end; gap: 15px; margin-top: 25px; }

        /* --- 订阅弹窗重新设计 (Sub Menu) --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px); z-index: 100; display: none;
            align-items: center; justify-content: center;
        }
        .sub-card {
            width: 100%; max-width: 480px; background: var(--glass-bg);
            border-radius: 24px; padding: 30px; border: 1px solid var(--glass-border);
            box-shadow: var(--shadow); position: relative;
        }
        .sub-title { font-size: 20px; font-weight: 800; margin-bottom: 20px; }
        
        .format-selector { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        .format-chip {
            padding: 8px 16px; border-radius: 99px; background: rgba(0,0,0,0.05);
            cursor: pointer; font-size: 13px; font-weight: 500; border: 1px solid transparent;
        }
        .format-chip.active { background: var(--primary); color: white; }

        /* 订阅链接展示区 */
        .link-display-area {
            background: rgba(0,0,0,0.05); border-radius: 16px; padding: 15px;
            margin-top: 10px; border: 1px dashed var(--glass-border);
        }
        .link-text {
            font-family: 'JetBrains Mono', monospace; font-size: 12px;
            word-break: break-all; white-space: pre-wrap; color: var(--text-sub);
            max-height: 100px; overflow-y: auto; line-height: 1.5;
        }
        .copy-success-tip { color: #22c55e; font-size: 12px; font-weight: 600; margin-top: 10px; display: none; }

        /* --- 用户记录列表 --- */
        .uc-item {
            background: rgba(0,0,0,0.02); border-radius: 16px; padding: 16px;
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
        }
        .uc-info { display: flex; flex-direction: column; gap: 4px; }
        .uc-remark { font-weight: 700; font-size: 15px; }
        .uc-meta { font-size: 12px; color: var(--text-sub); }

        /* 图标通用 */
        .icon { width: 18px; height: 18px; stroke-width: 2; fill: none; stroke: currentColor; }

        @media (max-width: 768px) {
            .app-container { flex-direction: column; height: auto; min-height: 90vh; }
            .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--glass-border); flex-direction: row; justify-content: space-between; padding: 15px; }
            .nav-menu { display: none; }
            .main-content { padding: 20px; }
        }
    </style>
</head>
<body class="theme-light">

    <div class="bg-blobs">
        <div class="blob" style="top: 10%; left: 10%;"></div>
        <div class="blob" style="bottom: 10%; right: 10%; background: linear-gradient(135deg, #3b82f6 0%, #2dd4bf 100%);"></div>
    </div>

    <div class="app-container">
        <aside class="sidebar">
            <a href="#" class="brand">
                <img id="brandIcon" src="" alt="L">
                <span class="brand-name">Pastebox</span>
            </a>

            <nav class="nav-menu">
                <div class="nav-item active" onclick="location.reload()">
                    <svg class="icon"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                    新建文本
                </div>
                <div class="nav-item" id="btnAuthNav">
                    <svg class="icon"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <span id="authLabel">登录/记录</span>
                </div>
                <div class="nav-item" id="themeToggle">
                    <svg class="icon"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M17.66 6.34l1.42-1.42"/></svg>
                    切换主题
                </div>
            </nav>
            
            <div style="font-size: 10px; color: var(--text-sub); margin-top: auto;">
                © 2024 Pastebox Pro
            </div>
        </aside>

        <main class="main-content">
            <form id="pasteForm" style="display: flex; flex-direction: column; flex: 1;">
                <div class="editor-header">
                    <div class="editor-title">New Paste</div>
                    <div id="byteInfo" style="font-size: 12px; color: var(--text-sub);">0 Bytes</div>
                </div>

                <div class="textarea-container">
                    <textarea id="content" placeholder="在此输入你的内容...支持 Base64 识别" required></textarea>
                </div>

                <div class="settings-grid" id="advancedSection" style="display: none;">
                    <div class="setting-item">
                        <label class="setting-label">自定义路径 (Slug)</label>
                        <input type="text" id="customId" placeholder="e.g. my-config">
                    </div>
                    <div class="setting-item">
                        <label class="setting-label">备注 (Remark)</label>
                        <input type="text" id="remark" placeholder="仅自己可见">
                    </div>
                    <div class="setting-item">
                        <label class="setting-label">有效期 (TTL)</label>
                        <select id="ttlSelect" style="padding: 10px; border-radius: 10px; border: 1px solid var(--glass-border); background: var(--glass-bg); color: var(--text-main);">
                            <option value="10m">10 分钟</option>
                            <option value="1d">1 天</option>
                            <option value="7d" selected>7 天</option>
                            <option value="30d">30 天</option>
                            <option value="forever">永不过期</option>
                        </select>
                    </div>
                </div>

                <div class="action-bar">
                    <button type="button" class="btn" style="background: rgba(0,0,0,0.05);" id="btnReset">清空</button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <svg class="icon" style="stroke: white;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                        发布内容
                    </button>
                </div>
            </form>

            <div id="resultArea" style="display: none; margin-top: 30px; padding: 20px; border-radius: 16px; background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.2);">
                <div style="font-weight: 700; color: #16a34a; margin-bottom: 10px;">发布成功！</div>
                <div id="viewLink" style="font-family: monospace; word-break: break-all; margin-bottom: 15px;"></div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-sm" id="btnCopyView" style="background: white; border: 1px solid #ddd; padding: 6px 12px;">复制</button>
                    <button class="btn btn-sm" id="btnOpenView" style="background: white; border: 1px solid #ddd; padding: 6px 12px;">查看</button>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="subModal">
        <div class="sub-card">
            <div class="sub-title">获取订阅链接</div>
            <p style="font-size: 13px; color: var(--text-sub); margin-bottom: 20px;">选择适合您客户端的订阅格式，系统将自动转换内容。</p>
            
            <div class="format-selector" id="formatGroup">
                <div class="format-chip active" data-client="general">通用</div>
                <div class="format-chip" data-client="base64">Base64</div>
                <div class="format-chip" data-client="clash">Clash</div>
                <div class="format-chip" data-client="surge">Surge</div>
                <div class="format-chip" data-client="v2ray">V2Ray</div>
            </div>

            <div class="link-display-area">
                <div class="link-text" id="subLinkValue">正在生成...</div>
            </div>
            
            <div id="copyTip" class="copy-success-tip">已复制到剪贴板！</div>

            <div style="display: flex; gap: 12px; margin-top: 25px;">
                <button class="btn btn-primary" style="flex: 1;" id="btnCopySub">复制链接</button>
                <button class="btn" style="flex: 1; background: rgba(0,0,0,0.05);" onclick="closeSubModal()">取消</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="ucModal">
        <div class="sub-card" style="max-width: 600px; height: 80vh; display: flex; flex-direction: column;">
            <div class="sub-title">我的记录</div>
            <div id="ucList" style="flex: 1; overflow-y: auto;">
                </div>
            <button class="btn" style="width: 100%; margin-top: 20px;" onclick="closeUcModal()">返回</button>
        </div>
    </div>

    <div class="modal-overlay" id="authModal">
        <div class="sub-card">
            <div class="sub-title">身份验证</div>
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <input type="text" id="authUser" placeholder="用户名">
                <input type="password" id="authPass" placeholder="密码">
                <button class="btn btn-primary" id="btnLogin">确认登录</button>
                <button class="btn" onclick="closeAuthModal()">取消</button>
            </div>
        </div>
    </div>

    <script>
        // 基础配置
        const API_BASE = window.location.origin + "/api/paste";
        const AUTH_BASE = window.location.origin + "/api/auth";
        const state = { loggedIn: false, currentSlug: null };

        // 主题切换
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            const isDark = document.body.classList.toggle('theme-dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
        if(localStorage.getItem('theme') === 'dark') document.body.classList.add('theme-dark');

        // 随机图标
        (function(){
            const icons = [];
            for(let i=1; i<=10; i++) icons.push(`https://save.aura.us.kg/Picture/Preview/YL${i}.png`);
            document.getElementById("brandIcon").src = icons[Math.floor(Math.random()*icons.length)];
        })();

        // 核心逻辑：节点检测
        function detectNodes(str) {
            const schemes = ["ss://","ssr://","vmess://","vless://","trojan://","hysteria"];
            const lines = str.split('\n');
            let count = 0;
            lines.forEach(l => {
                schemes.forEach(s => { if(l.trim().startsWith(s)) count++; });
            });
            return count;
        }

        // 字节统计
        const contentArea = document.getElementById('content');
        contentArea.addEventListener('input', () => {
            const bytes = new TextEncoder().encode(contentArea.value).length;
            document.getElementById('byteInfo').textContent = `${bytes} Bytes`;
        });

        // 提交逻辑
        document.getElementById('pasteForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = "发布中...";

            const payload = {
                action: "create",
                content: contentArea.value,
                ttlKey: document.getElementById('ttlSelect').value,
                remark: document.getElementById('remark').value,
                slug: document.getElementById('customId').value
            };

            try {
                const res = await fetch(API_BASE, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if(data.ok) {
                    const fullUrl = window.location.origin + "/api/paste/" + data.slug;
                    document.getElementById('viewLink').textContent = fullUrl;
                    document.getElementById('resultArea').style.display = 'block';
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                } else {
                    alert("错误: " + data.error);
                }
            } catch (err) {
                alert("网络错误");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "发布内容";
            }
        });

        // 订阅弹窗逻辑
        let subSlug = "";
        function openSubModal(slug) {
            subSlug = slug;
            document.getElementById('subModal').style.display = 'flex';
            updateSubLink('general');
        }
        function closeSubModal() { document.getElementById('subModal').style.display = 'none'; }

        function updateSubLink(client) {
            const link = `${window.location.origin}/autosub?id=${subSlug}${client === 'general' ? '' : '&client=' + client}`;
            document.getElementById('subLinkValue').textContent = link;
        }

        document.getElementById('formatGroup').addEventListener('click', (e) => {
            if(e.target.classList.contains('format-chip')) {
                document.querySelectorAll('.format-chip').forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                updateSubLink(e.target.dataset.client);
            }
        });

        document.getElementById('btnCopySub').addEventListener('click', () => {
            navigator.clipboard.writeText(document.getElementById('subLinkValue').textContent);
            const tip = document.getElementById('copyTip');
            tip.style.display = 'block';
            setTimeout(() => tip.style.display = 'none', 2000);
        });

        // 登录与记录逻辑
        document.getElementById('btnAuthNav').addEventListener('click', () => {
            if(state.loggedIn) openUcModal();
            else document.getElementById('authModal').style.display = 'flex';
        });

        function closeAuthModal() { document.getElementById('authModal').style.display = 'none'; }

        document.getElementById('btnLogin').addEventListener('click', async () => {
            const user = document.getElementById('authUser').value;
            const pass = document.getElementById('authPass').value;
            const res = await fetch(AUTH_BASE + "/login", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            });
            const data = await res.json();
            if(data.ok) {
                state.loggedIn = true;
                document.getElementById('authLabel').textContent = user;
                document.getElementById('advancedSection').style.display = 'grid';
                closeAuthModal();
            } else {
                alert("登录失败");
            }
        });

        async function openUcModal() {
            document.getElementById('ucModal').style.display = 'flex';
            const res = await fetch(window.location.origin + "/api/me/pastes");
            const data = await res.json();
            const list = document.getElementById('ucList');
            list.innerHTML = "";
            if(data.items) {
                data.items.forEach(item => {
                    const nodeCount = detectNodes(item.content || "");
                    const div = document.createElement('div');
                    div.className = "uc-item";
                    div.innerHTML = `
                        <div class="uc-info">
                            <div class="uc-remark">${item.remark || item.slug}</div>
                            <div class="uc-meta">ID: ${item.slug} | Nodes: ${nodeCount}</div>
                        </div>
                        <div style="display:flex; gap:8px;">
                            ${nodeCount > 0 ? `<button class="btn btn-sm" style="padding:4px 8px; font-size:11px; background:#6366f1; color:white;" onclick="openSubModal('${item.slug}')">订阅</button>` : ''}
                            <button class="btn btn-sm" style="padding:4px 8px; font-size:11px;" onclick="window.open('/api/paste/${item.slug}')">查看</button>
                        </div>
                    `;
                    list.appendChild(div);
                });
            }
        }
        function closeUcModal() { document.getElementById('ucModal').style.display = 'none'; }

        // 初始状态
        (async function init() {
            const res = await fetch(window.location.origin + "/api/me/pastes");
            if(res.ok) {
                state.loggedIn = true;
                document.getElementById('authLabel').textContent = "我的记录";
                document.getElementById('advancedSection').style.display = 'grid';
            }
        })();
    </script>
</body>
</html>
