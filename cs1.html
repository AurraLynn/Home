<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>PASTEBOX — Minimalist Storage</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://save.aura.us.kg/Picture/favicon.ico" type="image/x-icon">
    
    <style>
        :root {
            --bg-color: #050505;
            --surface: #0f0f0f;
            --surface-hover: #161616;
            --accent: #ffffff;
            --accent-dim: #a0a0a0;
            --border: rgba(255, 255, 255, 0.08);
            --border-heavy: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-sub: #888888;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
            --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body.theme-light {
            --bg-color: #f5f5f7;
            --surface: #ffffff;
            --surface-hover: #fafafa;
            --accent: #000000;
            --accent-dim: #444444;
            --border: rgba(0, 0, 0, 0.06);
            --border-heavy: rgba(0, 0, 0, 0.12);
            --text-main: #1d1d1f;
            --text-sub: #86868b;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            display: flex;
            justify-content: center;
            padding: 60px 20px;
            transition: background-color 0.5s ease;
        }

        .shell { width: 100%; max-width: 960px; }

        /* --- Header --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 60px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .brand-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }

        .brand-sub {
            font-size: 11px;
            color: var(--text-sub);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .header-actions { display: flex; gap: 12px; }

        /* --- Buttons --- */
        button {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            border-color: var(--border-heavy);
            background: var(--surface-hover);
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg-color);
            border: none;
        }

        .btn-primary:hover {
            opacity: 0.9;
            background: var(--accent);
        }

        /* --- Card & Sections --- */
        .card {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .section-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 16px;
            display: block;
        }

        .textarea-container {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            transition: var(--transition);
        }

        .textarea-container:focus-within {
            border-color: var(--accent-dim);
            box-shadow: 0 0 0 1px var(--accent-dim);
        }

        textarea {
            width: 100%;
            min-height: 350px;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            padding: 24px;
            font-family: var(--font-mono);
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
        }

        /* --- Input Fields --- */
        .input-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
        }

        .field-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        input[type="text"], input[type="password"] {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }

        input:focus { border-color: var(--accent-dim); }

        /* --- TTL Selector --- */
        .ttl-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .ttl-btn {
            padding: 6px 16px;
            border-radius: 4px;
            font-size: 12px;
            border: 1px solid var(--border);
            background: transparent;
        }

        .ttl-btn.active {
            background: var(--accent);
            color: var(--bg-color);
            border-color: var(--accent);
        }

        /* --- Info Bar --- */
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-sub);
            margin-top: -20px;
        }

        .accent-num { color: var(--text-main); font-weight: 600; }

        /* --- Footer --- */
        .footer {
            margin-top: 80px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* --- Result Box (Pop-up style) --- */
        .result-box {
            background: var(--surface);
            border: 1px solid var(--accent-dim);
            padding: 24px;
            border-radius: 12px;
            margin-top: 30px;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            body { padding: 40px 16px; }
            .header { margin-bottom: 40px; }
            .input-group { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="theme-dark">

<div class="shell">
    <header class="header">
        <div class="brand">
            <div class="brand-title">Pastebox</div>
            <div class="brand-sub">The Premium Text Vault</div>
        </div>
        <div class="header-actions">
            <button id="themeToggle">MODE</button>
            <button id="btnUserCenter">ACCOUNT</button>
        </div>
    </header>

    <main class="card">
        <section>
            <label class="section-label">01 — Content</label>
            <div class="textarea-container">
                <textarea id="mainContent" placeholder="Enter your data here..."></textarea>
            </div>
            <div class="info-bar" style="margin-top: 12px;">
                <div class="byte-count">SIZE: <span class="accent-num" id="byteCount">0</span> BYTES</div>
                <div class="actions">
                    <button class="btn-xs" id="btnBase64" title="Toggle Base64">B64</button>
                    <button class="btn-xs" id="btnReset">CLEAR</button>
                </div>
            </div>
        </section>

        <section>
            <label class="section-label">02 — Configuration</label>
            <div class="input-group">
                <div class="field-box">
                    <label class="brand-sub">Identifier (Optional)</label>
                    <input type="text" id="customSlug" placeholder="Custom URL slug">
                </div>
                <div class="field-box">
                    <label class="brand-sub">Password (Optional)</label>
                    <input type="password" id="entryPass" placeholder="Encryption key">
                </div>
            </div>
            
            <div class="field-box" style="margin-top: 30px;">
                <label class="brand-sub">Expiration</label>
                <div class="ttl-container" id="ttlGroup">
                    <button class="ttl-btn" data-ttl="3600">1H</button>
                    <button class="ttl-btn" data-ttl="86400">1D</button>
                    <button class="ttl-btn active" data-ttl="604800">7D</button>
                    <button class="ttl-btn" data-ttl="2592000">30D</button>
                    <button class="ttl-btn" data-ttl="0">NEVER</button>
                </div>
            </div>
        </section>

        <section style="display: flex; justify-content: flex-end; align-items: center; gap: 20px;">
            <div id="statusMsg" style="font-size: 12px; letter-spacing: 0.05em;"></div>
            <button class="btn-primary" id="btnSubmit" style="padding: 14px 40px; font-size: 14px; letter-spacing: 0.1em;">
                PUBLISH DATA
            </button>
        </section>

        <div id="resultArea" style="display:none;" class="result-box">
            <label class="section-label" style="color: var(--accent);">Vault Secured</label>
            <div id="resultLink" style="font-family: var(--font-mono); font-size: 16px; margin: 15px 0; word-break: break-all;"></div>
            <div style="display: flex; gap: 10px;">
                <button id="btnCopyLink" class="btn-primary">COPY URL</button>
                <button id="btnGoView">OPEN</button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div>© 2024 PASTEBOX — SECURE BEYOND LIMITS</div>
        <div>V2.0.4 — TITANIUM EDITION</div>
    </footer>
</div>

</script>

</body>
</html>
