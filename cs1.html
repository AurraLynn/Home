<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>PasteBox :: Aurora</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://save.aura.us.kg/Picture/favicon.ico" type="image/x-icon">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           1. 核心變數 (Fluid Glass Palette)
           ========================================= */
        :root {
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-head: 'Outfit', sans-serif;

            /* Light Mode Glass */
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
            --glass-blur: blur(20px);
            
            --input-bg: rgba(255, 255, 255, 0.5);
            --input-focus-bg: rgba(255, 255, 255, 0.9);
            
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --primary-shadow: 0 4px 15px rgba(118, 75, 162, 0.3);
            
            --text-main: #2d3748;
            --text-sub: #718096;
            
            --accent-color: #764ba2;
            --danger-color: #ff6b6b;
            --success-color: #00b894;

            /* Animated Background Colors */
            --blob-1: #ff9a9e;
            --blob-2: #fad0c4;
            --blob-3: #a18cd1;
        }

        body.theme-dark {
            /* Dark Mode Glass */
            --glass-bg: rgba(20, 20, 25, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            
            --input-bg: rgba(0, 0, 0, 0.3);
            --input-focus-bg: rgba(0, 0, 0, 0.5);
            
            --primary-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --primary-shadow: 0 4px 15px rgba(0, 242, 254, 0.2);

            --text-main: #f7fafc;
            --text-sub: #a0aec0;
            
            --accent-color: #4facfe;
            
            --blob-1: #0f2027;
            --blob-2: #203a43;
            --blob-3: #2c5364;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
            background: #f0f2f5; /* Fallback */
            transition: color 0.3s;
        }

        /* 背景流體動畫 */
        .ambient-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: var(--blob-1);
            background-image: 
                radial-gradient(at 0% 0%, var(--blob-3) 0px, transparent 50%),
                radial-gradient(at 100% 0%, var(--blob-1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, var(--blob-2) 0px, transparent 50%),
                radial-gradient(at 0% 100%, var(--blob-3) 0px, transparent 50%);
            background-size: 200% 200%;
            animation: aurora 15s ease infinite;
        }
        
        @keyframes aurora {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* SVG Reset */
        .icon-svg svg {
            width: 1.2em; height: 1.2em;
            fill: none; stroke: currentColor; stroke-width: 2;
            stroke-linecap: round; stroke-linejoin: round;
        }

        /* =========================================
           2. 主容器 (Glass Card)
           ========================================= */
        .shell {
            width: 100%;
            max-width: 850px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            z-index: 1;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 24px;
            padding: 30px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* =========================================
           3. 頂部導航 (Navbar)
           ========================================= */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 10px;
            background: rgba(255,255,255,0.2); /* Extra subtle layer */
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            margin-bottom: 10px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: inherit;
            padding-left: 10px;
        }

        .brand-logo {
            width: 42px; height: 42px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            background: #fff;
        }
        .brand-logo img { width: 100%; height: 100%; object-fit: cover; }

        .brand-text { display: flex; flex-direction: column; }
        .brand-title { 
            font-family: var(--font-head); 
            font-size: 20px; 
            font-weight: 700; 
            letter-spacing: -0.5px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .brand-sub { font-size: 11px; opacity: 0.7; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;}

        .header-actions { display: flex; gap: 10px; align-items: center; }

        /* =========================================
           4. 按鈕 (Soft UI)
           ========================================= */
        button, .btn-primary, .btn-secondary, .theme-toggle, .upload-label {
            font-family: var(--font-main);
            font-weight: 600;
            font-size: 14px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: inline-flex;
            align-items: center; justify-content: center; gap: 8px;
            outline: none;
            text-decoration: none;
        }

        /* 主按鈕 - 漸變色 */
        .btn-primary, #submitBtn {
            background: var(--primary-gradient);
            color: #fff;
            padding: 10px 24px;
            box-shadow: var(--primary-shadow);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(118, 75, 162, 0.4);
            filter: brightness(1.1);
        }
        .btn-primary:active { transform: translateY(0); }

        /* 次級按鈕 - 玻璃質感 */
        .btn-secondary, .upload-label {
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--glass-border);
            padding: 8px 16px;
        }
        .btn-secondary:hover, .upload-label:hover {
            background: var(--input-focus-bg);
            border-color: var(--accent-color);
        }

        /* Icon Button */
        .icon-btn { padding: 8px; border-radius: 50%; width: 40px; height: 40px; }
        .theme-toggle { background: transparent; color: var(--text-main); border: 1px solid transparent; }
        .theme-toggle:hover { background: var(--input-bg); }

        /* Danger Button */
        .btn-danger { background: rgba(255, 107, 107, 0.1); color: var(--danger-color); border: 1px solid rgba(255, 107, 107, 0.2); }
        .btn-danger:hover { background: var(--danger-color); color: #fff; }

        /* =========================================
           5. 輸入框與編輯器 (Inset Glass)
           ========================================= */
        .input-group { margin-bottom: 24px; }
        .group-header { 
            display: flex; justify-content: space-between; align-items: flex-end; 
            margin-bottom: 12px; 
        }
        .label-title { 
            font-family: var(--font-head); font-weight: 700; font-size: 14px; 
            color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px;
        }

        textarea, input[type="text"], input[type="password"] {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px;
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace; /* Code font */
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-main);
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        textarea { min-height: 320px; resize: vertical; display: block; }
        
        textarea:focus, input:focus {
            background: var(--input-focus-bg);
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.15);
        }
        
        /* 懸浮在輸入框上的工具列 */
        .toolbar {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 8px 12px;
            border-radius: 0 0 16px 16px; /* Attach to bottom of textarea */
            margin-top: -16px; /* Overlap */
            position: relative;
            z-index: 2;
            backdrop-filter: blur(10px);
            margin-bottom: 20px;
        }
        .meta-info { font-size: 12px; font-weight: 600; color: var(--text-sub); display: flex; gap: 12px; align-items: center;}
        .tools-right { display: flex; gap: 8px; }
        
        .btn-xs { padding: 4px 10px; font-size: 11px; border-radius: 8px; height: 28px; }
        
        #fileInput { display: none; }

        /* =========================================
           6. 設定區域 (Pills)
           ========================================= */
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media(max-width: 600px) { .settings-grid { grid-template-columns: 1fr; } }

        .ttl-selector {
            display: flex;
            background: var(--input-bg);
            padding: 4px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
        }
        .ttl-btn {
            flex: 1;
            background: transparent;
            color: var(--text-sub);
            padding: 8px 0;
            border-radius: 10px;
            font-size: 12px;
            box-shadow: none;
            border: none;
        }
        .ttl-btn:hover { background: rgba(0,0,0,0.05); }
        .ttl-btn.active {
            background: #fff;
            color: var(--accent-color);
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        body.theme-dark .ttl-btn.active { background: #333; color: #fff; }

        .hint-text { font-size: 12px; color: var(--text-sub); margin-top: 6px; margin-left: 4px;}

        /* =========================================
           7. 結果與狀態
           ========================================= */
        .result-card {
            margin-top: 20px;
            background: linear-gradient(135deg, rgba(72, 198, 239, 0.15) 0%, rgba(111, 134, 214, 0.15) 100%);
            border: 1px solid rgba(72, 198, 239, 0.3);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { from{opacity:0; transform:scale(0.9);} to{opacity:1; transform:scale(1);} }

        .result-link {
            font-family: 'Menlo', monospace;
            font-size: 16px;
            color: var(--accent-color);
            margin: 12px 0;
            word-break: break-all;
            background: rgba(255,255,255,0.5);
            padding: 10px; border-radius: 8px;
            cursor: text;
        }
        body.theme-dark .result-link { background: rgba(0,0,0,0.3); color: #81ecec; }

        .status-toast {
            text-align: center; font-weight: 600; font-size: 13px; margin-top: 10px; min-height: 20px;
            transition: all 0.3s;
        }
        .status-toast.success { color: var(--success-color); }
        .status-toast.error { color: var(--danger-color); }

        /* =========================================
           8. Modals (Blur Overlay)
           ========================================= */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
            padding: 20px;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-box {
            background: var(--glass-bg); /* Use theme variable */
            /* Force solid background for modals to prevent too much transparency overlap issue */
            background: #ffffff; 
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            width: 100%; max-width: 400px;
            padding: 30px;
            transform: translateY(20px); transition: transform 0.3s;
            position: relative;
        }
        body.theme-dark .modal-box { background: #1a202c; }
        
        .modal-overlay.active .modal-box { transform: translateY(0); }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .modal-title { font-family: var(--font-head); font-size: 22px; font-weight: 700; color: var(--text-main); }
        .close-btn { background: transparent; border: none; font-size: 20px; cursor: pointer; color: var(--text-sub); }
        .close-btn:hover { color: var(--danger-color); }

        .modal-body input { margin-bottom: 15px; }
        .auth-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px;}

        /* User Center - Wider */
        .uc-box { max-width: 800px; height: 80vh; display: flex; flex-direction: column; padding: 0; overflow: hidden;}
        .uc-head { padding: 20px 30px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.02); }
        .uc-content { flex: 1; overflow-y: auto; padding: 30px; }
        
        .uc-item {
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex; flex-direction: column; gap: 8px;
            transition: transform 0.2s;
        }
        .uc-item:hover { transform: scale(1.01); background: var(--input-focus-bg); }
        .uc-top { display: flex; justify-content: space-between; }
        .uc-tag { background: var(--accent-color); color: white; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700;}
        .uc-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }

        /* Subscription Floating Menu */
        .sub-menu-box {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%; max-width: 360px;
            padding: 24px;
        }
        body.theme-dark .sub-menu-box { background: #1a202c; border: 1px solid #333; }
        
        .sub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .sub-opt {
            padding: 10px; border-radius: 12px; border: 2px solid transparent;
            background: var(--input-bg); color: var(--text-sub); font-weight: 600; font-size: 13px;
            cursor: pointer; transition: all 0.2s;
        }
        .sub-opt.active {
            border-color: var(--accent-color); color: var(--accent-color); background: rgba(118, 75, 162, 0.05);
        }
        .sub-link-wrap { display: flex; gap: 8px; background: var(--input-bg); padding: 8px; border-radius: 12px;}
        .sub-input { border: none; background: transparent; flex: 1; font-size: 12px; color: var(--text-main); outline: none;}

        .footer { text-align: center; margin-top: 40px; font-size: 12px; color: var(--text-sub); opacity: 0.6; }
        
    </style>
</head>
<body class="theme-light">

<div class="ambient-bg"></div>

<div class="shell">
    <header class="header glass-panel">
        <a href="#" class="brand">
            <div class="brand-logo"><img id="brandIcon" alt="Logo"></div>
            <div class="brand-text">
                <div class="brand-title">PasteBox</div>
                <div class="brand-sub">Aurora Edition</div>
            </div>
        </a>
        <div class="header-actions">
            <button type="button" class="theme-toggle icon-btn" id="themeToggle" title="Switch Theme">
                <span class="icon-svg theme-icon-sun"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2"/><path d="M12 21v2"/><path d="M4.22 4.22l1.42 1.42"/><path d="M18.36 18.36l1.42 1.42"/><path d="M1 12h2"/><path d="M21 12h2"/><path d="M4.22 19.78l1.42-1.42"/><path d="M18.36 5.64l1.42-1.42"/></svg></span>
                <span class="icon-svg theme-icon-moon" style="display:none;"><svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
            </button>

            <button type="button" class="btn-secondary" id="btnHome" style="display:none; border-radius:20px;">
                <span class="icon-svg"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
            </button>

            <button type="button" class="btn-primary" id="btnAuthOpen" style="border-radius:20px;">
                <span id="btnAuthLabel">Login</span>
                <span class="icon-svg"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
            </button>
        </div>
    </header>

    <main class="glass-panel" id="mainCard">
        <form id="pasteForm">
            <div class="input-group">
                <textarea id="content" placeholder="在此貼上程式碼或文本..." spellcheck="false" required></textarea>
                
                <div class="toolbar">
                    <div class="meta-info">
                        <span id="lineCounter">0 Lines</span>
                        <span style="opacity:0.3">|</span>
                        <span id="byteNum">0 B</span>
                        <span id="nodeInfo" style="color:var(--accent-color); font-weight:700; display:none;"></span>
                    </div>
                    <div class="tools-right">
                        <label for="fileInput" class="btn-secondary btn-xs upload-label" title="Upload File">
                            <span class="icon-svg"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></span>
                            Upload
                        </label>
                        <input type="file" id="fileInput" accept="*">
                        
                        <button type="button" class="btn-secondary btn-xs" id="btnBase64Encode">B64 Enc</button>
                        <button type="button" class="btn-secondary btn-xs" id="btnBase64Decode">B64 Dec</button>
                        <button type="button" class="btn-secondary btn-xs" id="btnResetContent" title="Clear">
                            <span class="icon-svg"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></span>
                        </button>
                    </div>
                </div>
                <div class="hint-text" id="fileHint"></div>
            </div>

            <div class="settings-grid">
                <div class="setting-item">
                    <div class="label-title">Expiration (TTL)</div>
                    <div class="ttl-selector" id="ttlGroup" style="margin-top:8px;">
                        <button type="button" class="ttl-btn" data-ttl="10m">10m</button>
                        <button type="button" class="ttl-btn" data-ttl="1d">1d</button>
                        <button type="button" class="ttl-btn active" data-ttl="7d">7d</button>
                        <button type="button" class="ttl-btn" data-ttl="30d">30d</button>
                        <button type="button" class="ttl-btn" data-ttl="forever" id="ttlForeverBtn">INF</button>
                    </div>
                    <div class="hint-text" id="ttlHint">Auto-delete after 7 days</div>
                </div>

                <div class="setting-item" id="advancedSection">
                    <div class="label-title">Custom ID / Remark</div>
                    <div style="display:flex; gap:10px; margin-top:8px;">
                        <div style="flex:1;">
                            <input id="customId" type="text" placeholder="Slug (opt)" style="padding:10px;">
                        </div>
                        <div style="flex:1;">
                            <input id="remark" type="text" placeholder="Note (opt)" style="padding:10px;">
                        </div>
                    </div>
                    <div class="hint-text" id="customHint">Leave empty for random ID</div>
                </div>
            </div>

            <div style="margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap:10px;">
                <button type="submit" class="btn-primary" id="submitBtn" style="width:100%; font-size:16px;">
                    Create Paste
                </button>
                <div id="statusMsg" class="status-toast"></div>
            </div>

            <div id="resultBox" style="display:none;">
                <div class="result-card">
                    <div style="color:var(--success-color); font-weight:700; margin-bottom:5px;">SUCCESSFULLY CREATED</div>
                    <div class="result-link" id="viewLinkText">https://...</div>
                    <div style="display:flex; justify-content:center; gap:10px;">
                        <button type="button" class="btn-secondary btn-sm" id="btnCopyView">Copy Link</button>
                        <button type="button" class="btn-secondary btn-sm" id="btnOpenView">Open</button>
                        <button type="button" class="btn-secondary btn-sm" id="btnManageFromResult" style="display:none;">Manage</button>
                    </div>
                </div>
            </div>
        </form>

        <div class="footer">
            <span id="baseUrlText"></span>
        </div>
    </main>
</div>

<div class="modal-overlay" id="authModal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title">Welcome Back</div>
            <button type="button" class="close-btn" id="authCloseBtn">&times;</button>
        </div>
        <form id="authForm" class="modal-body">
            <input id="authUsername" type="text" placeholder="Username" autocomplete="username">
            <input id="authPassword" type="password" placeholder="Password" autocomplete="current-password">
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-sub);">
                <input id="authRemember" type="checkbox" checked>
                Remember me
            </label>
            <div class="auth-actions">
                <button type="button" class="btn-secondary" id="btnDoRegister">Sign Up</button>
                <button type="submit" class="btn-primary" id="btnDoLogin">Log In</button>
            </div>
            <div id="authMsg" class="status-toast"></div>
        </form>
    </div>
</div>

<div class="modal-overlay" id="userCenter">
    <div class="modal-box uc-box">
        <div class="uc-head">
            <div class="modal-title" style="font-size:18px;">My Pastes</div>
            <div style="display:flex; gap:8px;">
                <button type="button" class="btn-secondary btn-xs" id="ucRefreshBtn">Refresh</button>
                <button type="button" class="btn-secondary btn-xs" id="ucLogoutBtn" style="color:var(--danger-color);">Logout</button>
                <button type="button" class="close-btn" id="ucCloseBtn" style="margin-left:10px;">&times;</button>
            </div>

<script>
    // -------------------------------------------------------------

    const $ucLogoutBtn=qs("ucLogoutBtn");

    if($baseUrlText)$baseUrlText.textContent=VIEW_BASE+"/{id}";

        loggedIn:false,
        username:null,

        customSlugError:false,

    function escapeHTML(str){
        if(!str) return "";
        return String(str).replace(/[&<>"']/g,c=>({
            "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
        }[c]||c));
    }

    function setStatus(msg,type){
        if(!$statusMsg)return;
        $statusMsg.textContent=msg||"";
        $statusMsg.classList.remove("success","error");
        if(type)$statusMsg.classList.add(type);
        
        // Auto clear status
        if(msg) setTimeout(()=>{$statusMsg.textContent=""}, 5000);
    }
    function setAuthTip(msg,type){
        if(!$authMsg)return;
        $authMsg.textContent=msg||"";
        $authMsg.classList.remove("success","error");
        if(type)$authMsg.classList.add(type);
    }

    function base64EncodeUtf8(str) {
        try {
            return btoa(unescape(encodeURIComponent(str)));
        } catch (_) {
            return null;
        }
    }

    function base64DecodeUtf8(str) {
        try {
            return decodeURIComponent(escape(atob(str)));
        } catch (_) {
            return null;
        }
    }

    function detectNodes(raw) {
        const text = (raw || "").trim();
        if (!text) return { isNode:false, count:0, fromBase64:false };

        const schemes = [
            "ss://","ssr://","vmess://","vless://","trojan://",
            "hysteria://","hysteria2://","hy2://","tuic://",
            "socks://","socks5://"
        ];
        function countIn(str) {
            let count = 0;
            str.split(/\r\n|\r|\n/).forEach(line => {
                const s = line.trim();
                if (!s) return;
                for (const p of schemes) {
                    if (s.startsWith(p)) {
                        count++;
                        break;
                    }
                }
            });
            return count;
        }

        let count = countIn(text);
        if (count > 0) {
            return { isNode:true, count, fromBase64:false };
        }

        const compact = text.replace(/\s+/g,"");
        if (compact.length >= 16 && compact.length % 4 === 0 && /^[A-Za-z0-9+/=]+$/.test(compact)) {
            const decoded = base64DecodeUtf8(compact);
            if (decoded != null) {
                const c2 = countIn(decoded);
                if (c2 > 0) {
                    return { isNode:true, count:c2, fromBase64:true };
                }
            }
        }

        return { isNode:false, count:0, fromBase64:false };
    }

    async function postJSON(url,body){
        const res=await fetch(url,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            credentials:"include",
            body:JSON.stringify(body||{})
        });
        const data=await res.json().catch(()=>({}));
        if(!res.ok||data.ok===false){
            throw new Error(data.error||`Error (${res.status})`);
        }
        return data;
    }

    function updateByteCount(){
        if(!$content||!$byteNum)return;
        let len=0;
        try{len=new TextEncoder().encode($content.value).length;}
        catch(_){len=$content.value.length;}
        $byteNum.textContent=len + " B";
        if($lineCounter){
            const v=$content.value||"";
            const lines=v ? v.split(/\r\n|\r|\n/).length : 0;
            $lineCounter.textContent = lines+" Lines";
        }

        if ($nodeInfo) {
            const info = detectNodes($content.value || "");
            if (info.isNode && info.count > 0) {
                $nodeInfo.textContent = `Nodes: ${info.count}`;
                $nodeInfo.style.display="inline";
            } else {
                $nodeInfo.textContent = "";
                $nodeInfo.style.display="none";
            }
        }
    }
    if($content){
        updateByteCount();
        $content.addEventListener("input",updateByteCount);
    }

    if($fileInput){
        $fileInput.addEventListener("change",()=>{
            const file=$fileInput.files&&$fileInput.files[0];
            if(!file)return;
            const reader=new FileReader();
            reader.onload=()=>{
                if($content){
                    $content.value=reader.result||"";
                    updateByteCount();
                }
                if($fileHint){
                    $fileHint.textContent=`Loaded: ${file.name} (${file.size} B)`;
                    $fileHint.style.color="var(--success-color)";
                }
            };
            reader.onerror=()=>{
                if($fileHint){
                    $fileHint.textContent="Read Error";
                    $fileHint.style.color="var(--danger-color)";
                }
            };
            reader.readAsText(file);
        });
    }

    if($btnResetContent){
        $btnResetContent.addEventListener("click",()=>{
            if($content)$content.value="";
            if($remark)$remark.value="";
            updateByteCount();
            setStatus("Cleared.");
        });
    }

    if ($btnBase64Encode) {
        $btnBase64Encode.addEventListener("click", () => {
            if (!$content) return;
            const v = $content.value;
            if (!v) return;
            const encoded = base64EncodeUtf8(v);
            if (encoded == null) {
                setStatus("Encode Failed", "error");
                return;
            }
            $content.value = encoded;
            updateByteCount();
            setStatus("Encoded to Base64", "success");
        });
    }

    if ($btnBase64Decode) {
        $btnBase64Decode.addEventListener("click", () => {
            if (!$content) return;
            const v = $content.value;
            if (!v) return;
            const decoded = base64DecodeUtf8(v);
            if (decoded == null) {
                setStatus("Decode Failed", "error");
                return;
            }
            $content.value = decoded;
            updateByteCount();
            setStatus("Decoded Base64", "success");
        });
    }

    const ttlText={
        "10m":"Delete in 10 minutes",
        "1d":"Delete in 24 hours",
        "7d":"Delete in 7 days",
        "30d":"Delete in 30 days",
        "forever":"Never delete"
    };
    function setTtl(key){
        state.ttlKey=key;
        if($ttlGroup){
            $ttlGroup.querySelectorAll(".ttl-btn").forEach(b=>{
                b.classList.toggle("active",b.dataset.ttl===key);
            });
        }
        if($ttlHint)$ttlHint.textContent=ttlText[key]||ttlText["7d"];
    }
    setTtl("7d");
    if($ttlGroup){
        $ttlGroup.addEventListener("click",e=>{
            const btn=e.target.closest(".ttl-btn");
            if(!btn)return;
            if(btn.disabled)return;
            const key=btn.dataset.ttl;
            if(!key)return;
            setTtl(key);
        });
    }

    function validateCustomSlug(){
        state.customSlugError=false;
        if(!$customId)return;
        const val=$customId.value.trim();
        if(!state.loggedIn){
            if($advancedSection)$advancedSection.style.display="none";
            return;
        }else{
            if($advancedSection)$advancedSection.style.display="block";
        }
        if(!val){
            if($customHint){
                $customHint.textContent="Random ID if empty";
                $customHint.style.color="var(--text-sub)";
            }
            return;
        }
        const ok=/^[A-Za-z0-9_-]+$/.test(val);
        if(!ok){
            state.customSlugError=true;
            if($customHint){
                $customHint.textContent="Invalid characters";
                $customHint.style.color="var(--danger-color)";
            }
        }else{
            if($customHint){
                $customHint.textContent="ID Available";
                $customHint.style.color="var(--success-color)";
            }
        }
    }
    if($customId)$customId.addEventListener("input",validateCustomSlug);

    function enterCreateMode(clear){
        state.mode="create";
        state.originalSlug=null;
        if($submitBtn) $submitBtn.textContent="Create Paste";
        if($btnHome)$btnHome.style.display="none";
        if(clear){
            if($content)$content.value="";
            if($remark)$remark.value="";
            if($customId)$customId.value="";
            updateByteCount();
            setStatus("");
        }
    }

    if($btnHome){
        $btnHome.addEventListener("click",()=>{
            enterCreateMode(true);
            history.replaceState(null,"",BASE_URL);
            window.scrollTo({top:0,behavior:"smooth"});
        });

    function applyAuthUI(){
        if($btnAuthLabel){
            $btnAuthLabel.textContent = state.loggedIn ?
                (state.username || "User") : "Login";

        if($advancedSection){
            $advancedSection.style.display = state.loggedIn ?
                "block" : "none";
        }

        if ($ttlForeverBtn) {
            if (state.loggedIn) {
                $ttlForeverBtn.disabled = false;
            } else {
                $ttlForeverBtn.disabled = true;
                if (state.ttlKey === "forever") {
                    setTtl("7d");
                }
            }
        }

        validateCustomSlug();
    }

    function setLoggedIn(username){
        state.loggedIn = true;
        state.username = username || "User";
        try { localStorage.setItem("pbx_username", state.username); } catch(_) {}
        setTtl("forever");
        applyAuthUI();
    }
    function setLoggedOut(){
        state.loggedIn=false;
        state.username=null;
        try{localStorage.removeItem("pbx_username");}catch(_){}
        applyAuthUI();
    }

    async function initAuthFromServer(){
        let saved=null;
        try{saved=localStorage.getItem("pbx_username")||null;}catch(_){}
        try{
            const res=await fetch(location.origin+"/api/me/pastes",{credentials:"include"});
            if(res.status===401){setLoggedOut();return;}
            const data=await res.json().catch(()=>({}));
            if(data&&data.ok){

            }else{
                setLoggedOut();
            }

        }

    // Modal Helpers

            setAuthTip("Registering...");
            try{
                await postJSON(AUTH_BASE+"/register",{username:u,password:p});
                setAuthTip("Registered. Please login.","success");
            }catch(err){
                setAuthTip(err.message||"Failed","error");
            }

    function formatDate(d){
        if(!d)return"-";
        const dt=new Date(d);
        if(Number.isNaN(dt.getTime()))return"-";
        return dt.toISOString().slice(0,16).replace("T"," ");
    }
    function calcRemainDays(expires){
        if(!expires)return null;
        const t=new Date(expires).getTime();
        if(Number.isNaN(t))return null;
        const now=Date.now();
        const diff=t-now;
        const d=Math.ceil(diff/86400000);
        return d;
    }

    // Subscription Logic
    function buildSubLink(slug, clientKey) {
        const base = `${location.origin}/autosub?id=${encodeURIComponent(slug)}`;
        if (!clientKey || clientKey === "general") return base;
        return `${base}&client=${encodeURIComponent(clientKey)}`;
    }

    let currentSubSlug = null;
    function openSubClientMenu(slug) {
        currentSubSlug = slug;
        showModal("subClientOverlay");
        if (window.__subMenuSync) window.__subMenuSync();
    }

    function closeSubClientMenu() {
        currentSubSlug = null;
        hideModal("subClientOverlay");
    }

    (function initSubClientMenu(){
        const overlay = document.getElementById("subClientOverlay");
        if (!overlay) return;

        const closeBtn = document.getElementById("subMenuCloseBtn");
        const input = document.getElementById("subLinkInput");
        const copyBtn = document.getElementById("subLinkCopyBtn");
        const opts = Array.from(overlay.querySelectorAll(".sub-opt"));

        let selected = "general";

        function refresh(){
            opts.forEach(btn=>{
                const key = btn.getAttribute("data-client") || "general";
                btn.classList.toggle("active", key === selected);
            });
            if (input) {
                input.value = currentSubSlug ? buildSubLink(currentSubSlug, selected) : "";
            }
        }

        function setSelected(key){
            selected = key || "general";
            refresh();
        }

        window.__subMenuSync = function(){
            selected = "general";
            refresh();
        };
        if (closeBtn) closeBtn.addEventListener("click", closeSubClientMenu);
        overlay.addEventListener("click",(e)=>{
            if (e.target === overlay) closeSubClientMenu();
        });
        opts.forEach(btn=>{
            btn.addEventListener("click", ()=>{
                setSelected(btn.getAttribute("data-client") || "general");
            });
        });

        if (copyBtn) copyBtn.addEventListener("click", async ()=>{
            if (!currentSubSlug) return;
            const url = buildSubLink(currentSubSlug, selected);
            try{
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(url);
                    setStatus("Link Copied", "success");
                } else {
                    window.prompt("Copy link:", url);
                }
            }catch(_){
                window.prompt("Copy link:", url);
            }
            closeSubClientMenu();
        });
        document.addEventListener("keydown",(e)=>{
            if (e.key === "Escape" && overlay.classList.contains("active")) closeSubClientMenu();
        });
        refresh();
    })();


    async function loadUserPastes(){
        if(!$ucEmpty||!$ucList)return;
        $ucEmpty.style.display="block";
        $ucEmpty.textContent="Fetching...";
        $ucList.style.display="none";
        $ucList.innerHTML="";
        try{
            const res=await fetch(location.origin+"/api/me/pastes",{credentials:"include"});
            if(res.status===401){
                $ucEmpty.textContent="Session Expired";
                setLoggedOut();
                return;
            }
            const data=await res.json().catch(()=>({}));
            if(!data.ok){
                $ucEmpty.textContent=data.error||"Error";
                return;
            }
            const items=data.items||[];
            if(!items.length){
                $ucEmpty.textContent="No records found";
                return;
            }

            const valid=[];
            await Promise.all(items.map(async (item)=>{
                const slug=item.slug||item.id;
                if(!slug)return;
                try{
                    const u=new URL(`${API_BASE}/${encodeURIComponent(slug)}`);
                    u.searchParams.set("manage","1");
                    const r=await fetch(u.toString(),{credentials:"include"});
                    if(!r.ok)return;
                    const d=await r.json().catch(()=>null);
                    if(!d||d.ok===false)return;
                    const remain=calcRemainDays(d.expiresAt);
                    if(remain!=null && remain<0)return;

                    d._nodeInfo = detectNodes(d.content || "");
                    valid.push(d);
                }catch(_){}
            }));
            if(!valid.length){
                $ucEmpty.textContent="No valid records";
                return;
            }

            valid.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

            $ucEmpty.style.display="none";
            $ucList.style.display="flex";
            valid.forEach(d=>{
                const slug=d.slug;
                if(!slug)return;
                const remark=d.remark||"-";
                const expires=d.expiresAt||null;
                const ttlKey=d.ttlKey||"";

                const viewUrl=`${VIEW_BASE}/${encodeURIComponent(slug)}`;
                const remain=calcRemainDays(expires);

                const nodeInfo = d._nodeInfo || detectNodes(d.content || "");
                const hasNode = !!nodeInfo.isNode && nodeInfo.count > 0;
                const nodeCount = nodeInfo.count || 0;

                const row=document.createElement("div");
                row.className="uc-item";
                
                let metaText="";
                if(!expires || ttlKey==="forever"){
                    metaText=`Never Expire`;
                }else{
                    metaText+=`Exp: ${formatDate(expires)}`;
                    if(remain!=null && remain>=0){
                        metaText+=` (${remain}d left)`;
                    }
                }

                row.innerHTML=`
                    <div class="uc-top">
                        <div style="font-weight:700;">${escapeHTML(slug)}</div>
                        <div style="font-size:12px;color:var(--text-sub);">${escapeHTML(remark)}</div>
                    </div>
                    <div style="font-size:11px; color:var(--text-sub);">${metaText}</div>
                    <div class="uc-actions">
                        ${hasNode ? `<button type="button" class="btn-secondary btn-xs uc-sub-btn">Sub (${nodeCount})</button>` : ''}
                        <button type="button" class="btn-secondary btn-xs uc-edit-btn">Edit</button>
                        <button type="button" class="btn-secondary btn-xs uc-copy-btn">Copy</button>
                        <button type="button" class="btn-secondary btn-xs uc-open-btn">Open</button>
                        <button type="button" class="btn-danger btn-xs uc-del-btn">Del</button>
                    </div>
                `;

                if (hasNode) {
                   row.querySelector(".uc-sub-btn").addEventListener("click",()=>openSubClientMenu(slug));
                }
                
                row.querySelector(".uc-edit-btn").addEventListener("click",()=>{
                    closeUserCenter();
                    enterEditMode(slug);
                });
                row.querySelector(".uc-copy-btn").addEventListener("click",async ()=>{
                    try{
                        await navigator.clipboard.writeText(viewUrl);
                        setStatus("Copied","success");
                    }catch(_){setStatus("Failed","error");}
                });
                row.querySelector(".uc-open-btn").addEventListener("click",()=>{
                    window.open(viewUrl,"_blank","noopener");
                });
                row.querySelector(".uc-del-btn").addEventListener("click",async ()=>{
                    if(!confirm("Delete this paste?"))return;
                    try{
                        await postJSON(API_BASE,{action:"delete",slug});
                        loadUserPastes();
                        setStatus("Deleted","success");
                    }catch(err){
                        setStatus(err.message||"Error","error");
                    }
                });

                $ucList.appendChild(row);
            });
        }catch(err){
            $ucEmpty.textContent=err.message||"Error";
        }
    }

    if($ucRefreshBtn)$ucRefreshBtn.addEventListener("click",loadUserPastes);
    if($ucLogoutBtn){
        $ucLogoutBtn.addEventListener("click",async ()=>{
            try{await postJSON(AUTH_BASE+"/logout",{});}catch(_){}
            setLoggedOut();
            closeUserCenter();
            enterCreateMode(true);
            setStatus("Logged Out","success");
        });
    }

    async function enterEditMode(slug){
        state.mode="edit";
        state.originalSlug=slug;
        if($submitBtn) $submitBtn.textContent="Update Paste";
        if($btnHome)$btnHome.style.display="inline-flex";
        setStatus("Loading...");
        try{
            const url=new URL(`${API_BASE}/${encodeURIComponent(slug)}`);
            url.searchParams.set("manage","1");
            const res=await fetch(url.toString(),{credentials:"include"});
            const data=await res.json().catch(()=>({}));
            if(!res.ok||data.ok===false){
                throw new Error(data.error||"Not Found");
            }
            if($content)$content.value=data.content||"";
            if($remark)$remark.value=data.remark||"";
            if($customId){
                $customId.value=data.slug||slug;
                $customId.readOnly=false;
            }
            updateByteCount();
            if(data.ttlKey)setTtl(data.ttlKey);
            const urlClean=new URL(location.href);
            urlClean.searchParams.set("id",slug);
            history.replaceState(null,"",urlClean.toString());
            setStatus("Edit Mode","success");
        }catch(err){
            setStatus(err.message||"Error","error");
            enterCreateMode(false);
        }
    }

    function showResultLink(slug){
        if(!$resultBox||!$viewLinkText)return;
        const url=`${VIEW_BASE}/${encodeURIComponent(slug)}`;
        $viewLinkText.textContent=url;
        $resultBox.style.display="block";
        if($btnManageFromResult){
            $btnManageFromResult.style.display = state.loggedIn ?
                "inline-flex" : "none";
        }
    }

    if($btnCopyView){
        $btnCopyView.addEventListener("click",async ()=>{
            const text=$viewLinkText&&$viewLinkText.textContent;
            if(!text)return;
            try{
                await navigator.clipboard.writeText(text);
                setStatus("Link Copied","success");
            }catch(_){
                setStatus("Copy failed","error");
            }
        });
    }
    if($btnOpenView){
        $btnOpenView.addEventListener("click",()=>{
            const text=$viewLinkText&&$viewLinkText.textContent;
            if(!text)return;
            window.open(text,"_blank","noopener");
        });
    }
    if($btnManageFromResult){
        $btnManageFromResult.addEventListener("click",()=>{
            if(!state.loggedIn){
                openAuthModal();
                return;
            }
            openUserCenter();
        });
    }

    if($form){
        $form.addEventListener("submit",async e=>{
            e.preventDefault();
            const text=($content&&$content.value.trim())||"";
            if(!text){setStatus("Content required","error");return;}
            if(state.customSlugError){setStatus("Invalid ID","error");return;}

            let slug=null;
            let newSlug=null;
            if(state.mode==="edit"){
                slug=state.originalSlug;
                if($customId){
                    const v=$customId.value.trim();
                    if(v&&v!==slug)newSlug=v;
                }
            }else{
                if(state.loggedIn&&$customId){
                    const v=$customId.value.trim();
                    if(v)slug=v;
                }
            }

            const payload={
                action:state.mode==="edit"?"update":"create",
                content:text,
                ttlKey:state.ttlKey,
                remark:$remark?$remark.value.trim():""
            };
            if(slug)payload.slug=slug;
            if(newSlug)payload.newSlug=newSlug;

            state.isSubmitting=true;
            if($submitBtn) $submitBtn.textContent="Processing...";

            try{
                const data=await postJSON(API_BASE,payload);
                const finalSlug=data.slug||newSlug||slug;
                if(!finalSlug)throw new Error("No slug returned");
                showResultLink(finalSlug);

                setStatus("Success","success");
                enterCreateMode(true);
            }catch(err){
                setStatus(err.message||"Failed","error");
            }finally{
                state.isSubmitting=false;
                if($submitBtn){
                    $submitBtn.textContent=state.mode==="edit"?"Update Paste":"Create Paste";
                }
            }
        });
    }

    if($baseUrlText)$baseUrlText.textContent=VIEW_BASE+"/{id}";

    document.addEventListener("keydown",e=>{
        if(e.key==="Escape"){
            const overlay = document.getElementById("subClientOverlay");
            if(overlay && overlay.classList.contains("active")){
                closeSubClientMenu();
                return;
            }
            if($userCenter&&$userCenter.classList.contains("active"))closeUserCenter();
            else if($authModal&&$authModal.classList.contains("active"))closeAuthModal();
        }
    });
    (async function init(){
        await initAuthFromServer();
        applyAuthUI();
    })();
</script>
</body>
</html>
