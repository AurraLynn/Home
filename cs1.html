<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Pastebox Pro - 完整重构版</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://save.aura.us.kg/Picture/favicon.ico" type="image/x-icon">
    <meta property="og:title" content="Pastebox">
    <meta property="og:image" content="https://save.aura.us.kg/Picture/Preview/YL10.png">

    <style>
        [cite_start]/* 2. 注入原件 CSS 变量并升级为现代 Dashboard 风格 [cite: 168-172] */
        :root {
            --bg: #f4f7fb;
            --sidebar-w: 260px;
            --accent: #2563eb;
            --accent-soft: rgba(37, 99, 235, 0.1);
            --card-bg: #ffffff;
            --text-p: #1e293b;
            --text-s: #64748b;
            --border: rgba(0,0,0,0.05);
            --glass: blur(12px) saturate(180%);
        }

        .theme-dark {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-p: #f1f5f9;
            --text-s: #94a3b8;
            --border: rgba(255,255,255,0.06);
        }

        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text-p); display: flex; height: 100vh; overflow: hidden; }
        
        /* 布局：侧边栏 + 主内容区 */
        .sidebar { width: var(--sidebar-w); background: var(--card-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 24px; z-index: 50; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 30px; position: relative; }

        [cite_start]/* 核心编辑器样式 [cite: 206-208] */
        .editor-container { background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border); display: flex; flex-direction: column; flex: 1; box-shadow: 0 10px 25px rgba(0,0,0,0.02); }
        textarea { flex: 1; border: none; padding: 24px; background: transparent; color: var(--text-p); font-family: "JetBrains Mono", monospace; font-size: 14px; line-height: 1.6; outline: none; resize: none; }
        
        [cite_start]/* 原件中的配置面板 [cite: 194-200] */
        .config-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; padding: 20px; background: rgba(0,0,0,0.02); border-top: 1px solid var(--border); }
        .input-item { display: flex; flex-direction: column; gap: 6px; }
        .input-item label { font-size: 11px; font-weight: 700; color: var(--text-s); text-transform: uppercase; }
        .control { background: var(--card-bg); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; color: var(--text-p); font-size: 13px; }

        [cite_start]/* 功能按钮 [cite: 213-219] */
        .btn-fab { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 20px rgba(37,99,235,0.2); }
        .btn-fab:hover { transform: translateY(-1px); }

        [cite_start]/* 原件中的弹窗 UI 适配 [cite: 231-239] */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal-body { width: 90%; max-width: 480px; background: var(--card-bg); border-radius: 20px; padding: 30px; position: relative; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; flex-direction: row; justify-content: space-between; padding: 15px; }
            .sidebar nav { display: none; }
        }
    </style>
</head>
<body class="theme-light">

    <aside class="sidebar">
        <div class="brand" style="display:flex; align-items:center; gap:12px; margin-bottom:40px;">
            <img src="https://save.aura.us.kg/Picture/Preview/YL10.png" width="40" height="40" style="border-radius:10px;">
            <span style="font-weight:800; font-size:20px;">Pastebox</span>
        </div>
        
        <nav style="flex:1; display:flex; flex-direction:column; gap:8px;">
            <button class="control" onclick="location.reload()">+ 新建内容</button>
            <button class="control" id="btnUserCenter">历史记录 (User Center)</button>
            <button class="control" id="themeToggle">切换主题</button>
        </nav>

        <div id="statusInfo" style="font-size:12px; color:var(--text-s); padding-top:20px; border-top:1px solid var(--border);">
            API 状态: <span id="apiStatus">在线</span>
        </div>
    </aside>

    <main class="main-content">
        <div class="editor-container">
            <div style="padding:12px 20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
                <div id="nodeDetectBadge" style="display:none; background:#22c55e; color:white; font-size:10px; padding:2px 8px; border-radius:99px; font-weight:700;">检测到节点</div>
                <div id="charCount" style="font-size:11px; color:var(--text-s);">0 Bytes</div>
            </div>

            <textarea id="content" placeholder="输入内容..."></textarea>

            <div class="config-grid">
                <div class="input-item">
                    <label>自定义 Slug</label>
                    <input type="text" id="slug" class="control" placeholder="随机">
                </div>
                <div class="input-item">
                    <label>有效期 (TTL)</label>
                    <select id="ttlSelect" class="control">
                        <option value="1h">1 小时</option>
                        <option value="1d">1 天</option>
                        <option value="7d" selected>7 天</option>
                        <option value="forever">永久</option>
                    </select>
                </div>
                <div class="input-item">
                    <label>备注 (Remark)</label>
                    <input type="text" id="remark" class="control" placeholder="仅登录可见">
                </div>
            </div>
        </div>

        <div style="margin-top:20px; display:flex; justify-content:flex-end;">
            <button class="btn-fab" id="submitBtn">发布 Paste</button>
        </div>

        <div id="resultArea" style="display:none; margin-top:20px; padding:20px; background:var(--card-bg); border-radius:15px; border:2px solid #22c55e;">
            <p style="margin-top:0; font-weight:700;">发布成功！</p>
            <div id="finalUrl" style="background:var(--bg); padding:10px; border-radius:8px; font-family:monospace; margin-bottom:15px; word-break:break-all;"></div>
            <div style="display:flex; gap:10px;">
                <button class="control" id="copyUrl">复制链接</button>
                <button class="control" style="background:var(--accent); color:white;" id="openSubMenu">订阅转换 (Sub Menu)</button>
            </div>
        </div>
    </main>

    <div class="modal" id="modalContainer">
        <div class="modal-body">
            <h3 id="modalTitle">标题</h3>
            <div id="modalContent"></div>
            <button class="control" style="margin-top:20px; width:100%;" onclick="closeModal()">关闭</button>
        </div>
    </div>

    <script>
        // 1. 全局配置与状态初始化
        const API_BASE = window.location.origin + "/api/paste";
        const state = { mode: "create", user: null, isSubmitting: false };

        // 2. 节点检测逻辑 [完全保留原件正则 cite: 210-211]
        const $content = document.getElementById('content');
        $content.addEventListener('input', () => {
            const val = $content.value;
            const bytes = new TextEncoder().encode(val).length;
            document.getElementById('charCount').innerText = bytes + " Bytes";

            const nodeRegex = /ss:\/\/|ssr:\/\/|vmess:\/\/|vless:\/\/|trojan:\/\/|hysteria|tuic:\/\//i;
            document.getElementById('nodeDetectBadge').style.display = nodeRegex.test(val) ? 'block' : 'none';
        });

        // 3. 提交逻辑 [完全保留原件 API 请求结构 cite: 2200-2280]
        document.getElementById('submitBtn').addEventListener('click', async () => {
            if(state.isSubmitting) return;
            const content = $content.value.trim();
            if(!content) return alert("内容不能为空");

            state.isSubmitting = true;
            const btn = document.getElementById('submitBtn');
            btn.innerText = "提交中...";

            const payload = {
                action: "create",
                content: content,
                slug: document.getElementById('slug').value,
                ttlKey: document.getElementById('ttlSelect').value,
                remark: document.getElementById('remark').value
            };

            try {
                const res = await fetch(API_BASE, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if(data.ok) {
                    state.currentSlug = data.slug;
                    document.getElementById('finalUrl').innerText = window.location.origin + "/api/paste/" + data.slug;
                    document.getElementById('resultArea').style.display = 'block';
                } else {
                    alert("错误: " + data.error);
                }
            } finally {
                state.isSubmitting = false;
                btn.innerText = "发布 Paste";
            }
        });

        // 4. 订阅转换 (Sub Menu) [完全保留原件客户端选择逻辑 cite: 259-280]
        document.getElementById('openSubMenu').onclick = () => {
            showModal("订阅转换", `
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                    <button class="control" onclick="copySub('clash')">Clash</button>
                    <button class="control" onclick="copySub('surge')">Surge</button>
                    <button class="control" onclick="copySub('singbox')">Sing-box</button>
                    <button class="control" onclick="copySub('v2ray')">V2Ray</button>
                </div>
                <p style="font-size:11px; color:var(--text-s); margin-top:15px;">点击上方按钮将直接复制对应格式的订阅链接。</p>
            `);
        };

        window.copySub = (client) => {
            const subUrl = `${window.location.origin}/autosub?id=${state.currentSlug}&client=${client}`;
            navigator.clipboard.writeText(subUrl);
            alert("已复制 " + client + " 链接");
        };

        // 5. 用户中心与鉴权 [保留原件 UserCenter 逻辑 cite: 238-250]
        document.getElementById('btnUserCenter').onclick = async () => {
            showModal("用户中心", "正在加载记录...");
            // 此处完整调用你后端原本的 /api/me/pastes 接口
            const res = await fetch("/api/me/pastes");
            const data = await res.json();
            if(data.ok) {
                const listHtml = data.items.map(i => `<div style="padding:10px; border-bottom:1px solid var(--border); font-size:12px;">${i.slug} <small>(${i.remark || '无备注'})</small></div>`).join('');
                document.getElementById('modalContent').innerHTML = listHtml || "暂无记录";
            } else {
                document.getElementById('modalContent').innerHTML = "请先登录";
            }
        };

        // 辅助函数
        function showModal(title, content) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalContent').innerHTML = content;
            document.getElementById('modalContainer').style.display = 'flex';
        }
        function closeModal() { document.getElementById('modalContainer').style.display = 'none'; }
        
        // 主题切换逻辑
        document.getElementById('themeToggle').onclick = () => {
            document.body.classList.toggle('theme-dark');
        };
    </script>
</body>
</html>
