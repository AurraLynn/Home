<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>PasteBox 极简版</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://save.aura.us.kg/Picture/favicon.ico" type="image/x-icon">
    
    <style>
        /* =========================================
           1. 核心变量 (Minimalist Paper Palette)
           ========================================= */
        :root {
            --bg-body: #F7F7F5;      /* 柔和的米灰色背景 */
            --bg-card: #FFFFFF;
            --bg-hover: #F0F0F0;
            
            --border: #E0E0E0;       /* 极细的浅灰边框 */
            --border-hover: #B0B0B0;
            --border-active: #333333;

            --text-main: #37352F;    /* 接近黑色但不刺眼的深灰 */
            --text-sub: #787774;     /* 辅助灰 */
            --text-light: #A1A1AA;
            
            --primary: #37352F;      /* 主色调：深灰 */
            --primary-fg: #FFFFFF;
            
            --accent: #E16B16;       /* 强调色：类似荧光笔的橙色，仅少量使用 */
            --danger: #EB5757;
            --success: #27AE60;

            --radius: 6px;           /* 较小的圆角，显得干练 */
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            --font-mono: "Menlo", "Monaco", "Consolas", "Courier New", monospace;
            
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.03);
            --shadow-card: 0 4px 12px rgba(0,0,0,0.03);
        }

        /* 暗色模式 - 深空灰风格 */
        body.theme-dark {
            --bg-body: #191919;
            --bg-card: #202020;
            --bg-hover: #2C2C2C;
            
            --border: #333333;
            --border-hover: #555555;
            --border-active: #E0E0E0;

            --text-main: #D4D4D4;
            --text-sub: #909090;
            
            --primary: #E0E0E0;
            --primary-fg: #191919;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font-sans);
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 30px 16px;
            line-height: 1.5;
            transition: background-color 0.2s, color 0.2s;
        }

        /* SVG 重置 - 纤细线条 */
        .icon-svg svg {
            width: 15px; height: 15px;
            fill: none; stroke: currentColor; stroke-width: 1.5; /* 线条更细 */
            stroke-linecap: round; stroke-linejoin: round;
        }

        /* =========================================
           2. 布局容器
           ========================================= */
        .shell {
            width: 100%;
            max-width: 760px; /*稍微收窄，增加文档感*/
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 卡片通用样式 - 极简白纸 */
        .card, .auth-panel, .uc-panel, .sub-menu {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            padding: 32px;
        }

        /* =========================================
           3. 顶部导航 (Clean Header)
           ========================================= */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: inherit;
        }

        .brand-logo {
            width: 32px; height: 32px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: var(--bg-hover);
        }
        .brand-logo img { width: 100%; height: 100%; object-fit: cover; opacity: 0.9; }

        .brand-text { display: flex; flex-direction: column; justify-content: center; }
        .brand-title { 
            font-size: 16px; 
            font-weight: 600; /* 不太粗 */
            color: var(--text-main);
            letter-spacing: -0.02em;
        }
        .brand-sub { display: none; } /* 极简模式下隐藏副标题 */

        .header-actions { display: flex; gap: 10px; align-items: center; }

        /* =========================================
           4. 按钮设计 (Refined Buttons)
           ========================================= */
        button, .btn-primary, .btn-secondary, .theme-toggle, .upload-btn {
            font-family: var(--font-sans);
            font-size: 13px;       /* 字体调小 */
            font-weight: 400;      /* 字重减轻 */
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid transparent;
            padding: 6px 12px;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            transition: all 0.15s ease;
            outline: none;
            background: transparent;
        }

        /* 主按钮 - 沉稳 */
        .btn-primary, #submitBtn {
            background: var(--primary);
            color: var(--primary-fg);
            border-color: var(--primary);
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary.btn-disabled { opacity: 0.5; cursor: not-allowed; }

        /* 次级按钮 - 干净 */
        .btn-secondary, .theme-toggle, .upload-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
        }
        .btn-secondary:hover, .theme-toggle:hover, .upload-btn:hover {
            background: var(--bg-hover);
            border-color: var(--border-hover);
        }

        /* 文字按钮 (Reset) */
        .btn-reset { 
            color: var(--text-sub); 
            background: transparent; 
            font-size: 12px;
        }
        .btn-reset:hover { color: var(--danger); background: transparent; }

        /* =========================================
           5. 输入区域 (Paper-like Textarea)
           ========================================= */
        .card-section {
            margin-bottom: 24px;
            display: flex; flex-direction: column; gap: 12px;
        }

        .section-title {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--bg-hover);
            margin-bottom: 4px;
        }

        .textarea-wrap { position: relative; }
        textarea {
            width: 100%;
            min-height: 280px;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg-card); /* 纯白背景 */
            color: var(--text-main);
            font-family: var(--font-mono);
            font-size: 13px;
            line-height: 1.7; /* 增加行高，阅读更舒适 */
            resize: vertical;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        textarea:focus {
            border-color: var(--border-active);
            box-shadow: 0 0 0 1px var(--border-active); /* 聚焦时仅加深边框 */
        }

        .line-counter {
            position: absolute; bottom: 12px; right: 12px;
            font-size: 11px;
            color: var(--text-light);
            background: var(--bg-card);
            padding: 2px 6px;
            border: 1px solid var(--border);
            border-radius: 4px;
            pointer-events: none;
        }

        /* 底部工具栏 */
        .upload-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 8px;
        }
        .byte-actions { display: flex; gap: 8px; }
        .btn-xs { padding: 3px 8px; font-size: 11px; height: 24px; }
        
        #fileInput { display: none; }

        /* =========================================
           6. 设置选项 (Clean Inputs)
           ========================================= */
        .field-row { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
        .field-block { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 6px; }
        .field-label { font-size: 12px; color: var(--text-sub); font-weight: 500;}

        input[type="text"], input[type="password"] {
            width: 100%;
            background: transparent;
            border: 1px solid var(--border);
            padding: 8px 10px;
            border-radius: var(--radius);
            font-size: 13px;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s;
        }
        input:focus {
            border-color: var(--border-active);
            background: var(--bg-card);
        }
        .hint { font-size: 11px; color: var(--text-light); }
        
        /* TTL Group - Segmented Control Style */
        .ttl-group {
            display: inline-flex;
            background: var(--bg-hover);
            padding: 2px;
            border-radius: 4px;
        }
        .ttl-btn {
            border: none;
            background: transparent;
            color: var(--text-sub);
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 3px;
            font-weight: 400;
        }
        .ttl-btn:hover { color: var(--text-main); }
        .ttl-btn.active {
            background: var(--bg-card);
            color: var(--text-main);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            font-weight: 500;
        }

        /* =========================================
           7. 结果展示 (Code Block Style)
           ========================================= */
        .result-box {
            margin-top: 24px;
            background: var(--bg-hover);
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .result-link {
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--text-main);
            word-break: break-all;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--border-hover);
        }
        .result-actions { display: flex; gap: 8px; align-items: center; justify-content: flex-end;}
        
        .status-msg { 
            font-size: 12px; margin-top: 8px; text-align: right; color: var(--text-sub); 
            height: 18px; 
        }
        .status-msg.success { color: var(--success); }
        .status-msg.error { color: var(--danger); }

        /* =========================================
           8. 弹窗样式 (Centered Clean)
           ========================================= */
        .modal-backdrop, .uc-backdrop, .sub-menu-backdrop {
            position: fixed; inset: 0;
            background: rgba(255, 255, 255, 0.8); /* 浅色遮罩 */
            backdrop-filter: blur(2px);
            z-index: 50;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        body.theme-dark .modal-backdrop, 
        body.theme-dark .uc-backdrop, 
        body.theme-dark .sub-menu-backdrop {
            background: rgba(0, 0, 0, 0.7);
        }

        .modal-backdrop[style*="display: flex"],
        .uc-backdrop[style*="display: flex"],
        .sub-menu-backdrop[style*="display: flex"] {
            opacity: 1; pointer-events: auto;
        }

        .auth-panel, .sub-menu { 
            width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 24px;
        }
        .auth-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;}
        .auth-title { font-size: 14px; font-weight: 500; }
        
        .uc-panel { 
            width: 100%; max-width: 680px; height: 70vh; 
            padding: 0; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .uc-header { 
            padding: 16px 20px; border-bottom: 1px solid var(--border); 
            display: flex; justify-content: space-between; align-items: center; 
            background: var(--bg-body);
        }
        .uc-body { flex: 1; overflow-y: auto; padding: 20px; background: var(--bg-card); }
        
        /* 列表项 */
        .uc-item {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 6px;
        }
        .uc-item:last-child { border-bottom: none; }
        .uc-item-top { display: flex; justify-content: space-between; align-items: baseline; }
        .uc-title { font-size: 13px; font-weight: 500; display: flex; gap: 8px; align-items: center;}
        .uc-tag { font-size: 11px; padding: 1px 6px; background: var(--bg-hover); border-radius: 4px; color: var(--text-sub); }
        .uc-meta { font-size: 11px; color: var(--text-light); }
        .uc-actions-row { display: flex; justify-content: flex-end; gap: 6px; margin-top: 4px; }
        .uc-sub-btn { color: var(--accent); border-color: var(--accent); }
        .uc-sub-btn:hover { background: var(--accent); color: white; }

        /* 订阅弹窗 */
        .sub-menu-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .sub-pill {
            padding: 8px; text-align: center; border: 1px solid var(--border); border-radius: 4px;
            font-size: 12px; cursor: pointer; color: var(--text-sub);
        }
        .sub-pill.active { border-color: var(--text-main); color: var(--text-main); font-weight: 500; background: var(--bg-hover); }

        .footer { text-align: center; margin-top: 40px; font-size: 12px; color: var(--text-light); }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .card { padding: 20px; }
            .field-row { flex-direction: column; gap: 12px; }
            .header { padding: 0; }
        }
    </style>
</head>
<body class="theme-light">

<div class="shell">
    <header class="header">
        <a href="#" class="brand">
            <div class="brand-logo"><img id="brandIcon" alt="Logo"></div>
            <div class="brand-text">
                <div class="brand-title">PasteBox</div>
            </div>
        </a>
        <div class="header-actions">
            <button type="button" class="theme-toggle" id="themeToggle" title="切换主题">
                <span class="icon-svg theme-icon-sun">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2"/><path d="M12 21v2"/><path d="M4.22 4.22l1.42 1.42"/><path d="M18.36 18.36l1.42 1.42"/><path d="M1 12h2"/><path d="M21 12h2"/><path d="M4.22 19.78l1.42-1.42"/><path d="M18.36 5.64l1.42-1.42"/></svg>
                </span>
                <span class="icon-svg theme-icon-moon" style="display:none">
                    <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </span>
            </button>

            <button type="button" class="btn-secondary" id="btnHome" style="display:none;">
                返回首页
            </button>

            <button type="button" class="btn-secondary" id="btnAuthOpen">
                <span class="icon-svg"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
                <span id="btnAuthLabel">登录</span>
            </button>
        </div>
    </header>

    <main class="card" id="mainCard">
        <form id="pasteForm">
            <section class="card-section">
                <div class="section-title">文本内容</div>
                
                <div class="textarea-wrap">
                    <textarea id="content" placeholder="在此输入或粘贴..." required></textarea>
                    <div class="line-counter" id="lineCounter">0 行</div>
                </div>

                <div class="upload-row">
                    <div style="display:flex; gap:8px; align-items:center;">
                        <span id="byteNum">0 B</span>
                        <span id="nodeInfo" style="color:var(--success); display:none;"></span>
                        <span class="hint" id="fileHint" style="margin-left:8px;"></span>
                    </div>

                    <div class="byte-actions">
                        <label class="btn-secondary btn-xs upload-btn" for="fileInput">导入文件</label>
                        <input type="file" id="fileInput" accept="*">
                        
                        <button type="button" class="btn-secondary btn-xs" id="btnBase64Encode">Base64编码</button>
                        <button type="button" class="btn-secondary btn-xs" id="btnBase64Decode">解码</button>
                    </div>
                </div>
            </section>

            <section class="card-section">
                <div class="section-title">设置选项</div>
                
                <div class="field-row">
                    <div class="field-block">
                        <div class="field-label">过期时间 (TTL)</div>
                        <div class="ttl-group" id="ttlGroup">
                            <button type="button" class="ttl-btn" data-ttl="10m">10分</button>
                            <button type="button" class="ttl-btn" data-ttl="1d">1天</button>
                            <button type="button" class="ttl-btn active" data-ttl="7d">7天</button>
                            <button type="button" class="ttl-btn" data-ttl="30d">30天</button>
                            <button type="button" class="ttl-btn" data-ttl="forever" id="ttlForeverBtn">永久</button>
                        </div>
                        <div class="hint" id="ttlHint">内容将在 7 天后自动删除。</div>
                    </div>

                    <div id="advancedSection" class="field-block" style="flex: 1.5;">
                        <div class="field-label">自定义与备注</div>
                        <div style="display:flex; gap:8px;">
                            <input id="customId" type="text" placeholder="自定义ID (可选)">
                            <input id="remark" type="text" placeholder="备注 (仅自己可见)">
                        </div>
                        <div class="hint" id="customHint">支持 A-Z, 0-9, -_</div>
                    </div>
                </div>
            </section>

            <div style="margin-top:24px; display:flex; justify-content:space-between; align-items:center;">
                <button type="button" class="btn-reset" id="btnResetContent">清空内容</button>
                <button type="submit" class="btn-primary" id="submitBtn">
                    <span class="text">发布 Paste</span>
                </button>
            </div>
            
            <div id="statusMsg" class="status-msg"></div>

            <div id="resultBox" style="display:none;">
                <div class="result-box">
                    <div style="font-size:12px; font-weight:500; color:var(--success);">发布成功</div>
                    <div class="result-link" id="viewLinkText"></div>
                    <div class="result-actions">
                        <button type="button" class="btn-secondary btn-xs" id="btnCopyView">复制链接</button>
                        <button type="button" class="btn-secondary btn-xs" id="btnOpenView">打开</button>
                        <button type="button" class="btn-secondary btn-xs" id="btnManageFromResult" style="display:none;">管理</button>
                    </div>
                </div>
            </div>
        </form>

        <div class="footer">
            Server: <span id="baseUrlText"></span>
        </div>
    </main>
</div>

<div class="modal-backdrop" id="authModal" style="display:none;">
    <div class="auth-panel">
        <div class="auth-header">
            <div class="auth-title">用户登录</div>
            <button type="button" class="btn-reset" id="authCloseBtn">关闭</button>
        </div>
        <form id="authForm" style="display:flex; flex-direction:column; gap:12px;">
            <input id="authUsername" type="text" placeholder="用户名" autocomplete="username">
            <input id="authPassword" type="password" placeholder="密码" autocomplete="current-password">
            <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-sub);">
                <input id="authRemember" type="checkbox" checked>
                保持登录
            </label>
            <div style="display:flex; gap:8px; margin-top:8px;">
                <button type="button" class="btn-secondary" id="btnDoRegister" style="flex:1;">注册</button>
                <button type="submit" class="btn-primary" id="btnDoLogin" style="flex:1;">登录</button>
            </div>
        </form>
        <div class="status-msg" id="authMsg" style="text-align:center;"></div>
    </div>
</div>

<div class="uc-backdrop" id="userCenter" style="display:none;">
    <div class="uc-panel">
        <div class="uc-header">
            <div class="auth-title">我的发布</div>
            <div style="display:flex; gap:8px;">
                <button type="button" class="btn-secondary btn-xs" id="ucRefreshBtn">刷新</button>
                <button type="button" class="btn-secondary btn-xs" id="ucLogoutBtn">退出</button>
                <button type="button" class="btn-reset" id="ucCloseBtn">关闭</button>
            </div>
        </div>
        <div class="uc-body">
            <div id="ucEmpty" style="text-align:center; padding:40px; color:var(--text-light);">加载中...</div>
            <div id="ucList" style="display:none; flex-direction:column;"></div>
        </div>
    </div>
</div>

<div class="sub-menu-backdrop" id="subClientOverlay" style="display:none;">
    <div class="sub-menu">
        <div class="auth-header">
            <div class="auth-title">选择订阅格式</div>
            <button type="button" class="btn-reset" id="subMenuCloseBtn">关闭</button>
        </div>
        <div class="sub-menu-list">
            <div class="sub-pill active" data-client="general">通用格式</div>
            <div class="sub-pill" data-client="base64">Base64</div>
            <div class="sub-pill" data-client="clash">Clash</div>
            <div class="sub-pill" data-client="surge">Surge</div>
        </div>
        <div style="display:flex; gap:6px;">
            <input id="subLinkInput" type="text" readonly style="font-size:11px;">
            <button type="button" class="btn-secondary btn-xs" id="subLinkCopyBtn">复制</button>
        </div>
    </div>
</div>

<script>
    // -------------------------------------------------------------
    // 逻辑部分 (中文适配版)
    // -------------------------------------------------------------
    const THEME_KEY="lyn_paste_theme_v5_simple";
    const themeToggle=document.getElementById("themeToggle");
    const sunIcon=document.querySelector(".theme-icon-sun");
    const moonIcon=document.querySelector(".theme-icon-moon");

    function applyTheme(t){
        document.body.classList.remove("theme-light","theme-dark");
        document.body.classList.add("theme-"+t);
        if(t==="dark"){
            if(sunIcon)sunIcon.style.display="none";
            if(moonIcon)moonIcon.style.display="inline-flex";
        }else{
            if(sunIcon)sunIcon.style.display="inline-flex";
            if(moonIcon)moonIcon.style.display="none";
        }
        try{localStorage.setItem(THEME_KEY,t);}catch(_){}
    }

    (function(){
        let t="light";
        try{
            const s=localStorage.getItem(THEME_KEY);
            if(s==="dark"||s==="light")t=s;
            else if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t="dark";
        }catch(_){}
        applyTheme(t);
    })();
    themeToggle && themeToggle.addEventListener("click",()=>{
        const cur=document.body.classList.contains("theme-dark")?"dark":"light";
        applyTheme(cur==="dark"?"light":"dark");
    });
    
    // 图标逻辑
    (function(){
        const ICONS=[];
        for(let i=1;i<=10;i++)ICONS.push(`https://save.aura.us.kg/Picture/Preview/YL${i}.png`);
        const img=document.getElementById("brandIcon");

    function base64EncodeUtf8(str) {
        try { return btoa(unescape(encodeURIComponent(str))); } catch (_) { return null; }
    }
    function base64DecodeUtf8(str) {
        try { return decodeURIComponent(escape(atob(str))); } catch (_) { return null; }
    }

    function detectNodes(raw) {
        const text = (raw || "").trim();
        if (!text) return { isNode:false, count:0, fromBase64:false };
        const schemes = ["ss://","ssr://","vmess://","vless://","trojan://","hysteria://","hysteria2://","hy2://","tuic://","socks://","socks5://"];
        function countIn(str) {
            let count = 0;
            str.split(/\r\n|\r|\n/).forEach(line => {
                const s = line.trim();
                if (!s) return;
                for (const p of schemes) {
                    if (s.startsWith(p)) { count++; break; }
                }
            });
            return count;
        }
        let count = countIn(text);
        if (count > 0) return { isNode:true, count, fromBase64:false };
        const compact = text.replace(/\s+/g,"");
        if (compact.length >= 16 && compact.length % 4 === 0 && /^[A-Za-z0-9+/=]+$/.test(compact)) {
            const decoded = base64DecodeUtf8(compact);
            if (decoded != null) {
                const c2 = countIn(decoded);
                if (c2 > 0) return { isNode:true, count:c2, fromBase64:true };
            }
        }
        return { isNode:false, count:0, fromBase64:false };
    }

    async function postJSON(url,body){

        if(!res.ok||data.ok===false) throw new Error(data.error||`请求失败 (${res.status})`);
        return data;
    }

    function updateByteCount(){
        if(!$content||!$byteNum)return;
        let len=0;

        $byteNum.textContent=len + " 字节";
        if($lineCounter){
            const v=$content.value||"";
            const lines=v ? v.split(/\r\n|\r|\n/).length : 0;
            $lineCounter.textContent = lines+" 行";
        }
        if ($nodeInfo) {
            const info = detectNodes($content.value || "");
            if (info.isNode && info.count > 0) {
                $nodeInfo.textContent = `检测到 ${info.count} 个节点`;
                $nodeInfo.style.display="inline";
            } else {
                $nodeInfo.style.display="none";
            }
        }
    }

    function formatDate(d){
        if(!d)return"-"; const dt=new Date(d);
        if(Number.isNaN(dt.getTime()))return"-";

    }
    function calcRemainDays(expires){
        if(!expires)return null;
        const t=new Date(expires).getTime();
        if(Number.isNaN(t))return null;
        return Math.ceil((t-Date.now())/86400000);
    }

    function buildSubLink(slug, clientKey) {
        const base = `${location.origin}/autosub?id=${encodeURIComponent(slug)}`;

        return `${base}&client=${encodeURIComponent(clientKey)}`;

    let currentSubSlug = null;

    function closeSubClientMenu() { currentSubSlug = null; hideModal("subClientOverlay"); }
    (function initSubClientMenu(){
        const overlay = document.getElementById("subClientOverlay");
        if (!overlay) return;
        const closeBtn = document.getElementById("subMenuCloseBtn");
        const input = document.getElementById("subLinkInput");
        const copyBtn = document.getElementById("subLinkCopyBtn");
        const pills = Array.from(overlay.querySelectorAll(".sub-pill"));
        let selected = "general";
        function refresh(){
            pills.forEach(btn=>{
                const key = btn.getAttribute("data-client") || "general";
                btn.classList.toggle("active", key === selected);
            });
            if (input) input.value = currentSubSlug ? buildSubLink(currentSubSlug, selected) : "";
        }
        function setSelected(key){ selected = key || "general"; refresh(); }
        window.__subMenuSync = function(){ selected = "general"; refresh(); };
        if (closeBtn) closeBtn.addEventListener("click", closeSubClientMenu);
        overlay.addEventListener("click",(e)=>{ if (e.target === overlay) closeSubClientMenu(); });
        pills.forEach(btn=>{
            btn.addEventListener("click", ()=>{ setSelected(btn.getAttribute("data-client")); });
        });
        if (copyBtn) copyBtn.addEventListener("click", async ()=>{
            if (!currentSubSlug) return;
            const url = buildSubLink(currentSubSlug, selected);
            try{
                await navigator.clipboard.writeText(url); setStatus("链接已复制","success");
            }catch(_){ window.prompt("复制链接:", url); }
            closeSubClientMenu();
        });
        refresh();
    })();

    async function loadUserPastes(){
        if(!$ucEmpty||!$ucList)return;
        $ucEmpty.style.display="block"; $ucEmpty.textContent="加载中...";
        $ucList.style.display="none"; $ucList.innerHTML="";
        try{
            const res=await fetch(location.origin+"/api/me/pastes",{credentials:"include"});
            if(res.status===401){ $ucEmpty.textContent="登录已过期"; setLoggedOut(); return; }
            const data=await res.json().catch(()=>({}));
            if(!data.ok){ $ucEmpty.textContent=data.error||"加载失败"; return; }
            const items=data.items||[];
            if(!items.length){ $ucEmpty.textContent="暂无记录"; return; }

            const valid=[];
            await Promise.all(items.map(async (item)=>{
                const slug=item.slug||item.id; if(!slug)return;
                try{
                    const u=new URL(`${API_BASE}/${encodeURIComponent(slug)}`);
                    u.searchParams.set("manage","1");
                    const r=await fetch(u.toString(),{credentials:"include"});
                    if(!r.ok)return;
                    const d=await r.json().catch(()=>null);
                    if(!d||d.ok===false)return;
                    const remain=calcRemainDays(d.expiresAt);
                    if(remain!=null && remain<0)return;
                    d._nodeInfo = detectNodes(d.content || "");
                    valid.push(d);
                }catch(_){}
            }));
            if(!valid.length){ $ucEmpty.textContent="没有有效记录"; return; }
            valid.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

            $ucEmpty.style.display="none"; $ucList.style.display="flex";
            valid.forEach(d=>{
                const slug=d.slug;
                const remark=d.remark||"无备注";
                const expires=d.expiresAt||null;
                const ttlKey=d.ttlKey||"";
                const viewUrl=`${VIEW_BASE}/${encodeURIComponent(slug)}`;
                const remain=calcRemainDays(expires);
                const nodeInfo = d._nodeInfo;
                const hasNode = !!nodeInfo.isNode && nodeInfo.count > 0;

                const row=document.createElement("div");
                row.className="uc-item";
                let metaText="";
                if(!expires || ttlKey==="forever"){ metaText=`永久有效`; }
                else{ metaText+=`过期时间: ${formatDate(expires)}`; if(remain!=null && remain>=0) metaText+=` (剩${remain}天)`; }

                row.innerHTML=`
                    <div class="uc-item-top">
                        <div class="uc-title">
                            <span style="font-weight:600;">${escapeHTML(slug)}</span>
                            <span class="uc-tag">${escapeHTML(remark)}</span>
                        </div>
                        <div class="uc-meta">${metaText}</div>
                    </div>
                    <div class="uc-actions-row">
                        ${hasNode ? `<button type="button" class="btn-secondary btn-xs uc-sub-btn">订阅(${nodeInfo.count})</button>` : ''}
                        <button type="button" class="btn-secondary btn-xs uc-edit-btn">编辑</button>
                        <button type="button" class="btn-secondary btn-xs uc-copy-btn">复制</button>
                        <button type="button" class="btn-secondary btn-xs uc-open-btn">打开</button>
                        <button type="button" class="btn-reset uc-del-btn" style="color:var(--danger)">删除</button>
                    </div>
                `;
                if(hasNode) row.querySelector(".uc-sub-btn").addEventListener("click",()=>openSubClientMenu(slug));
                row.querySelector(".uc-edit-btn").addEventListener("click",()=>{ closeUserCenter(); enterEditMode(slug); });
                row.querySelector(".uc-copy-btn").addEventListener("click",async ()=>{
                    try{ await navigator.clipboard.writeText(viewUrl); setStatus("已复制","success"); }catch(_){}
                });
                row.querySelector(".uc-open-btn").addEventListener("click",()=>{ window.open(viewUrl,"_blank","noopener"); });
                row.querySelector(".uc-del-btn").addEventListener("click",async ()=>{
                    if(!confirm("确定删除?"))return;
                    try{
                        await postJSON(API_BASE,{action:"delete",slug}); loadUserPastes(); setStatus("已删除","success");
                    }catch(err){ setStatus(err.message||"失败","error"); }
                });
                $ucList.appendChild(row);
            });
        }catch(err){ $ucEmpty.textContent="加载错误"; }
    }

            if(!res.ok||data.ok===false) throw new Error("未找到内容");

            let slug=null, newSlug=null;
            if(state.mode==="edit"){
                slug=state.originalSlug;
                if($customId){ const v=$customId.value.trim(); if(v&&v!==slug)newSlug=v; }
            }else{
                if(state.loggedIn&&$customId){ const v=$customId.value.trim(); if(v)slug=v; }
            }
            const payload={
                action:state.mode==="edit"?"update":"create",
                content:text, ttlKey:state.ttlKey, remark:$remark?$remark.value.trim():""
            };
            if(slug)payload.slug=slug;

            state.isSubmitting=true;
            if($submitBtn) { const s=$submitBtn.querySelector(".text"); if(s)s.textContent="提交中..."; }

    document.addEventListener("keydown",e=>{
        if(e.key==="Escape"){
            const sub = document.getElementById("subClientOverlay");
            if(sub && sub.style.display==="flex"){ closeSubClientMenu(); return; }
            if($userCenter&&$userCenter.style.display==="flex")closeUserCenter();
            else if($authModal&&$authModal.style.display==="flex")closeAuthModal();
        }
    });
    (async function init(){ await initAuthFromServer(); applyAuthUI(); })();
</script>
</body>
</html>
